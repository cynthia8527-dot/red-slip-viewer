<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品／價格／製程知識庫</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1120px,calc(100% - 24px));margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 6px}.sub{margin:0;color:#6b7280}.muted{color:#667085}
.head,.tools,.actions,.vendorHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;align-items:flex-start}
.btn,.back{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}.btn:disabled{opacity:.55;cursor:default}
.btn.primary,.back{background:#202124;color:#fff}.btn.secondary{background:#e9ecef;color:#202124}
.badge{display:inline-block;margin-top:9px;padding:6px 10px;border-radius:999px;background:#eaf8ef;color:#067647;font-weight:800;font-size:12px}
.status{padding:12px;border-radius:12px;background:#f7f7f8;color:#666;margin:14px 0}.searchbar{margin:18px 0}.searchbar input{width:100%}
label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}select,input,textarea{width:100%;padding:11px 12px;border:1px solid #d7dbe2;border-radius:11px;background:#fff;font-size:15px}textarea{min-height:80px}

.vendorHead{justify-content:space-between;margin:18px 0 8px}.vendorHead h2{margin:0;font-size:24px}.vendorHead .left{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.backVendor{border:0;border-radius:10px;padding:9px 12px;background:#eef1f4;font-weight:850;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #e0e3e8;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.photo{height:235px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;color:#8a929c;font-size:12px;cursor:pointer}.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.body{padding:14px;display:flex;flex-direction:column;gap:7px;height:100%}.name{font-size:19px;font-weight:900}.meta{font-size:13px;color:#555}.price{font-size:24px;font-weight:900}.miniProcess{font-size:11px;line-height:1.35;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}.card .actions{margin-top:auto}.card .actions .btn{flex:1;padding:9px}.empty{grid-column:1/-1;padding:32px;text-align:center;color:#777;border:1px dashed #ccd1d7;border-radius:14px}
.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}.auth a{display:inline-block;margin-top:10px;background:#202124;color:#fff;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:800}
dialog{width:min(92vw,700px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.46)}.dlg{padding:20px}.dlg h2{margin:0 0 6px}.dlgSub{margin:0 0 14px;color:#667085}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.sectionTitle{grid-column:1/-1;margin-top:7px;padding-top:13px;border-top:1px solid #e7e9ed;font-weight:900}.preview{width:100%;height:220px;background:#eef1f4;border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#8a929c}.preview img{display:block;width:100%;height:100%;object-fit:contain;background:#eef1f4}.hint{font-size:12px;color:#667085;margin-top:5px}.adminOnly{display:none}.isAdmin .adminOnly{display:inline-flex}.cropnote{margin-top:7px;font-size:12px;color:#067647;font-weight:700}
#detailDialog{width:min(96vw,920px);max-height:94vh}.detailWrap{padding:16px}.detailTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.detailTop h2{margin:0;font-size:24px}.detailClose{border:0;border-radius:10px;background:#e9ecef;width:40px;height:40px;font-size:22px;cursor:pointer;flex:none}.detailPhoto{width:100%;min-height:280px;max-height:62vh;background:#eef1f4;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#8a929c}.detailPhoto img{display:block;width:100%;height:100%;max-height:62vh;object-fit:contain;background:#eef1f4}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.detailBox{background:#f7f7f8;border-radius:11px;padding:10px 12px;line-height:1.5;min-height:64px}.detailBox b{display:block;font-size:11px;color:#667085;margin-bottom:3px}.detailBox.full{grid-column:1/-1}.detailPrice{font-size:26px;font-weight:900}
@media(max-width:820px){main{padding:18px}.grid,.vendorGrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full,.sectionTitle{grid-column:1}.photo{height:220px}}
@media(max-width:520px){main{width:min(100% - 12px,1120px);margin:8px auto;padding:15px}.grid,.vendorGrid{grid-template-columns:1fr}.back{width:100%;text-align:center}.vendorHead{align-items:flex-start}.vendorHead .tools{width:100%}.vendorHead .tools .btn{flex:1}.photo{height:280px}.detailGrid{grid-template-columns:1fr}.detailBox.full{grid-column:1}.detailPhoto{min-height:240px;max-height:58vh}.detailPhoto img{max-height:58vh}}

</head>
<body>
<section id="authGate" class="auth"><h1>產品／價格／製程知識庫</h1><p>這一頁只開放給已登入的工廠帳號。</p><a href="../board/">前往登入／貨件進度</a></section>
<main id="app" hidden>
  <div class="head"><div><h1>產品／價格／製程知識庫</h1><p class="sub">先選廠商，再看這個廠商的商品。</p><div id="roleBadge" class="badge">🔒 已登入</div></div><a class="back" href="../board/">← 返回貨件進度</a></div>
  <section id="vendorView">
    <div class="tools" style="margin-top:16px"><button id="newVendor" class="btn primary adminOnly">＋ 新廠商／第一個商品</button></div>
    <div class="searchbar"><label>找廠商</label><input id="vendorSearch" placeholder="輸入廠商名稱"></div>
    <div id="vendorStatus" class="status">正在讀取廠商…</div><section id="vendorGrid" class="vendorGrid"></section>
  </section>
  <section id="productView" hidden>
    <div class="vendorHead"><div class="left"><button id="backVendors" class="backVendor">← 廠商列表</button><div><h2 id="currentVendor"></h2><div class="muted">只顯示這個廠商的商品與價格</div></div></div><div class="tools"><button id="newProduct" class="btn primary adminOnly">＋ 新增商品</button><button id="linkProduct" class="btn secondary adminOnly">＋ 加入既有商品</button></div></div>
    <div class="searchbar"><label>搜尋這個廠商的商品</label><input id="productSearch" placeholder="搜尋商品、材質、製程…"></div>
    <div id="status" class="status"></div><section id="grid" class="grid"></section>
  </section>
</main>

<dialog id="detailDialog"><div class="detailWrap"><div class="detailTop"><div><h2 id="dName"></h2><div id="dVendor" class="muted"></div></div><button id="detailClose" class="detailClose" type="button">×</button></div><div id="detailPhoto" class="detailPhoto">尚未上傳商品照片</div><div class="detailGrid"><div class="detailBox"><b>材質</b><span id="dMaterial"></span></div><div class="detailBox"><b>價格</b><span id="dPrice" class="detailPrice"></span></div><div class="detailBox"><b>最低計價</b><span id="dMinimum"></span></div><div class="detailBox"><b>標準製程</b><span id="dStdProcess"></span></div><div class="detailBox"><b>這個廠商製程</b><span id="dVendorProcess"></span></div><div class="detailBox full"><b>製程／注意事項</b><span id="dNotes"></span></div><div class="detailBox"><b>生效日期</b><span id="dDate"></span></div><div class="detailBox"><b>價格備註</b><span id="dPriceNote"></span></div></div></div></dialog>

<dialog id="productDialog"><form class="dlg" method="dialog"><h2 id="productTitle">新增商品</h2><p id="productDialogVendor" class="dlgSub"></p><div class="formgrid"><div class="full"><label>商品名稱 *</label><input id="pName" required></div><div><label>材質</label><input id="pMaterial"></div><div><label>標準製程</label><input id="pProcess"></div><div class="full"><label>製程／注意事項</label><textarea id="pNotes"></textarea></div><div class="full"><label>商品參考照片</label><input id="pPhoto" type="file" accept="image/*"><div class="hint">選照片後會自動去掉四周大片空白，下面預覽就是實際保存範圍。</div><div id="cropState" class="cropnote"></div><div id="pPreview" class="preview" style="margin-top:8px">尚未上傳照片</div></div><div id="newProductPriceFields" class="sectionTitle">這個廠商的價格</div><div id="npPriceWrap"><label>單價 *</label><input id="npPrice" type="number" step="any" min="0"></div><div id="npMinimumWrap"><label>最低計價</label><input id="npMinimum" type="number" step="any" min="0" placeholder="例如 300；沒有就留空"><div class="hint">例：15 元/kg，但不足 300 元時收 300。</div></div><div id="npUnitWrap"><label>單位</label><input id="npUnit" value="kg"></div><div id="npProcessWrap"><label>廠商製程</label><input id="npVendorProcess"></div><div id="npDateWrap"><label>生效日期</label><input id="npDate" type="date"></div><div id="npNoteWrap" class="full"><label>價格備註</label><textarea id="npPriceNote"></textarea></div></div><div class="actions" style="margin-top:14px"><button id="saveProduct" type="button" class="btn primary">儲存</button><button id="cancelProduct" type="button" class="btn secondary">取消</button></div></form></dialog>

<dialog id="priceDialog"><form class="dlg" method="dialog"><h2 id="priceTitle">加入既有商品</h2><p class="dlgSub">廠商：<b id="priceVendorLabel"></b></p><div class="formgrid"><div class="full"><label>商品 *</label><select id="prProduct"></select></div><div><label>單價 *</label><input id="prPrice" type="number" step="any" min="0"></div><div><label>最低計價</label><input id="prMinimum" type="number" step="any" min="0" placeholder="沒有就留空"></div><div><label>單位</label><input id="prUnit" value="kg"></div><div><label>該廠商製程</label><input id="prProcess"></div><div><label>生效日期</label><input id="prDate" type="date"></div><div class="full"><label>價格備註</label><textarea id="prNote"></textarea></div></div><div class="actions" style="margin-top:14px"><button id="savePrice" type="button" class="btn primary">儲存</button><button id="cancelPrice" type="button" class="btn secondary">取消</button></div></form></dialog>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const supabase=createClient('https://icqdmzndjmxffnlciijs.supabase.co','sb_publishable_PUUgMuSNqlOFDaC8PvQ0KA_EcxNfhF6',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
const productDialog=$('productDialog'),priceDialog=$('priceDialog'),detailDialog=$('detailDialog');
let products=[],prices=[],rows=[],isAdmin=false,editingProduct=null,editingPrice=null,selectedVendor='',photoUrls=new Map();
let pendingPhotoBlob=null,pendingPhotoUrl=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v,f='—'){return v===null||v===undefined||v===''?f:String(v)}
async function signedPhoto(path){if(!path)return null;if(photoUrls.has(path))return photoUrls.get(path);const {data,error}=await supabase.storage.from('factory-photos').createSignedUrl(path,3600);if(error)return null;photoUrls.set(path,data.signedUrl);return data.signedUrl}
async function load(){try{const {data:{session}}=await supabase.auth.getSession();if(!session)return showAuth();const {data:profile,error:pe}=await supabase.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(pe||!profile?.active){await supabase.auth.signOut();return showAuth()}isAdmin=profile.role==='admin';document.body.classList.toggle('isAdmin',isAdmin);$('roleBadge').textContent=isAdmin?'🔐 管理員模式':'🔒 唯讀模式';$('authGate').hidden=true;$('app').hidden=false;const [{data:p,error:e1},{data:v,error:e2}]=await Promise.all([supabase.from('products').select('*').eq('is_active',true).order('name'),supabase.from('vendor_prices').select('*').order('vendor_name')]);if(e1||e2)throw e1||e2;products=p||[];prices=v||[];for(const p of products)p.photo_url=await signedPhoto(p.reference_photo_path);const pMap=new Map(products.map(p=>[p.id,p]));rows=prices.map(x=>({...x,product:pMap.get(x.product_id)})).filter(x=>x.product);renderVendors();if(selectedVendor)showVendor(selectedVendor,true)}catch(err){console.error(err);$('vendorStatus').textContent='讀取失敗：'+(err.message||err)}}
function showAuth(){$('authGate').hidden=false;$('app').hidden=true}
function vendorNames(){return [...new Set(rows.map(r=>r.vendor_name))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function renderVendors(){const q=$('vendorSearch').value.trim().toLowerCase(),vendors=vendorNames().filter(v=>!q||v.toLowerCase().includes(q));$('vendorStatus').textContent=`${vendorNames().length} 家廠商｜先選廠商再看商品`;$('vendorGrid').innerHTML=vendors.length?vendors.map(v=>{const count=rows.filter(r=>r.vendor_name===v).length;return `<button class="vendorCard" data-vendor="${esc(v)}"><div class="vendorName">${esc(v)}</div><div class="vendorCount">${count} 個商品</div><div class="vendorArrow">查看商品 →</div></button>`}).join(''):'<div class="empty">沒有符合的廠商</div>';document.querySelectorAll('[data-vendor]').forEach(b=>b.onclick=()=>showVendor(b.dataset.vendor))}
function showVendor(v,keepSearch=false){selectedVendor=v;$('currentVendor').textContent=v;$('vendorView').hidden=true;$('productView').hidden=false;if(!keepSearch)$('productSearch').value='';renderProducts()}
function showVendorList(){selectedVendor='';$('productView').hidden=true;$('vendorView').hidden=false;renderVendors()}
function currentRows(){const q=$('productSearch').value.trim().toLowerCase();return rows.filter(r=>r.vendor_name===selectedVendor&&(!q||[r.product.name,r.product.material,r.product.standard_process,r.product.process_notes,r.process_name,r.note].some(x=>String(x||'').toLowerCase().includes(q))))}

function renderProducts(){const list=currentRows();$('status').textContent=`${selectedVendor}｜${rows.filter(r=>r.vendor_name===selectedVendor).length} 個商品`;$('grid').innerHTML=list.length?list.map((r,i)=>{const p=r.product;return `<article class="card"><div class="photo" data-detail="${i}">${photoHtml(p)}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="meta">${esc(text(p.material))}｜${esc(text(r.unit))}</div><div class="price">NT$ ${fmt.format(Number(r.unit_price)||0)} <span style="font-size:13px;font-weight:600">/ ${esc(text(r.unit))}</span></div>${r.minimum_charge!==null&&r.minimum_charge!==undefined&&r.minimum_charge!==''?`<div class="meta">最低計價 NT$ ${fmt.format(Number(r.minimum_charge)||0)}</div>`:''}<div class="miniProcess">⚙ ${esc(text(r.process_name||p.standard_process))}</div><div class="actions"><button class="btn secondary" data-detail="${i}">詳細</button>${isAdmin?`<button class="btn secondary" data-product="${p.id}">改商品</button><button class="btn secondary" data-price="${r.id}">改價格</button>`:''}</div></div></article>`}).join(''):'<div class="empty">這個廠商目前沒有商品。'+(isAdmin?' 可以按「＋ 新增商品」。':'')+'</div>';document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(list[+b.dataset.detail]));document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(b.dataset.product));document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>openPrice(b.dataset.price))}
function openDetail(r){if(!r)return;const p=r.product;$('dName').textContent=p.name;$('dVendor').textContent=selectedVendor;$('dMaterial').textContent=text(p.material);$('dPrice').textContent=`NT$ ${fmt.format(Number(r.unit_price)||0)} / ${text(r.unit)}`;$('dMinimum').textContent=r.minimum_charge!==null&&r.minimum_charge!==undefined&&r.minimum_charge!==''?`NT$ ${fmt.format(Number(r.minimum_charge)||0)}`:'無';$('dStdProcess').textContent=text(p.standard_process);$('dVendorProcess').textContent=text(r.process_name);$('dNotes').textContent=text(p.process_notes);$('dDate').textContent=text(r.effective_date);$('dPriceNote').textContent=text(r.note);$('detailPhoto').innerHTML=p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.name)}完整商品圖">`:'尚未上傳商品照片';detailDialog.showModal()}
function clearPendingPhoto(){pendingPhotoBlob=null;if(pendingPhotoUrl){URL.revokeObjectURL(pendingPhotoUrl);pendingPhotoUrl=null}$('cropState').textContent=''}
function setPreview(p){$('pPreview').innerHTML=p?.photo_url?`<img src="${esc(p.photo_url)}" alt="目前照片">`:'尚未上傳照片'}
function toggleNewPriceFields(show){['newProductPriceFields','npPriceWrap','npMinimumWrap','npUnitWrap','npProcessWrap','npDateWrap','npNoteWrap'].forEach(id=>$(id).hidden=!show)}
function openProduct(id=null){if(!isAdmin||!selectedVendor)return;clearPendingPhoto();editingProduct=id?products.find(p=>p.id===id):null;$('productTitle').textContent=editingProduct?'修改商品':'新增商品';$('productDialogVendor').textContent=`廠商：${selectedVendor}`;$('pName').value=editingProduct?.name||'';$('pMaterial').value=editingProduct?.material||'';$('pProcess').value=editingProduct?.standard_process||'';$('pNotes').value=editingProduct?.process_notes||'';$('pPhoto').value='';setPreview(editingProduct);toggleNewPriceFields(!editingProduct);$('npPrice').value='';$('npMinimum').value='';$('npUnit').value='kg';$('npVendorProcess').value='';$('npDate').value='';$('npPriceNote').value='';productDialog.showModal()}
function averagePatch(data,w,h,cx,cy,r=3){let rr=0,gg=0,bb=0,n=0;for(let y=Math.max(0,cy-r);y<=Math.min(h-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(w-1,cx+r);x++){const i=(y*w+x)*4;rr+=data[i];gg+=data[i+1];bb+=data[i+2];n++}return[rr/n,gg/n,bb/n]}
function nearestCornerDistance(r,g,b,corners){let best=1e9;for(const c of corners){const dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr+dg*dg+db*db;if(d<best)best=d}return Math.sqrt(best)}
async function autoCropImage(file){if(file.size>10*1024*1024)throw new Error('照片超過 10 MB');const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'}),sw=bitmap.width,sh=bitmap.height,scale=Math.min(1,800/Math.max(sw,sh)),aw=Math.max(1,Math.round(sw*scale)),ah=Math.max(1,Math.round(sh*scale));const ac=document.createElement('canvas');ac.width=aw;ac.height=ah;const actx=ac.getContext('2d',{willReadFrequently:true});actx.drawImage(bitmap,0,0,aw,ah);const img=actx.getImageData(0,0,aw,ah),d=img.data,corners=[averagePatch(d,aw,ah,2,2,3),averagePatch(d,aw,ah,aw-3,2,3),averagePatch(d,aw,ah,2,ah-3,3),averagePatch(d,aw,ah,aw-3,ah-3,3)],rowCounts=new Uint32Array(ah),colCounts=new Uint32Array(aw);let fgTotal=0;for(let y=0;y<ah;y++)for(let x=0;x<aw;x++){const i=(y*aw+x)*4;if(nearestCornerDistance(d[i],d[i+1],d[i+2],corners)>38){rowCounts[y]++;colCounts[x]++;fgTotal++}}const rowNeed=Math.max(3,Math.round(aw*.006)),colNeed=Math.max(3,Math.round(ah*.006));let top=0,bottom=ah-1,left=0,right=aw-1;while(top<ah-1&&rowCounts[top]<rowNeed)top++;while(bottom>top&&rowCounts[bottom]<rowNeed)bottom--;while(left<aw-1&&colCounts[left]<colNeed)left++;while(right>left&&colCounts[right]<colNeed)right--;const bw=right-left+1,bh=bottom-top+1,useful=fgTotal>aw*ah*.002&&bw>aw*.12&&bh>ah*.12;if(useful){const mx=Math.round(aw*.045),my=Math.round(ah*.045);left=Math.max(0,left-mx);right=Math.min(aw-1,right+mx);top=Math.max(0,top-my);bottom=Math.min(ah-1,bottom+my)}else{left=0;right=aw-1;top=0;bottom=ah-1}const sx=Math.round(left/scale),sy=Math.round(top/scale),cw=Math.min(sw-sx,Math.max(1,Math.round((right-left+1)/scale))),ch=Math.min(sh-sy,Math.max(1,Math.round((bottom-top+1)/scale))),outScale=Math.min(1,1800/Math.max(cw,ch)),ow=Math.max(1,Math.round(cw*outScale)),oh=Math.max(1,Math.round(ch*outScale)),out=document.createElement('canvas');out.width=ow;out.height=oh;out.getContext('2d').drawImage(bitmap,sx,sy,cw,ch,0,0,ow,oh);bitmap.close?.();const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error('照片處理失敗')),'image/jpeg',.9));return{blob,cropped:useful&&(cw<sw*.95||ch<sh*.95)}}
async function handlePhotoChange(){clearPendingPhoto();const f=$('pPhoto').files[0];if(!f){setPreview(editingProduct);return}$('cropState').textContent='正在自動裁掉四周空白…';$('pPreview').textContent='處理照片中…';try{const result=await autoCropImage(f);pendingPhotoBlob=result.blob;pendingPhotoUrl=URL.createObjectURL(result.blob);$('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="裁切預覽">`;$('cropState').textContent=result.cropped?'✓ 已自動去掉四周大片空白':'✓ 沒偵測到明顯空白邊，保留原本構圖'}catch(e){pendingPhotoBlob=f;pendingPhotoUrl=URL.createObjectURL(f);$('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="原圖預覽">`;$('cropState').textContent='自動裁切失敗，這次保存原圖：'+e.message}}
async function saveProduct(){if(!isAdmin||!selectedVendor)return;const name=$('pName').value.trim();if(!name)return alert('請填商品名稱');if(!editingProduct&&$('npPrice').value==='')return alert('請填這個廠商的單價');$('saveProduct').disabled=true;try{const payload={name,material:$('pMaterial').value.trim()||null,standard_process:$('pProcess').value.trim()||null,process_notes:$('pNotes').value.trim()||null};let product;if(editingProduct){const {data,error}=await supabase.from('products').update(payload).eq('id',editingProduct.id).select().single();if(error)throw error;product=data}else{const {data,error}=await supabase.from('products').insert(payload).select().single();if(error)throw error;product=data;const {error:ve}=await supabase.from('vendor_prices').insert({vendor_name:selectedVendor,product_id:product.id,unit_price:Number($('npPrice').value),minimum_charge:$('npMinimum').value===''?null:Number($('npMinimum').value),unit:$('npUnit').value.trim()||'kg',process_name:$('npVendorProcess').value.trim()||null,effective_date:$('npDate').value||null,note:$('npPriceNote').value.trim()||null});if(ve)throw ve}if(pendingPhotoBlob){const path=`products/${product.id}/${Date.now()}.jpg`;const {error:ue}=await supabase.storage.from('factory-photos').upload(path,pendingPhotoBlob,{contentType:'image/jpeg',upsert:false});if(ue)throw ue;const {error:pe}=await supabase.from('products').update({reference_photo_path:path}).eq('id',product.id);if(pe)throw pe}productDialog.close();clearPendingPhoto();photoUrls.clear();await load()}catch(e){alert('儲存失敗：'+e.message)}finally{$('saveProduct').disabled=false}}
function availableProductsForVendor(){const used=new Set(prices.filter(x=>x.vendor_name===selectedVendor).map(x=>x.product_id));return products.filter(p=>!used.has(p.id))}
function openPrice(id=null){if(!isAdmin||!selectedVendor)return;editingPrice=id?prices.find(x=>x.id===id):null;$('priceTitle').textContent=editingPrice?'修改價格':'加入既有商品';$('priceVendorLabel').textContent=selectedVendor;const list=editingPrice?products:availableProductsForVendor();$('prProduct').innerHTML=list.map(p=>`<option value="${p.id}">${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('')||'<option value="">沒有其他既有商品</option>';$('prProduct').disabled=!!editingPrice;$('prProduct').value=editingPrice?.product_id||list[0]?.id||'';$('prPrice').value=editingPrice?.unit_price??'';$('prMinimum').value=editingPrice?.minimum_charge??'';$('prUnit').value=editingPrice?.unit||'kg';$('prProcess').value=editingPrice?.process_name||'';$('prDate').value=editingPrice?.effective_date||'';$('prNote').value=editingPrice?.note||'';priceDialog.showModal()}
async function savePrice(){if(!isAdmin||!selectedVendor)return;const product_id=$('prProduct').value,unit_price=$('prPrice').value;if(!product_id||unit_price==='')return alert('商品和單價要填');$('savePrice').disabled=true;try{const payload={vendor_name:selectedVendor,product_id,unit_price:Number(unit_price),minimum_charge:$('prMinimum').value===''?null:Number($('prMinimum').value),unit:$('prUnit').value.trim()||'kg',process_name:$('prProcess').value.trim()||null,effective_date:$('prDate').value||null,note:$('prNote').value.trim()||null};const q=editingPrice?supabase.from('vendor_prices').update(payload).eq('id',editingPrice.id):supabase.from('vendor_prices').insert(payload);const {error}=await q;if(error)throw error;priceDialog.close();await load()}catch(e){alert('儲存失敗：'+e.message)}finally{$('savePrice').disabled=false}}
$('vendorSearch').oninput=renderVendors;$('productSearch').oninput=renderProducts;$('backVendors').onclick=showVendorList;$('newProduct').onclick=()=>openProduct();$('linkProduct').onclick=()=>openPrice();$('newVendor').onclick=()=>{const v=prompt('新廠商名稱');if(!v?.trim())return;showVendor(v.trim());openProduct()};$('saveProduct').onclick=saveProduct;$('savePrice').onclick=savePrice;$('cancelProduct').onclick=()=>{clearPendingPhoto();productDialog.close()};$('cancelPrice').onclick=()=>priceDialog.close();$('pPhoto').onchange=handlePhotoChange;productDialog.addEventListener('close',clearPendingPhoto);$('detailClose').onclick=()=>detailDialog.close();detailDialog.onclick=e=>{if(e.target===detailDialog)detailDialog.close()};load();
</script>
