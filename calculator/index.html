<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品／價格／製程知識庫</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1120px,calc(100% - 24px));margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 6px}.sub{margin:0;color:#6b7280}.muted{color:#667085}
.head,.tools,.actions,.vendorHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;align-items:flex-start}
.btn,.back{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}.btn:disabled{opacity:.55;cursor:default}
.btn.primary,.back{background:#202124;color:#fff}.btn.secondary{background:#e9ecef;color:#202124}.btn.danger{background:#fff0ef;color:#b42318}.card.isInactive{opacity:.62}.offBadge{display:inline-block;padding:4px 7px;border-radius:999px;background:#fff0ef;color:#b42318;font-size:11px;font-weight:850}
.badge{display:inline-block;margin-top:9px;padding:6px 10px;border-radius:999px;background:#eaf8ef;color:#067647;font-weight:800;font-size:12px}
.status{padding:12px;border-radius:12px;background:#f7f7f8;color:#666;margin:14px 0}.searchbar{margin:18px 0}.searchbar input{width:100%}
label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}select,input,textarea{width:100%;padding:11px 12px;border:1px solid #d7dbe2;border-radius:11px;background:#fff;font-size:15px}textarea{min-height:80px}
.vendorGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.vendorCard{border:1px solid #e0e3e8;border-radius:16px;padding:16px;background:#fff;cursor:pointer;text-align:left}.vendorCard:hover{background:#fafafa}.vendorName{font-size:20px;font-weight:900}.vendorCount{margin-top:7px;color:#667085;font-size:13px}.vendorArrow{margin-top:12px;font-weight:800;color:#344054}
.vendorHead{justify-content:space-between;margin:18px 0 8px}.vendorHead h2{margin:0;font-size:24px}.vendorHead .left{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.backVendor{border:0;border-radius:10px;padding:9px 12px;background:#eef1f4;font-weight:850;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #e0e3e8;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.photo{height:235px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;color:#8a929c;font-size:12px;cursor:pointer}.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.body{padding:14px;display:flex;flex-direction:column;gap:7px;height:100%}.name{font-size:19px;font-weight:900}.meta{font-size:13px;color:#555}.price{font-size:24px;font-weight:900}.miniProcess{font-size:11px;line-height:1.35;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}.card .actions{margin-top:auto}.card .actions .btn{flex:1;padding:9px}.empty{grid-column:1/-1;padding:32px;text-align:center;color:#777;border:1px dashed #ccd1d7;border-radius:14px}
.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}.auth a{display:inline-block;margin-top:10px;background:#202124;color:#fff;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:800}
dialog{width:min(92vw,700px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.46)}.dlg{padding:20px}.dlg h2{margin:0 0 6px}.dlgSub{margin:0 0 14px;color:#667085}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.sectionTitle{grid-column:1/-1;margin-top:7px;padding-top:13px;border-top:1px solid #e7e9ed;font-weight:900}.preview{width:100%;height:220px;background:#eef1f4;border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#8a929c}.preview img{display:block;width:100%;height:100%;object-fit:contain;background:#eef1f4}.hint{font-size:12px;color:#667085;margin-top:5px}.adminOnly{display:none}.isAdmin .adminOnly{display:inline-flex}.cropnote{margin-top:7px;font-size:12px;color:#067647;font-weight:700}
#detailDialog{width:min(96vw,920px);max-height:94vh}.detailWrap{padding:16px}.detailTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.detailTop h2{margin:0;font-size:24px}.detailClose{border:0;border-radius:10px;background:#e9ecef;width:40px;height:40px;font-size:22px;cursor:pointer;flex:none}.detailPhoto{width:100%;min-height:280px;max-height:62vh;background:#eef1f4;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#8a929c}.detailPhoto img{display:block;width:100%;height:100%;max-height:62vh;object-fit:contain;background:#eef1f4}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.detailBox{background:#f7f7f8;border-radius:11px;padding:10px 12px;line-height:1.5;min-height:64px}.detailBox b{display:block;font-size:11px;color:#667085;margin-bottom:3px}.detailBox.full{grid-column:1/-1}.detailPrice{font-size:26px;font-weight:900}.priceHistory{display:grid;gap:7px;margin-top:6px}.priceHistoryRow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:9px;padding:8px 10px;font-size:13px}.priceHistoryRow .range{color:#667085;font-size:12px}.priceHistoryRow .amount{font-weight:900}.priceHistoryRow .state{font-size:11px;font-weight:850;padding:4px 7px;border-radius:999px;background:#eef1f4}.priceHistoryRow .state.current{background:#eaf8ef;color:#067647}.priceHistoryRow .state.future{background:#fff3cd;color:#795b00}
@media(max-width:820px){main{padding:18px}.grid,.vendorGrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full,.sectionTitle{grid-column:1}.photo{height:220px}}
@media(max-width:520px){main{width:min(100% - 12px,1120px);margin:8px auto;padding:15px}.grid,.vendorGrid{grid-template-columns:1fr}.back{width:100%;text-align:center}.vendorHead{align-items:flex-start}.vendorHead .tools{width:100%}.vendorHead .tools .btn{flex:1}.photo{height:280px}.detailGrid{grid-template-columns:1fr}.detailBox.full{grid-column:1}.detailPhoto{min-height:240px;max-height:58vh}.detailPhoto img{max-height:58vh}}
.homeMini{display:inline-block;margin:0 0 8px;color:#667085;text-decoration:none;font-size:11px;font-weight:800;background:#f7f8fa;border:1px solid #e2e6ea;border-radius:999px;padding:4px 8px;line-height:1.2}.homeMini:hover{color:#202124}\n</style>
</head>
<body>
<section id="authGate" class="auth"><h1>產品／價格／製程知識庫</h1><p>這一頁只開放給已登入的工廠帳號。</p><a href="../board/">前往登入／貨件進度</a></section>
<main id="app" hidden>\n<a class="homeMini" href="../">← 工具首頁</a>
  <div class="head"><div><h1>產品／價格／製程知識庫</h1><p class="sub">先選廠商，再看這個廠商的商品。</p><div id="roleBadge" class="badge">🔒 已登入</div></div><div class="tools"><a class="back" href="../vendors/">🏢 廠商資料庫</a><a class="back" href="../board/">← 返回貨件進度</a></div></div>
  <section id="vendorView">
    <div class="tools" style="margin-top:16px"><button id="newVendor" class="btn primary adminOnly">＋ 新廠商／第一個商品</button></div>
    <div class="searchbar"><label>找廠商</label><input id="vendorSearch" placeholder="輸入廠商名稱"></div>
    <div id="vendorStatus" class="status">正在讀取廠商…</div><section id="vendorGrid" class="vendorGrid"></section>
  </section>
  <section id="productView" hidden>
    <div class="vendorHead"><div class="left"><button id="backVendors" class="backVendor">← 廠商列表</button><div><h2 id="currentVendor"></h2><div class="muted">只顯示這個廠商的商品與價格</div></div></div><div class="tools"><label class="adminOnly" style="gap:6px;align-items:center;font-size:13px;font-weight:800"><input id="showInactive" type="checkbox" style="width:auto"> 顯示停用商品</label><button id="newProduct" class="btn primary adminOnly">＋ 新增商品</button><button id="linkProduct" class="btn secondary adminOnly">＋ 加入既有商品</button></div></div>
    <div class="searchbar"><label>搜尋這個廠商的商品</label><input id="productSearch" placeholder="搜尋商品、材質、製程…"></div>
    <div id="status" class="status"></div><section id="grid" class="grid"></section>
  </section>
</main>

<dialog id="detailDialog"><div class="detailWrap"><div class="detailTop"><div><h2 id="dName"></h2><div id="dVendor" class="muted"></div></div><button id="detailClose" class="detailClose" type="button">×</button></div><div id="detailPhoto" class="detailPhoto">尚未上傳商品照片</div><div class="detailGrid"><div class="detailBox"><b>材質</b><span id="dMaterial"></span></div><div class="detailBox"><b>價格</b><span id="dPrice" class="detailPrice"></span></div><div class="detailBox"><b>最低計價</b><span id="dMinimum"></span></div><div class="detailBox"><b>標準製程</b><span id="dStdProcess"></span></div><div class="detailBox"><b>這個廠商製程</b><span id="dVendorProcess"></span></div><div class="detailBox full"><b>製程／注意事項</b><span id="dNotes"></span></div><div class="detailBox"><b>生效日期</b><span id="dDate"></span></div><div class="detailBox"><b>價格備註</b><span id="dPriceNote"></span></div><div class="detailBox full"><b>價格歷史</b><div id="dPriceHistory" class="priceHistory"></div></div></div></div></dialog>

<dialog id="productDialog"><form class="dlg" method="dialog"><h2 id="productTitle">新增商品</h2><p id="productDialogVendor" class="dlgSub"></p><div class="formgrid"><div class="full"><label>商品名稱 *</label><input id="pName" required></div><div><label>材質</label><input id="pMaterial"></div><div><label>標準製程</label><input id="pProcess" list="processOptions" placeholder="可選常用製程或直接輸入"></div><div class="full"><label>製程／注意事項</label><textarea id="pNotes"></textarea></div><div class="full"><label>商品參考照片</label><input id="pPhoto" type="file" accept="image/*"><div class="hint">選照片後會自動去掉四周大片空白，下面預覽就是實際保存範圍。</div><div id="cropState" class="cropnote"></div><div id="pPreview" class="preview" style="margin-top:8px">尚未上傳照片</div></div><div id="newProductPriceFields" class="sectionTitle">這個廠商的價格</div><div id="npPriceWrap"><label>單價 *</label><input id="npPrice" type="number" step="any" min="0"></div><div id="npMinimumWrap"><label>最低計價</label><input id="npMinimum" type="number" step="any" min="0" placeholder="例如 300；沒有就留空"><div class="hint">例：15 元/kg，但不足 300 元時收 300。</div></div><div id="npUnitWrap"><label>單位</label><input id="npUnit" value="kg"></div><div id="npProcessWrap"><label>廠商製程</label><input id="npVendorProcess" list="processOptions" placeholder="可選常用製程或直接輸入"></div><div id="npDateWrap"><label>生效日期</label><input id="npDate" type="date"></div><div id="npNoteWrap" class="full"><label>價格備註</label><textarea id="npPriceNote"></textarea></div></div><div class="actions" style="margin-top:14px"><button id="saveProduct" type="button" class="btn primary">儲存</button><button id="cancelProduct" type="button" class="btn secondary">取消</button></div></form></dialog>

<dialog id="priceDialog"><form class="dlg" method="dialog"><h2 id="priceTitle">加入既有商品</h2><p class="dlgSub">廠商：<b id="priceVendorLabel"></b></p><div class="formgrid"><div class="full"><label>商品 *</label><select id="prProduct"></select></div><div id="prCurrentWrap" class="full" hidden><label>目前價格</label><div id="prCurrentPrice" class="status" style="margin:0"></div></div><div><label id="prPriceLabel">單價 *</label><input id="prPrice" type="number" step="any" min="0"></div><div><label>最低計價</label><input id="prMinimum" type="number" step="any" min="0" placeholder="沒有就留空"></div><div><label>單位</label><input id="prUnit" value="kg"></div><div><label>該廠商製程</label><input id="prProcess" list="processOptions" placeholder="可選常用製程或直接輸入"></div><div><label>生效日期</label><input id="prDate" type="date"></div><div class="full"><label>價格備註</label><textarea id="prNote"></textarea></div></div><div class="actions" style="margin-top:14px"><button id="savePrice" type="button" class="btn primary">儲存</button><button id="cancelPrice" type="button" class="btn secondary">取消</button></div></form></dialog>

<datalist id="processOptions"><option value="研亮"></option><option value="研毛邊"></option><option value="洗油"></option></datalist>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';
import {resolveConfig} from '../config.js';
import {priceIsEffective as sharedPriceIsEffective,selectCurrentPrices,priceHistory} from '../data/pricing.js';
const APP_CONFIG=await resolveConfig();
const supabase=createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
const productDialog=$('productDialog'),priceDialog=$('priceDialog'),detailDialog=$('detailDialog');
const PENDING_CALCULATOR_PRODUCT_CREATE='factory-calculator:pending-product-create';
let products=[],prices=[],rows=[],vendors=[],isAdmin=false,editingProduct=null,editingPrice=null,selectedVendor='',selectedVendorId=null,showInactive=false,photoUrls=new Map();
let pendingPhotoBlob=null,pendingPhotoUrl=null,pendingCalculatorProductCreate=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v,f='—'){return v===null||v===undefined||v===''?f:String(v)}function taipeiDate(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return p.find(x=>x.type==='year').value+'-'+p.find(x=>x.type==='month').value+'-'+p.find(x=>x.type==='day').value}function priceIsEffective(r,date=taipeiDate()){return sharedPriceIsEffective(r,date)}function currentPriceRecords(){return selectCurrentPrices(prices,taipeiDate())}function historyFor(r){return priceHistory(prices,r)}
async function signedPhoto(path){if(!path)return null;if(photoUrls.has(path))return photoUrls.get(path);const {data,error}=await supabase.storage.from(APP_CONFIG.storageBucket).createSignedUrl(path,3600);if(error)return null;photoUrls.set(path,data.signedUrl);return data.signedUrl}
async function load(){try{const {data:{session}}=await supabase.auth.getSession();if(!session)return showAuth();const {data:profile,error:pe}=await supabase.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(pe||!profile?.active){await supabase.auth.signOut();return showAuth()}isAdmin=profile.role==='admin';document.body.classList.toggle('isAdmin',isAdmin);$('roleBadge').textContent=isAdmin?'🔐 管理員模式':'🔒 唯讀模式';$('authGate').hidden=true;$('app').hidden=false;const [{data:p,error:e1},{data:v,error:e2},{data:vm,error:e3}]=await Promise.all([supabase.from('products').select('*').order('name'),supabase.from('vendor_prices').select('*').order('vendor_name'),supabase.from('vendors').select('*').eq('is_active',true).order('short_name')]);if(e1||e2||e3)throw e1||e2||e3;products=p||[];prices=v||[];vendors=vm||[];for(const p of products)p.photo_url=await signedPhoto(p.reference_photo_path);const pMap=new Map(products.map(p=>[p.id,p]));rows=currentPriceRecords().map(x=>({...x,product:pMap.get(x.product_id)})).filter(x=>x.product);renderVendors();if(selectedVendor)showVendor(selectedVendor,selectedVendorId,true)}catch(err){console.error(err);$('vendorStatus').textContent='讀取失敗：'+(err.message||err)}}
function showAuth(){$('authGate').hidden=false;$('app').hidden=true}
function calculatorProductCreateRequest(body){const serialized=JSON.stringify(body);if(!pendingCalculatorProductCreate){try{pendingCalculatorProductCreate=JSON.parse(sessionStorage.getItem(PENDING_CALCULATOR_PRODUCT_CREATE)||'null')}catch{pendingCalculatorProductCreate=null}}if(!pendingCalculatorProductCreate||pendingCalculatorProductCreate.body!==serialized){pendingCalculatorProductCreate={key:crypto.randomUUID(),body:serialized};try{sessionStorage.setItem(PENDING_CALCULATOR_PRODUCT_CREATE,JSON.stringify(pendingCalculatorProductCreate))}catch{}}return pendingCalculatorProductCreate}
function clearCalculatorProductCreateRequest(key){if(pendingCalculatorProductCreate?.key!==key)return;pendingCalculatorProductCreate=null;try{sessionStorage.removeItem(PENDING_CALCULATOR_PRODUCT_CREATE)}catch{}}
function vendorChoices(){const formal=vendors.map(v=>({id:v.id,name:v.short_name,code:v.code||'',formal:true}));const formalNames=new Set(formal.map(v=>v.name));const legacy=[...new Set(rows.filter(r=>!r.vendor_id&&!formalNames.has(r.vendor_name)).map(r=>r.vendor_name))].map(name=>({id:null,name,code:'',formal:false}));return [...formal,...legacy].sort((a,b)=>(a.code||a.name).localeCompare(b.code||b.name,'zh-Hant'))}
function rowsForVendor(id,name){return rows.filter(r=>id?(r.vendor_id===id||(!r.vendor_id&&r.vendor_name===name)):(!r.vendor_id&&r.vendor_name===name))}
function activeRowsForVendor(id,name){return rowsForVendor(id,name).filter(r=>r.product?.is_active!==false)}
function renderVendors(){const q=$('vendorSearch').value.trim().toLowerCase(),choices=vendorChoices().filter(v=>!q||[v.name,v.code].some(x=>String(x||'').toLowerCase().includes(q)));$('vendorStatus').textContent=`${vendorChoices().length} 家廠商｜廠商主檔有建立就會直接出現在這裡`;$('vendorGrid').innerHTML=choices.length?choices.map(v=>{const count=activeRowsForVendor(v.id,v.name).length;return `<button class="vendorCard" data-vendor-name="${esc(v.name)}" data-vendor-id="${esc(v.id||'')}"><div class="vendorName">${esc(v.name)}</div><div class="vendorCount">${v.code?esc(v.code)+'｜':''}${count} 個商品</div><div class="vendorArrow">${count?'查看商品 →':'0 個商品｜新增第一個 →'}</div></button>`}).join(''):'<div class="empty">沒有符合的廠商</div>';document.querySelectorAll('[data-vendor-name]').forEach(b=>b.onclick=()=>showVendor(b.dataset.vendorName,b.dataset.vendorId||null))}
function showVendor(v,id=null,keepSearch=false){selectedVendor=v;selectedVendorId=id||null;$('currentVendor').textContent=v;$('vendorView').hidden=true;$('productView').hidden=false;if(!keepSearch)$('productSearch').value='';renderProducts()}
function showVendorList(){selectedVendor='';selectedVendorId=null;$('productView').hidden=true;$('vendorView').hidden=false;renderVendors()}
function currentRows(){const q=$('productSearch').value.trim().toLowerCase();return rowsForVendor(selectedVendorId,selectedVendor).filter(r=>(showInactive||r.product?.is_active!==false)&&(!q||[r.product.name,r.product.material,r.product.standard_process,r.product.process_notes,r.process_name,r.note].some(x=>String(x||'').toLowerCase().includes(q))))}
function photoHtml(p){return p.photo_url?`<img src="${esc(p.photo_url)}" alt="商品圖">`:'尚未上傳商品照片'}
function renderProducts(){const list=currentRows();$('status').textContent=`${selectedVendor}｜${activeRowsForVendor(selectedVendorId,selectedVendor).length} 個啟用商品${showInactive?'｜目前包含停用商品':''}`;$('grid').innerHTML=list.length?list.map((r,i)=>{const p=r.product,off=p.is_active===false;return `<article class="card ${off?'isInactive':''}"><div class="photo" data-detail="${i}">${photoHtml(p)}</div><div class="body"><div class="name">${esc(p.name)} ${off?'<span class="offBadge">已停用</span>':''}</div><div class="meta">${esc(text(p.material))}｜${esc(text(r.unit))}</div><div class="price">NT$ ${fmt.format(Number(r.unit_price)||0)} <span style="font-size:13px;font-weight:600">/ ${esc(text(r.unit))}</span></div>${r.minimum_charge!==null&&r.minimum_charge!==undefined&&r.minimum_charge!==''?`<div class="meta">最低計價 NT$ ${fmt.format(Number(r.minimum_charge)||0)}</div>`:''}<div class="miniProcess">⚙ ${esc(text(r.process_name||p.standard_process))}</div><div class="actions"><button class="btn secondary" data-detail="${i}">詳細</button>${isAdmin?`<button class="btn secondary" data-product="${p.id}">改商品</button><button class="btn secondary" data-price="${r.id}">改價格</button><button class="btn secondary" data-toggle-product="${p.id}">${off?'重新啟用':'停用商品'}</button><button class="btn danger" data-unlink="${r.id}">移除此廠商商品</button>`:''}</div></div></article>`}).join(''):'<div class="empty">這個廠商目前沒有商品。'+(isAdmin?' 可以按「＋ 新增商品」。':'')+'</div>';document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(list[+b.dataset.detail]));document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(b.dataset.product));document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>openPrice(b.dataset.price));document.querySelectorAll('[data-toggle-product]').forEach(b=>b.onclick=()=>toggleProductActive(b.dataset.toggleProduct));document.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>unlinkVendorPrice(b.dataset.unlink))}
function openDetail(r){if(!r)return;const p=r.product,history=historyFor(r),today=taipeiDate();$('dName').textContent=p.name;$('dVendor').textContent=selectedVendor;$('dMaterial').textContent=text(p.material);$('dPrice').textContent=`NT$ ${fmt.format(Number(r.unit_price)||0)} / ${text(r.unit)}`;$('dMinimum').textContent=r.minimum_charge!==null&&r.minimum_charge!==undefined&&r.minimum_charge!==''?`NT$ ${fmt.format(Number(r.minimum_charge)||0)}`:'無';$('dStdProcess').textContent=text(p.standard_process);$('dVendorProcess').textContent=text(r.process_name);$('dNotes').textContent=text(p.process_notes);$('dDate').textContent=text(r.effective_date);$('dPriceNote').textContent=text(r.note);$('dPriceHistory').innerHTML=history.length?history.map(h=>{const future=h.effective_date&&h.effective_date>today,current=priceIsEffective(h,today),state=current?'目前使用':future?'未生效':'已停用',cls=current?'current':future?'future':'';const start=h.effective_date||'最早',end=h.end_date||'現在';return `<div class="priceHistoryRow"><div class="range">${esc(start)} ～ ${esc(end)}</div><div><span class="amount">NT$ ${fmt.format(Number(h.unit_price)||0)} / ${esc(text(h.unit))}</span>${h.minimum_charge!==null&&h.minimum_charge!==undefined&&h.minimum_charge!==''?`<div class="range">最低 NT$ ${fmt.format(Number(h.minimum_charge)||0)}</div>`:''}${h.note?`<div class="range">${esc(h.note)}</div>`:''}</div><span class="state ${cls}">${state}</span></div>`}).join(''):'<div class="muted">尚無價格歷史</div>';$('detailPhoto').innerHTML=p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.name)}完整商品圖">`:'尚未上傳商品照片';detailDialog.showModal()}
function clearPendingPhoto(){pendingPhotoBlob=null;if(pendingPhotoUrl){URL.revokeObjectURL(pendingPhotoUrl);pendingPhotoUrl=null}$('cropState').textContent=''}
function setPreview(p){$('pPreview').innerHTML=p?.photo_url?`<img src="${esc(p.photo_url)}" alt="目前照片">`:'尚未上傳照片'}
function toggleNewPriceFields(show){['newProductPriceFields','npPriceWrap','npMinimumWrap','npUnitWrap','npProcessWrap','npDateWrap','npNoteWrap'].forEach(id=>$(id).hidden=!show)}
function openProduct(id=null){if(!isAdmin||!selectedVendor)return;clearPendingPhoto();editingProduct=id?products.find(p=>p.id===id):null;$('productTitle').textContent=editingProduct?'修改商品':'新增商品';$('productDialogVendor').textContent=`廠商：${selectedVendor}`;$('pName').value=editingProduct?.name||'';$('pMaterial').value=editingProduct?.material||'';$('pProcess').value=editingProduct?.standard_process||'';$('pNotes').value=editingProduct?.process_notes||'';$('pPhoto').value='';setPreview(editingProduct);toggleNewPriceFields(!editingProduct);$('npPrice').value='';$('npMinimum').value='';$('npUnit').value='kg';$('npVendorProcess').value='';$('npDate').value=taipeiDate();$('npPriceNote').value='';productDialog.showModal()}
function averagePatch(data,w,h,cx,cy,r=3){let rr=0,gg=0,bb=0,n=0;for(let y=Math.max(0,cy-r);y<=Math.min(h-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(w-1,cx+r);x++){const i=(y*w+x)*4;rr+=data[i];gg+=data[i+1];bb+=data[i+2];n++}return[rr/n,gg/n,bb/n]}
function nearestCornerDistance(r,g,b,corners){let best=1e9;for(const c of corners){const dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr+dg*dg+db*db;if(d<best)best=d}return Math.sqrt(best)}
async function autoCropImage(file){if(file.size>10*1024*1024)throw new Error('照片超過 10 MB');const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'}),sw=bitmap.width,sh=bitmap.height,scale=Math.min(1,800/Math.max(sw,sh)),aw=Math.max(1,Math.round(sw*scale)),ah=Math.max(1,Math.round(sh*scale));const ac=document.createElement('canvas');ac.width=aw;ac.height=ah;const actx=ac.getContext('2d',{willReadFrequently:true});actx.drawImage(bitmap,0,0,aw,ah);const img=actx.getImageData(0,0,aw,ah),d=img.data,corners=[averagePatch(d,aw,ah,2,2,3),averagePatch(d,aw,ah,aw-3,2,3),averagePatch(d,aw,ah,2,ah-3,3),averagePatch(d,aw,ah,aw-3,ah-3,3)],rowCounts=new Uint32Array(ah),colCounts=new Uint32Array(aw);let fgTotal=0;for(let y=0;y<ah;y++)for(let x=0;x<aw;x++){const i=(y*aw+x)*4;if(nearestCornerDistance(d[i],d[i+1],d[i+2],corners)>38){rowCounts[y]++;colCounts[x]++;fgTotal++}}const rowNeed=Math.max(3,Math.round(aw*.006)),colNeed=Math.max(3,Math.round(ah*.006));let top=0,bottom=ah-1,left=0,right=aw-1;while(top<ah-1&&rowCounts[top]<rowNeed)top++;while(bottom>top&&rowCounts[bottom]<rowNeed)bottom--;while(left<aw-1&&colCounts[left]<colNeed)left++;while(right>left&&colCounts[right]<colNeed)right--;const bw=right-left+1,bh=bottom-top+1,useful=fgTotal>aw*ah*.002&&bw>aw*.12&&bh>ah*.12;if(useful){const mx=Math.round(aw*.045),my=Math.round(ah*.045);left=Math.max(0,left-mx);right=Math.min(aw-1,right+mx);top=Math.max(0,top-my);bottom=Math.min(ah-1,bottom+my)}else{left=0;right=aw-1;top=0;bottom=ah-1}const sx=Math.round(left/scale),sy=Math.round(top/scale),cw=Math.min(sw-sx,Math.max(1,Math.round((right-left+1)/scale))),ch=Math.min(sh-sy,Math.max(1,Math.round((bottom-top+1)/scale))),outScale=Math.min(1,1800/Math.max(cw,ch)),ow=Math.max(1,Math.round(cw*outScale)),oh=Math.max(1,Math.round(ch*outScale)),out=document.createElement('canvas');out.width=ow;out.height=oh;out.getContext('2d').drawImage(bitmap,sx,sy,cw,ch,0,0,ow,oh);bitmap.close?.();const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error('照片處理失敗')),'image/jpeg',.9));return{blob,cropped:useful&&(cw<sw*.95||ch<sh*.95)}}
async function handlePhotoChange(){clearPendingPhoto();const f=$('pPhoto').files[0];if(!f){setPreview(editingProduct);return}$('cropState').textContent='正在自動裁掉四周空白…';$('pPreview').textContent='處理照片中…';try{const result=await autoCropImage(f);pendingPhotoBlob=result.blob;pendingPhotoUrl=URL.createObjectURL(result.blob);$('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="裁切預覽">`;$('cropState').textContent=result.cropped?'✓ 已自動去掉四周大片空白':'✓ 沒偵測到明顯空白邊，保留原本構圖'}catch(e){pendingPhotoBlob=f;pendingPhotoUrl=URL.createObjectURL(f);$('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="原圖預覽">`;$('cropState').textContent='自動裁切失敗，這次保存原圖：'+e.message}}
async function saveProduct(){
  if(!isAdmin||!selectedVendor)return;
  const name=$('pName').value.trim();
  if(!name)return alert('請填商品名稱');
  if(!editingProduct&&$('npPrice').value==='')return alert('請填這個廠商的單價');
  $('saveProduct').disabled=true;
  let product,request=null,productCreated=false;
  try{
    const payload={name,material:$('pMaterial').value.trim()||null,standard_process:$('pProcess').value.trim()||null,process_notes:$('pNotes').value.trim()||null};
    if(editingProduct){
      const {data,error}=await supabase.from('products').update(payload).eq('id',editingProduct.id).select().single();
      if(error)throw error;
      product=data;
    }else{
      const body={
        p_name:name,p_material:payload.material,p_standard_process:payload.standard_process,p_process_notes:payload.process_notes,
        p_vendor_name:selectedVendor,p_vendor_id:selectedVendorId||null,p_unit_price:Number($('npPrice').value),
        p_minimum_charge:$('npMinimum').value===''?null:Number($('npMinimum').value),p_unit:$('npUnit').value.trim()||'kg',
        p_vendor_process:$('npVendorProcess').value.trim()||null,p_price_note:$('npPriceNote').value.trim()||null,
        p_effective_date:$('npDate').value||taipeiDate()
      };
      request=calculatorProductCreateRequest(body);
      const {data,error}=await supabase.rpc('create_product_with_initial_price_idempotent',{p_request_id:request.key,...body});
      if(error)throw error;
      product=data.product;
      productCreated=true;
      clearCalculatorProductCreateRequest(request.key);
    }
    if(pendingPhotoBlob){
      try{
        const path=`products/${product.id}/${request?.key||crypto.randomUUID()}.jpg`;
        const {error:uploadError}=await supabase.storage.from(APP_CONFIG.storageBucket).upload(path,pendingPhotoBlob,{contentType:'image/jpeg',upsert:false});
        if(uploadError)throw uploadError;
        const {error:pathError}=await supabase.from('products').update({reference_photo_path:path}).eq('id',product.id);
        if(pathError){
          const {error:cleanupError}=await supabase.storage.from(APP_CONFIG.storageBucket).remove([path]);
          if(cleanupError)throw new Error(`${pathError.message}；且已上傳圖片清除失敗：${cleanupError.message}`);
          throw pathError;
        }
      }catch(photoError){
        productDialog.close();clearPendingPhoto();photoUrls.clear();await load();
        alert((productCreated?'商品與價格已建立，不要再按新增':'商品資料已儲存')+'；照片未完成，請用「改商品」補傳：'+photoError.message);
        return;
      }
    }
    productDialog.close();clearPendingPhoto();photoUrls.clear();await load();
  }catch(e){alert('儲存失敗：'+e.message)}finally{$('saveProduct').disabled=false}
}
function availableProductsForVendor(){const used=new Set(rowsForVendor(selectedVendorId,selectedVendor).map(x=>x.product_id));return products.filter(p=>p.is_active!==false&&!used.has(p.id))}
async function toggleProductActive(id){if(!isAdmin)return;const p=products.find(x=>x.id===id);if(!p)return;const turningOff=p.is_active!==false;if(turningOff&&!confirm('停用商品後，所有廠商都不能再用它新增新貨件，但舊貨件會保留。確定停用？'))return;const {error}=await supabase.from('products').update({is_active:!turningOff,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('更新失敗：'+error.message);await load()}
async function unlinkVendorPrice(id){if(!isAdmin)return;const r=prices.find(x=>x.id===id);if(!r)return;if(!confirm('只會移除「'+selectedVendor+'」和這個商品的價格關聯，不會刪商品本體，也不會刪歷史貨件。確定移除？'))return;const {error}=await supabase.from('vendor_prices').delete().eq('id',id);if(error)return alert('移除失敗：'+error.message);await load()}
function openPrice(id=null){if(!isAdmin||!selectedVendor)return;editingPrice=id?prices.find(x=>x.id===id):null;$('priceTitle').textContent=editingPrice?'新增新價格':'加入既有商品';$('priceVendorLabel').textContent=selectedVendor;const list=editingPrice?products:availableProductsForVendor();$('prProduct').innerHTML=list.map(p=>`<option value="${p.id}">${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('')||'<option value="">沒有其他既有商品</option>';$('prProduct').disabled=!!editingPrice;$('prProduct').value=editingPrice?.product_id||list[0]?.id||'';$('prCurrentWrap').hidden=!editingPrice;$('prCurrentPrice').textContent=editingPrice?`NT$ ${fmt.format(Number(editingPrice.unit_price)||0)} / ${text(editingPrice.unit)}${editingPrice.minimum_charge!==null&&editingPrice.minimum_charge!==undefined&&editingPrice.minimum_charge!==''?'｜最低 NT$ '+fmt.format(Number(editingPrice.minimum_charge)||0):''}`:'';$('prPriceLabel').textContent=editingPrice?'新價格 *':'單價 *';$('prPrice').value=editingPrice?.unit_price??'';$('prMinimum').value=editingPrice?.minimum_charge??'';$('prUnit').value=editingPrice?.unit||'kg';$('prProcess').value=editingPrice?.process_name||'';$('prDate').value=taipeiDate();$('prNote').value='';priceDialog.showModal()}
async function savePrice(){if(!isAdmin||!selectedVendor)return;const product_id=$('prProduct').value,unit_price=$('prPrice').value,effective_date=$('prDate').value;if(!product_id||unit_price==='')return alert('商品和單價要填');if(!effective_date)return alert('請選生效日期');$('savePrice').disabled=true;try{const minimum=$('prMinimum').value===''?null:Number($('prMinimum').value),unit=$('prUnit').value.trim()||'kg',process_name=$('prProcess').value.trim()||null,note=$('prNote').value.trim()||null;if(editingPrice){const {error}=await supabase.rpc('replace_vendor_price',{p_current_price_id:editingPrice.id,p_unit_price:Number(unit_price),p_minimum_charge:minimum,p_unit:unit,p_process_name:process_name,p_effective_date:effective_date,p_note:note});if(error)throw error}else{const {error}=await supabase.from('vendor_prices').insert({vendor_name:selectedVendor,vendor_id:selectedVendorId||null,product_id,unit_price:Number(unit_price),minimum_charge:minimum,unit,process_name,effective_date,note});if(error)throw error}priceDialog.close();await load()}catch(e){alert('儲存失敗：'+e.message)}finally{$('savePrice').disabled=false}}
$('vendorSearch').oninput=renderVendors;$('productSearch').oninput=renderProducts;$('showInactive').onchange=()=>{showInactive=$('showInactive').checked;renderProducts()};$('backVendors').onclick=showVendorList;$('newProduct').onclick=()=>openProduct();$('linkProduct').onclick=()=>openPrice();$('newVendor').onclick=()=>{location.href='../vendors/'};$('saveProduct').onclick=saveProduct;$('savePrice').onclick=savePrice;$('cancelProduct').onclick=()=>{clearPendingPhoto();productDialog.close()};$('cancelPrice').onclick=()=>priceDialog.close();$('pPhoto').onchange=handlePhotoChange;productDialog.addEventListener('close',clearPendingPhoto);$('detailClose').onclick=()=>detailDialog.close();detailDialog.onclick=e=>{if(e.target===detailDialog)detailDialog.close()};load();
</script>
