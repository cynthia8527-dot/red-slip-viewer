<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品／價格／製程知識庫</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1120px,calc(100% - 24px));margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 6px}.sub{margin:0;color:#6b7280}
.head,.tools,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;align-items:flex-start}
.btn,.back{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.primary,.back{background:#202124;color:#fff}.btn.secondary{background:#e9ecef;color:#202124}
.badge{display:inline-block;margin-top:9px;padding:6px 10px;border-radius:999px;background:#eaf8ef;color:#067647;font-weight:800;font-size:12px}
.filters{display:grid;grid-template-columns:220px 1fr;gap:12px;margin:18px 0}
label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid #d7dbe2;border-radius:11px;background:#fff;font-size:15px}
textarea{min-height:80px}.status{padding:12px;border-radius:12px;background:#f7f7f8;color:#666;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid #e0e3e8;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.photo{height:150px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;color:#8a929c;font-size:12px}
.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.body{padding:14px;display:flex;flex-direction:column;gap:7px;height:100%}.vendor{font-size:12px;color:#6b7280}
.name{font-size:18px;font-weight:900}.meta{font-size:13px;color:#555}.price{font-size:24px;font-weight:900}
.process{font-size:13px;line-height:1.5;background:#f7f7f8;border-radius:10px;padding:8px}.card .actions{margin-top:auto}.card .actions .btn{flex:1;padding:9px}
.empty{grid-column:1/-1;padding:32px;text-align:center;color:#777;border:1px dashed #ccd1d7;border-radius:14px}
.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}
.auth a{display:inline-block;margin-top:10px;background:#202124;color:#fff;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:800}
dialog{width:min(92vw,680px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.46)}.dlg{padding:20px}.dlg h2{margin:0 0 14px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}
.preview{width:100%;height:220px;background:#eef1f4;border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#8a929c}
.preview img{display:block;width:100%;height:100%;object-fit:contain;background:#eef1f4}
.hint{font-size:12px;color:#667085;margin-top:5px}.adminOnly{display:none}.isAdmin .adminOnly{display:inline-flex}
.cropnote{margin-top:7px;font-size:12px;color:#067647;font-weight:700}
@media(max-width:820px){main{padding:18px}.grid{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.full{grid-column:1}}
@media(max-width:520px){main{width:min(100% - 12px,1120px);margin:8px auto;padding:15px}.grid{grid-template-columns:1fr}.back{width:100%;text-align:center}}
</style>
</head>
<body>
<section id="authGate" class="auth"><h1>產品／價格／製程知識庫</h1><p>這一頁只開放給已登入的工廠帳號。</p><a href="../board/">前往登入／貨件進度</a></section>

<main id="app" hidden>
  <div class="head">
    <div><h1>產品／價格／製程知識庫</h1><p class="sub">產品主檔、標準製程、廠商價格與參考照片。</p><div id="roleBadge" class="badge">🔒 已登入</div></div>
    <a class="back" href="../board/">← 返回貨件進度</a>
  </div>
  <div class="tools" style="margin-top:14px">
    <button id="newProduct" class="btn primary adminOnly">＋ 新增產品</button>
    <button id="newPrice" class="btn secondary adminOnly">＋ 新增廠商價格</button>
  </div>
  <section class="filters">
    <div><label>廠商</label><select id="vendor"><option value="">全部廠商</option></select></div>
    <div><label>搜尋</label><input id="search" placeholder="搜尋產品、材料、製程、廠商…"></div>
  </section>
  <div id="status" class="status">正在確認登入狀態…</div>
  <section id="grid" class="grid"></section>
</main>

<dialog id="productDialog">
  <form id="productForm" class="dlg" method="dialog">
    <h2 id="productTitle">新增產品</h2>
    <div class="formgrid">
      <div class="full"><label>產品名稱 *</label><input id="pName" required></div>
      <div><label>材質</label><input id="pMaterial"></div>
      <div><label>標準製程</label><input id="pProcess"></div>
      <div class="full"><label>製程／注意事項</label><textarea id="pNotes"></textarea></div>
      <div class="full">
        <label>產品參考照片</label>
        <input id="pPhoto" type="file" accept="image/*">
        <div class="hint">最多 10 MB。選照片後會自動去掉四周大片空白，下面預覽就是實際會保存的範圍。</div>
        <div id="cropState" class="cropnote"></div>
        <div id="pPreview" class="preview" style="margin-top:8px">尚未上傳照片</div>
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="saveProduct" type="button" class="btn primary">儲存</button>
      <button id="cancelProduct" type="button" class="btn secondary">取消</button>
    </div>
  </form>
</dialog>

<dialog id="priceDialog">
  <form id="priceForm" class="dlg" method="dialog">
    <h2 id="priceTitle">新增廠商價格</h2>
    <div class="formgrid">
      <div><label>廠商 *</label><input id="prVendor" required></div>
      <div><label>產品 *</label><select id="prProduct"></select></div>
      <div><label>單價 *</label><input id="prPrice" type="number" step="any" min="0" required></div>
      <div><label>單位</label><input id="prUnit" value="kg"></div>
      <div><label>該廠商製程</label><input id="prProcess"></div>
      <div><label>生效日期</label><input id="prDate" type="date"></div>
      <div class="full"><label>價格備註</label><textarea id="prNote"></textarea></div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="savePrice" type="button" class="btn primary">儲存</button>
      <button id="cancelPrice" type="button" class="btn secondary">取消</button>
    </div>
  </form>
</dialog>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';

const supabase=createClient(
  'https://icqdmzndjmxffnlciijs.supabase.co',
  'sb_publishable_PUUgMuSNqlOFDaC8PvQ0KA_EcxNfhF6',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

const $=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
const productDialog=$('productDialog'),priceDialog=$('priceDialog');
let products=[],prices=[],rows=[],isAdmin=false,editingProduct=null,editingPrice=null,photoUrls=new Map();
let pendingPhotoBlob=null,pendingPhotoUrl=null;

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function text(v,f='—'){return v===null||v===undefined||v===''?f:String(v)}

async function signedPhoto(path){
  if(!path)return null;
  if(photoUrls.has(path))return photoUrls.get(path);
  const {data,error}=await supabase.storage.from('factory-photos').createSignedUrl(path,3600);
  if(error)return null;
  photoUrls.set(path,data.signedUrl);
  return data.signedUrl;
}

async function load(){
  try{
    const {data:{session}}=await supabase.auth.getSession();
    if(!session)return showAuth();
    const {data:profile,error:pe}=await supabase.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();
    if(pe||!profile?.active){await supabase.auth.signOut();return showAuth()}
    isAdmin=profile.role==='admin';
    document.body.classList.toggle('isAdmin',isAdmin);
    $('roleBadge').textContent=isAdmin?'🔐 管理員模式':'🔒 唯讀模式';
    $('authGate').hidden=true;$('app').hidden=false;

    const [{data:p,error:e1},{data:v,error:e2}]=await Promise.all([
      supabase.from('products').select('*').eq('is_active',true).order('name'),
      supabase.from('vendor_prices').select('*').order('vendor_name')
    ]);
    if(e1||e2)throw e1||e2;
    products=p||[];prices=v||[];
    for(const p of products)p.photo_url=await signedPhoto(p.reference_photo_path);
    buildRows();
    $('status').textContent=`已讀取 ${products.length} 個產品、${prices.length} 筆價格資料${isAdmin?'｜可新增與修改':''}`;
    render();
  }catch(err){
    console.error(err);
    $('status').textContent='讀取失敗：'+(err.message||err);
  }
}

function showAuth(){$('authGate').hidden=false;$('app').hidden=true}

function buildRows(){
  const pMap=new Map(products.map(p=>[p.id,p]));
  rows=prices.map(x=>({...x,product:pMap.get(x.product_id)})).filter(x=>x.product);
  const vendors=[...new Set(rows.map(x=>x.vendor_name))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  $('vendor').innerHTML='<option value="">全部廠商</option>'+vendors.map(v=>`<option>${esc(v)}</option>`).join('');
  $('prProduct').innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('');
}

function filtered(){
  const v=$('vendor').value,q=$('search').value.trim().toLowerCase();
  return rows.filter(r=>{
    if(v&&r.vendor_name!==v)return false;
    if(!q)return true;
    const p=r.product;
    return [r.vendor_name,p.name,p.material,p.standard_process,p.process_notes,r.process_name,r.note]
      .some(x=>String(x||'').toLowerCase().includes(q));
  });
}

function photoHtml(p){return p.photo_url?`<img src="${esc(p.photo_url)}" alt="產品圖">`:'尚未上傳產品照片'}

function render(){
  const list=filtered();
  $('grid').innerHTML=list.length?list.map((r,i)=>{
    const p=r.product;
    return `<article class="card">
      <div class="photo">${photoHtml(p)}</div>
      <div class="body">
        <div class="vendor">${esc(r.vendor_name)}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(text(p.material))}｜${esc(text(r.unit))}</div>
        <div class="price">NT$ ${fmt.format(Number(r.unit_price)||0)} <span style="font-size:13px;font-weight:600">/ ${esc(text(r.unit))}</span></div>
        <div class="process">⚙️ ${esc(text(r.process_name||p.standard_process))}</div>
        <div class="process">📝 ${esc(text(p.process_notes))}</div>
        <div class="actions">
          <button class="btn secondary" data-detail="${i}">詳細</button>
          ${isAdmin?`<button class="btn secondary" data-product="${p.id}">改產品</button><button class="btn secondary" data-price="${r.id}">改價格</button>`:''}
        </div>
      </div>
    </article>`;
  }).join(''):'<div class="empty">沒有符合的資料</div>';

  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>alertDetail(list[+b.dataset.detail]));
  document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>openProduct(b.dataset.product));
  document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>openPrice(b.dataset.price));
}

function alertDetail(r){
  const p=r.product;
  alert(`${r.vendor_name}\n${p.name}\n\n材質：${text(p.material)}\n標準製程：${text(p.standard_process)}\n注意事項：${text(p.process_notes)}\n單價：${fmt.format(Number(r.unit_price)||0)} / ${text(r.unit)}\n價格備註：${text(r.note)}`);
}

function clearPendingPhoto(){
  pendingPhotoBlob=null;
  if(pendingPhotoUrl){URL.revokeObjectURL(pendingPhotoUrl);pendingPhotoUrl=null}
  $('cropState').textContent='';
}

function setPreview(p){
  $('pPreview').innerHTML=p?.photo_url?`<img src="${esc(p.photo_url)}" alt="目前照片">`:'尚未上傳照片';
}

function openProduct(id=null){
  if(!isAdmin)return;
  clearPendingPhoto();
  editingProduct=id?products.find(p=>p.id===id):null;
  $('productTitle').textContent=editingProduct?'修改產品':'新增產品';
  $('pName').value=editingProduct?.name||'';
  $('pMaterial').value=editingProduct?.material||'';
  $('pProcess').value=editingProduct?.standard_process||'';
  $('pNotes').value=editingProduct?.process_notes||'';
  $('pPhoto').value='';
  setPreview(editingProduct);
  productDialog.showModal();
}

function averagePatch(data,w,h,cx,cy,r=3){
  let rr=0,gg=0,bb=0,n=0;
  for(let y=Math.max(0,cy-r);y<=Math.min(h-1,cy+r);y++){
    for(let x=Math.max(0,cx-r);x<=Math.min(w-1,cx+r);x++){
      const i=(y*w+x)*4;rr+=data[i];gg+=data[i+1];bb+=data[i+2];n++;
    }
  }
  return [rr/n,gg/n,bb/n];
}

function nearestCornerDistance(r,g,b,corners){
  let best=1e9;
  for(const c of corners){
    const dr=r-c[0],dg=g-c[1],db=b-c[2];
    const d=dr*dr+dg*dg+db*db;
    if(d<best)best=d;
  }
  return Math.sqrt(best);
}

async function autoCropImage(file){
  if(file.size>10*1024*1024)throw new Error('照片超過 10 MB');
  const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
  const sw=bitmap.width,sh=bitmap.height;
  const scale=Math.min(1,800/Math.max(sw,sh));
  const aw=Math.max(1,Math.round(sw*scale)),ah=Math.max(1,Math.round(sh*scale));
  const ac=document.createElement('canvas');ac.width=aw;ac.height=ah;
  const actx=ac.getContext('2d',{willReadFrequently:true});actx.drawImage(bitmap,0,0,aw,ah);
  const img=actx.getImageData(0,0,aw,ah),d=img.data;
  const corners=[
    averagePatch(d,aw,ah,2,2,3),
    averagePatch(d,aw,ah,aw-3,2,3),
    averagePatch(d,aw,ah,2,ah-3,3),
    averagePatch(d,aw,ah,aw-3,ah-3,3)
  ];
  const rowCounts=new Uint32Array(ah),colCounts=new Uint32Array(aw);
  let fgTotal=0;
  const threshold=38;
  for(let y=0;y<ah;y++){
    for(let x=0;x<aw;x++){
      const i=(y*aw+x)*4;
      if(nearestCornerDistance(d[i],d[i+1],d[i+2],corners)>threshold){
        rowCounts[y]++;colCounts[x]++;fgTotal++;
      }
    }
  }
  const rowNeed=Math.max(3,Math.round(aw*0.006));
  const colNeed=Math.max(3,Math.round(ah*0.006));
  let top=0,bottom=ah-1,left=0,right=aw-1;
  while(top<ah-1&&rowCounts[top]<rowNeed)top++;
  while(bottom>top&&rowCounts[bottom]<rowNeed)bottom--;
  while(left<aw-1&&colCounts[left]<colNeed)left++;
  while(right>left&&colCounts[right]<colNeed)right--;

  const bw=right-left+1,bh=bottom-top+1;
  const useful=fgTotal>aw*ah*0.002&&bw>aw*0.12&&bh>ah*0.12;
  if(useful){
    const mx=Math.round(aw*0.045),my=Math.round(ah*0.045);
    left=Math.max(0,left-mx);right=Math.min(aw-1,right+mx);
    top=Math.max(0,top-my);bottom=Math.min(ah-1,bottom+my);
  }else{
    left=0;right=aw-1;top=0;bottom=ah-1;
  }

  const sx=Math.round(left/scale),sy=Math.round(top/scale);
  const cw=Math.min(sw-sx,Math.max(1,Math.round((right-left+1)/scale)));
  const ch=Math.min(sh-sy,Math.max(1,Math.round((bottom-top+1)/scale)));
  const outScale=Math.min(1,1800/Math.max(cw,ch));
  const ow=Math.max(1,Math.round(cw*outScale)),oh=Math.max(1,Math.round(ch*outScale));
  const out=document.createElement('canvas');out.width=ow;out.height=oh;
  const octx=out.getContext('2d');octx.drawImage(bitmap,sx,sy,cw,ch,0,0,ow,oh);
  bitmap.close?.();
  const blob=await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error('照片處理失敗')),'image/jpeg',0.9));
  return {blob,cropped:useful&&(cw<sw*0.95||ch<sh*0.95),before:[sw,sh],after:[cw,ch]};
}

async function handlePhotoChange(){
  clearPendingPhoto();
  const f=$('pPhoto').files[0];
  if(!f){setPreview(editingProduct);return}
  $('cropState').textContent='正在自動裁掉四周空白…';
  $('pPreview').textContent='處理照片中…';
  try{
    const result=await autoCropImage(f);
    pendingPhotoBlob=result.blob;
    pendingPhotoUrl=URL.createObjectURL(result.blob);
    $('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="裁切預覽">`;
    $('cropState').textContent=result.cropped?'✓ 已自動去掉四周大片空白；這就是最後會保存的範圍':'✓ 沒偵測到明顯空白邊，保留原本構圖';
  }catch(e){
    console.error(e);
    pendingPhotoBlob=f;
    pendingPhotoUrl=URL.createObjectURL(f);
    $('pPreview').innerHTML=`<img src="${pendingPhotoUrl}" alt="原圖預覽">`;
    $('cropState').textContent='自動裁切失敗，這次會保存原圖：'+e.message;
  }
}

async function saveProduct(){
  if(!isAdmin)return;
  const name=$('pName').value.trim();
  if(!name)return alert('請填產品名稱');
  $('saveProduct').disabled=true;
  try{
    let product;
    const payload={
      name,
      material:$('pMaterial').value.trim()||null,
      standard_process:$('pProcess').value.trim()||null,
      process_notes:$('pNotes').value.trim()||null
    };
    if(editingProduct){
      const {data,error}=await supabase.from('products').update(payload).eq('id',editingProduct.id).select().single();
      if(error)throw error;product=data;
    }else{
      const {data,error}=await supabase.from('products').insert(payload).select().single();
      if(error)throw error;product=data;
    }

    if(pendingPhotoBlob){
      const path=`products/${product.id}/${Date.now()}.jpg`;
      const {error:ue}=await supabase.storage.from('factory-photos').upload(path,pendingPhotoBlob,{contentType:'image/jpeg',upsert:false});
      if(ue)throw ue;
      const {error:pe}=await supabase.from('products').update({reference_photo_path:path}).eq('id',product.id);
      if(pe)throw pe;
    }
    productDialog.close();
    clearPendingPhoto();
    photoUrls.clear();
    await load();
  }catch(e){
    alert('儲存失敗：'+e.message);
  }finally{
    $('saveProduct').disabled=false;
  }
}

function openPrice(id=null){
  if(!isAdmin)return;
  editingPrice=id?prices.find(x=>x.id===id):null;
  $('priceTitle').textContent=editingPrice?'修改廠商價格':'新增廠商價格';
  $('prVendor').value=editingPrice?.vendor_name||'';
  $('prProduct').value=editingPrice?.product_id||products[0]?.id||'';
  $('prPrice').value=editingPrice?.unit_price??'';
  $('prUnit').value=editingPrice?.unit||'kg';
  $('prProcess').value=editingPrice?.process_name||'';
  $('prDate').value=editingPrice?.effective_date||'';
  $('prNote').value=editingPrice?.note||'';
  priceDialog.showModal();
}

async function savePrice(){
  if(!isAdmin)return;
  const vendor=$('prVendor').value.trim(),product_id=$('prProduct').value,unit_price=$('prPrice').value;
  if(!vendor||!product_id||unit_price==='')return alert('廠商、產品、單價要填');
  $('savePrice').disabled=true;
  try{
    const payload={
      vendor_name:vendor,
      product_id,
      unit_price:Number(unit_price),
      unit:$('prUnit').value.trim()||'kg',
      process_name:$('prProcess').value.trim()||null,
      effective_date:$('prDate').value||null,
      note:$('prNote').value.trim()||null
    };
    const q=editingPrice?supabase.from('vendor_prices').update(payload).eq('id',editingPrice.id):supabase.from('vendor_prices').insert(payload);
    const {error}=await q;if(error)throw error;
    priceDialog.close();await load();
  }catch(e){
    alert('儲存失敗：'+e.message);
  }finally{
    $('savePrice').disabled=false;
  }
}

$('newProduct').onclick=()=>openProduct();
$('newPrice').onclick=()=>openPrice();
$('saveProduct').onclick=saveProduct;
$('savePrice').onclick=savePrice;
$('cancelProduct').onclick=()=>{clearPendingPhoto();productDialog.close()};
$('cancelPrice').onclick=()=>priceDialog.close();
$('vendor').onchange=render;
$('search').oninput=render;
$('pPhoto').onchange=handlePhotoChange;
productDialog.addEventListener('close',clearPendingPhoto);
load();
</script>
</body>
</html>
