<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>產品／價格／製程知識庫</title>
  <style>
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1100px,calc(100% - 24px));margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
    .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.back{display:inline-block;text-decoration:none;background:#202124;color:#fff;padding:10px 14px;border-radius:11px;font-weight:800;font-size:14px}h1{margin:0 0 6px;font-size:28px}.sub{margin:0;color:#6b7280}.badge{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#fff3cd;color:#7a5a00;font-weight:700;font-size:12px}
    .filters{display:grid;grid-template-columns:220px 1fr;gap:12px;margin:20px 0}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}select,input{width:100%;padding:12px 13px;border:1px solid #d7dbe2;border-radius:12px;background:#fff;font-size:16px}.status{padding:14px;border-radius:14px;background:#f7f7f8;color:#666;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #e0e3e8;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.photo{height:130px;background:linear-gradient(145deg,#dfe3e7,#fafafa);display:grid;place-items:center;position:relative;overflow:hidden}.photo img,.detail-photo img{width:100%;height:100%;object-fit:cover}.metal{width:76px;height:38px;border-radius:18px;background:linear-gradient(90deg,#777,#eee,#9298a0);box-shadow:0 8px 18px rgba(0,0,0,.18);transform:rotate(-8deg)}.fake{position:absolute;right:8px;bottom:7px;background:rgba(255,255,255,.84);padding:3px 7px;border-radius:999px;font-size:10px;color:#666}.body{padding:14px;display:flex;flex-direction:column;gap:7px;height:100%}.vendor{font-size:12px;color:#6b7280}.name{font-size:18px;font-weight:850}.meta{font-size:13px;color:#555}.price{font-size:24px;font-weight:900;margin-top:3px}.process{font-size:13px;line-height:1.6;color:#4b5563;background:#f7f7f8;border-radius:10px;padding:9px}.actions{margin-top:auto;padding-top:6px}.actions button{width:100%;border:0;border-radius:10px;padding:10px;background:#202124;color:#fff;font-size:14px;cursor:pointer}.empty{grid-column:1/-1;padding:35px;text-align:center;color:#777;background:#fafafa;border:1px dashed #ccd1d7;border-radius:14px}
    dialog{width:min(92vw,560px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.46)}.detail-photo{height:200px;background:linear-gradient(145deg,#dfe3e7,#fafafa);display:grid;place-items:center;position:relative;overflow:hidden}.detail-photo .metal{transform:scale(1.55) rotate(-8deg)}.detail{padding:20px}.detail h2{margin:0 0 5px}.detail-price{font-size:27px;font-weight:900;margin:10px 0}.info{background:#f6f7f8;border-radius:12px;padding:12px;margin-top:10px;line-height:1.6}.info b{display:block;margin-bottom:4px}.close{width:100%;margin-top:16px;border:0;border-radius:11px;padding:12px;background:#202124;color:#fff;font-size:15px;cursor:pointer}.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}.auth a{display:inline-block;margin-top:10px;background:#202124;color:#fff;text-decoration:none;padding:11px 16px;border-radius:11px;font-weight:800}
    @media(max-width:820px){main{padding:18px}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}
    @media(max-width:520px){main{width:min(100% - 12px,1100px);margin:8px auto;padding:15px;border-radius:16px}.grid{grid-template-columns:1fr}.photo{height:150px}h1{font-size:24px}.back{width:100%;text-align:center}}
  </style>
</head>
<body>
<section id="authGate" class="auth"><h1>產品／價格／製程知識庫</h1><p>這一頁只開放給已登入的工廠帳號。</p><a href="../board/">前往登入／貨件進度</a></section>
<main id="app" hidden>
  <div class="head"><div><h1>產品／價格／製程知識庫</h1><p class="sub">查產品、材料、製程與廠商價格。這一頁不做計算。</p><div class="badge">🔒 已登入才能查看</div></div><a class="back" href="../board/">← 返回貨件進度</a></div>
  <section class="filters"><div><label for="vendor">廠商</label><select id="vendor"><option value="">全部廠商</option></select></div><div><label for="search">搜尋</label><input id="search" placeholder="搜尋產品、材料、製程…" /></div></section>
  <div id="status" class="status">正在確認登入狀態…</div><section id="grid" class="grid"></section>
</main>
<dialog id="dialog"><div id="detailPhoto" class="detail-photo"><div class="metal"></div><span class="fake">產品圖尚未上傳</span></div><div class="detail"><h2 id="dName"></h2><div id="dVendor" class="vendor"></div><div id="dPrice" class="detail-price"></div><div class="info"><b>材料</b><span id="dMaterial"></span></div><div class="info"><b>標準製程</b><span id="dProcess"></span></div><div class="info"><b>製程／注意事項</b><span id="dNotes"></span></div><div class="info"><b>價格備註</b><span id="dPriceNote"></span></div><button id="close" class="close">關閉</button></div></dialog>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/catalog-public';
const supabase=createClient('https://icqdmzndjmxffnlciijs.supabase.co','sb_publishable_PUUgMuSNqlOFDaC8PvQ0KA_EcxNfhF6',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),vendorSel=document.getElementById('vendor'),searchEl=document.getElementById('search'),dialog=document.getElementById('dialog');const fmt=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});let products=[],prices=[],rows=[];
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function text(v,f='—'){return v===null||v===undefined||v===''?f:String(v)}function imgHtml(p,label='產品圖尚未上傳'){const src=p?.reference_photo_path||'';return src&&(src.startsWith('http')||src.startsWith('data:'))?`<img src="${esc(src)}" alt="產品圖">`:`<div class="metal"></div><span class="fake">${label}</span>`}
async function load(){try{const {data:{session}}=await supabase.auth.getSession();if(!session){document.getElementById('authGate').hidden=false;document.getElementById('app').hidden=true;return}const {data:profile}=await supabase.from('profiles').select('active').eq('user_id',session.user.id).maybeSingle();if(!profile?.active){await supabase.auth.signOut();document.getElementById('authGate').hidden=false;document.getElementById('app').hidden=true;return}document.getElementById('authGate').hidden=true;document.getElementById('app').hidden=false;const r=await fetch(API,{cache:'no-store',headers:{Authorization:`Bearer ${session.access_token}`}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);const data=await r.json();products=data.products||[];prices=data.prices||[];const pMap=new Map(products.map(p=>[p.id,p]));rows=prices.map(x=>({...x,product:pMap.get(x.product_id)})).filter(x=>x.product);const vendors=[...new Set(rows.map(x=>x.vendor_name))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));vendorSel.innerHTML='<option value="">全部廠商</option>'+vendors.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');statusEl.textContent=`已讀取 ${products.length} 個產品、${prices.length} 筆價格資料`;render()}catch(err){console.error(err);statusEl.textContent='讀取失敗，請回貨件頁重新登入。';grid.innerHTML='<div class="empty">目前無法讀取雲端資料</div>'}}
function filtered(){const v=vendorSel.value,q=searchEl.value.trim().toLowerCase();return rows.filter(r=>{if(v&&r.vendor_name!==v)return false;if(!q)return true;const p=r.product;return [r.vendor_name,p.name,p.material,p.standard_process,p.process_notes,r.process_name,r.note].some(x=>String(x||'').toLowerCase().includes(q))})}
function render(){const list=filtered();if(!list.length){grid.innerHTML='<div class="empty">沒有符合的資料</div>';return}grid.innerHTML=list.map((r,i)=>{const p=r.product;return `<article class="card"><div class="photo">${imgHtml(p)}</div><div class="body"><div class="vendor">${esc(r.vendor_name)}</div><div class="name">${esc(p.name)}</div><div class="meta">${esc(text(p.material))}｜${esc(text(r.unit))}</div><div class="price">NT$ ${fmt.format(Number(r.unit_price)||0)} <span style="font-size:13px;font-weight:600">/ ${esc(text(r.unit))}</span></div><div class="process">⚙️ ${esc(text(r.process_name||p.standard_process))}</div><div class="process">📝 ${esc(text(p.process_notes))}</div><div class="actions"><button data-i="${i}">看詳細</button></div></div></article>`}).join('');[...grid.querySelectorAll('button[data-i]')].forEach((btn,idx)=>btn.onclick=()=>openDetail(list[idx]))}
function openDetail(r){const p=r.product;document.getElementById('dName').textContent=p.name;document.getElementById('dVendor').textContent=r.vendor_name;document.getElementById('dPrice').textContent=`NT$ ${fmt.format(Number(r.unit_price)||0)} / ${text(r.unit)}`;document.getElementById('dMaterial').textContent=text(p.material);document.getElementById('dProcess').textContent=text(r.process_name||p.standard_process);document.getElementById('dNotes').textContent=text(p.process_notes);document.getElementById('dPriceNote').textContent=text(r.note);document.getElementById('detailPhoto').innerHTML=imgHtml(p);dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();vendorSel.onchange=render;searchEl.oninput=render;load();
</script>
</body></html>
