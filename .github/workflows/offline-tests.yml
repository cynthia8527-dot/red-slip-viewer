name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all offline tests (zero skips required)
        run: pnpm test
