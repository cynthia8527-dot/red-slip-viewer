<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>廠商資料庫</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1180px,calc(100% - 20px));margin:14px auto}.top,.tools,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.panel{background:#fff;border:1px solid #e2e6ea;border-radius:16px}.panel{padding:14px;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#202124;color:#fff}.secondary{background:#e9ecef;color:#202124}.danger{background:#fff0ef;color:#b42318}.search{width:100%;padding:12px;border:1px solid #d7dbe2;border-radius:11px;font-size:15px}.vendorList{display:grid;grid-template-columns:minmax(0,1fr);margin-top:10px;border:1px solid #e2e6ea;border-radius:10px;overflow:hidden}.vendorRow{-webkit-tap-highlight-color:transparent;display:grid;grid-template-columns:72px minmax(0,1fr) auto 12px;gap:12px;align-items:center;width:100%;min-height:48px;padding:8px 12px;border:0;border-bottom:1px solid #edf0f3;background:#fff;text-align:left;font:inherit;cursor:pointer}.vendorRow:last-child{border-bottom:0}.vendorRow:active,.vendorRow:hover,.vendorRow[aria-current="true"]{background:#eef4ff}.vendorRow:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}.vendorCode,.vendorName{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.vendorCode{color:#667085;font-variant-numeric:tabular-nums}.vendorName{font-weight:700}.vendorState{font-size:11px;color:#667085;white-space:nowrap}.muted{color:#667085;font-size:12px}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef4ff;color:#344054;font-size:11px;font-weight:800;margin-top:6px}.inactive{background:#f2f4f7;color:#667085}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.box{background:#f8fafc;border-radius:12px;padding:10px;margin-top:8px;line-height:1.5}.box b{display:block;font-size:11px;color:#667085}.site{border-top:1px solid #e6e9ed;padding:10px 0}.site:first-child{border-top:0}.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:20px;padding:22px;text-align:center}.auth a{display:inline-block;background:#202124;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}.modalback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);padding:12px;overflow:auto;z-index:20}.modalback.open{display:grid;place-items:start center}.modal{width:min(780px,100%);margin:3vh auto;background:#fff;border-radius:18px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#667085;margin-bottom:4px}input,textarea,select{width:100%;padding:10px;border:1px solid #d7dbe2;border-radius:10px;background:#fff}textarea{min-height:72px}.adminOnly{display:none}.isAdmin .adminOnly{display:inline-flex}@media(max-width:800px){.detail{grid-template-columns:1fr}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.full{grid-column:1}.top .btn{flex:1}}
#pricePreview th{white-space:nowrap;text-align:left;padding:8px}#pricePreview td{vertical-align:top}#pricePreview th:last-child,#pricePreview td:last-child{min-width:400px}
html{scrollbar-gutter:stable}html.hasDialog{overflow:hidden}#detailDialog{width:min(960px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:0;border:1px solid #d7dbe2;border-radius:16px;color:inherit;background:#fff;overflow:hidden}#detailDialog[open]{display:flex;flex-direction:column}#detailDialog::backdrop,.editDialog::backdrop{background:rgba(15,23,42,.48)}.detailHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid #e2e6ea;flex-shrink:0}.detailHeader h2{margin:0;min-width:0;max-height:25dvh;overflow:auto;overflow-wrap:anywhere;font-size:22px;line-height:1.4}.detailHeader button{flex-shrink:0;min-height:44px}#detail{padding:16px;overflow:auto;overscroll-behavior:contain;min-height:0}.box{overflow-wrap:anywhere;white-space:pre-wrap}#detail .btn{min-height:44px}@media(max-width:600px){.vendorRow{grid-template-columns:48px minmax(0,1fr) auto 10px;gap:8px;min-height:48px;padding:8px 10px;font-size:14px}#detailDialog{width:100%;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}.detailHeader{padding:12px}#detail{padding:12px}.detailHeader h2{font-size:19px}}
.editDialog{width:min(800px,calc(100% - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:16px;overflow:auto;overscroll-behavior:contain;color:inherit}.editDialog .modal{width:100%;margin:0}.editDialog .btn{min-height:44px}@media(max-width:600px){.editDialog{width:100%;height:100dvh;max-height:100dvh;margin:0;border-radius:0}}
@media(max-width:600px){.top .tools{width:100%;gap:6px}.top .tools>.btn{flex:0 1 auto;white-space:nowrap;font-size:12px;line-height:24px;padding:10px;min-height:44px;align-items:center}}
@media(min-width:900px){.vendorList{grid-template-columns:repeat(2,minmax(0,1fr))}.vendorRow:nth-child(odd){border-right:1px solid #edf0f3}.vendorRow:nth-last-child(2):nth-child(odd){border-bottom:0}}
</style>
</head>
<body>
<section id="authGate" class="auth"><h1>廠商資料庫</h1><p>請先從貨件系統登入。</p><a href="../board/">前往登入</a></section>
<main id="app" hidden>
<div class="top"><div><h1 style="margin:0">廠商資料庫</h1><div class="muted">公司資料、聯絡方式、帳單資訊與分廠據點。</div></div><div class="tools"><button id="newVendor" class="btn primary adminOnly">＋ 新增廠商</button><label class="btn secondary adminOnly" style="cursor:pointer">匯入舊通訊錄 Excel<input id="importExcel" type="file" accept=".xlsx,.xls" hidden></label><label class="btn secondary adminOnly" style="cursor:pointer">預覽價格清單 Excel<input id="previewPrices" type="file" accept=".xlsx,.xls" hidden></label><a class="btn secondary" href="../calculator/" style="text-decoration:none">📚 商品／價格</a><a class="btn secondary" href="../board/" style="text-decoration:none">← 貨件進度</a></div></div><div id="importState" class="muted adminOnly" style="margin-top:8px"></div>
<div class="panel"><label for="vendorScope">廠商清單</label><select id="vendorScope"><option value="active">常用廠商</option><option value="hidden">隱藏廠商</option><option value="all">全部廠商</option></select><input id="search" class="search" placeholder="搜尋代碼、簡稱、發票抬頭、統編、電話、地址…"><div id="status" class="muted" style="margin-top:8px"></div><section id="grid" class="vendorList" aria-label="廠商列表"></section></div>
<section id="pricePreview" class="panel" hidden><h2>價格匯入核對預覽</h2><p id="pricePreviewState"></p><p class="muted">檔案只在此分頁讀取，不會上傳或寫入。未載價格／底價保留 null，單位保留原文。生效日、產品與歷史期間確認後才能另行準備匯入。</p><button id="clearPricePreview" class="btn secondary">清除預覽</button><div style="overflow:auto"><table><thead id="pricePreviewHead"></thead><tbody id="pricePreviewRows"></tbody></table></div></section>
</main>
<dialog id="detailDialog" aria-labelledby="detailHeading"><header class="detailHeader"><h2 id="detailHeading">廠商資料</h2><button id="closeDetail" class="btn secondary" type="button" autofocus>關閉</button></header><div id="detail"></div></dialog>

<dialog id="vendorBack" class="editDialog" aria-labelledby="vendorTitle"><section class="modal"><h2 id="vendorTitle">新增廠商</h2><div class="formgrid">
<div><label>代碼</label><input id="vCode"></div><div><label>客戶簡稱 *</label><input id="vShort"></div>
<div class="full"><label>發票抬頭</label><input id="vInvoice"></div><div><label>統編</label><input id="vTax"></div><div><label>帳單模式</label><input id="vBilling"></div>
<div><label>聯絡人</label><input id="vContact"></div><div><label>電話</label><input id="vPhone"></div><div><label>傳真</label><input id="vFax"></div><div><label>Email</label><input id="vEmail"></div>
<div class="full"><label>地址</label><input id="vAddress"></div><div class="full"><label>帳單／郵寄地址</label><input id="vBillAddress"></div>
<div class="full"><label>備註</label><textarea id="vNote"></textarea></div><div class="full"><label>舊資料備註／狀態</label><textarea id="vSourceNote"></textarea></div>
<div><label>狀態</label><select id="vActive"><option value="true">啟用</option><option value="false">停用</option></select></div>
</div><div class="actions" style="margin-top:12px"><button id="saveVendor" class="btn primary">儲存</button><button id="cancelVendor" class="btn secondary">取消</button></div></section></dialog>

<dialog id="siteBack" class="editDialog" aria-labelledby="siteTitle"><section class="modal"><h2 id="siteTitle">新增據點</h2><div class="formgrid">
<div><label>據點代碼</label><input id="sCode"></div><div><label>據點名稱 *</label><input id="sName"></div>
<div><label>聯絡人</label><input id="sContact"></div><div><label>電話</label><input id="sPhone"></div><div><label>傳真</label><input id="sFax"></div><div><label>Email</label><input id="sEmail"></div>
<div class="full"><label>地址</label><input id="sAddress"></div><div class="full"><label>備註</label><textarea id="sNote"></textarea></div>
<div><label>狀態</label><select id="sActive"><option value="true">啟用</option><option value="false">停用</option></select></div>
</div><div class="actions" style="margin-top:12px"><button id="saveSite" class="btn primary">儲存</button><button id="cancelSite" class="btn secondary">取消</button></div></section></dialog>

<script type="module">
import {compareVendors} from '../data/vendors.js';
import { readAllRows, byText } from '../data/pagination.js';
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
import {resolveConfig} from '../config.js';
import {priceImportPreview,priceColumns} from '../data/price-import-preview.js';
import {vendorImportRows} from '../data/vendor-import.js';
const APP_CONFIG=await resolveConfig();
const supabase=createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let vendors=[],sites=[],selected=null,isAdmin=false,editingVendor=null,editingSite=null;
const pendingVisibility=new Set();let detailReturnId=null,detailScroll={x:0,y:0};
function openEditor(id){if(!$(id).open)$(id).showModal();syncDialogLock()}
function syncDialogLock(){document.documentElement.classList.toggle('hasDialog',!!document.querySelector('dialog[open]'))}
$('closeDetail').onclick=()=>$('detailDialog').close();
$('detailDialog').addEventListener('close',()=>{if($('detailDialog').open)return;syncDialogLock();const row=[...document.querySelectorAll('#grid [data-id]')].find(el=>el.dataset.id===detailReturnId);(row||$('vendorScope')).focus({preventScroll:true});window.scrollTo(detailScroll.x,detailScroll.y)});
for(const dialog of document.querySelectorAll('dialog')){dialog.addEventListener('close',syncDialogLock);dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const focusable=[...dialog.querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tx=v=>v||'—';
async function init(){const {data:{session}}=await supabase.auth.getSession();if(!session)return;const {data:p}=await supabase.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p?.active)return;isAdmin=p.role==='admin';document.body.classList.toggle('isAdmin',isAdmin);$('authGate').hidden=true;$('app').hidden=false;await load()}
async function load(){const [{data:v,error:ve},{data:s,error:se}]=await Promise.all([readAllRows(()=>supabase.from('vendors').select('*'),compareVendors),readAllRows(()=>supabase.from('vendor_sites').select('*'),byText('site_name'))]);if(ve||se){$('status').textContent='讀取失敗：'+(ve||se).message;return false}vendors=v||[];sites=s||[];$('status').textContent=vendors.length+' 家廠商';render();if(selected&&$('detailDialog').open)openDetail(selected.id);return true}
function render(){const q=$('search').value.trim().toLowerCase(),list=vendors.filter(v=>($('vendorScope').value==='all'||($('vendorScope').value==='hidden')===(v.is_hidden===true))).filter(v=>!q||[v.code,v.short_name,v.invoice_title,v.tax_id,v.phone,v.address].some(x=>String(x||'').toLowerCase().includes(q)));$('status').textContent=list.length+' 家符合｜共 '+vendors.length+' 家廠商';$('grid').innerHTML=list.length?list.map(v=>'<button type="button" class="vendorRow" data-id="'+v.id+'" aria-haspopup="dialog" aria-controls="detailDialog" aria-current="'+(selected?.id===v.id)+'"><span class="vendorCode">'+esc(v.code||'無代碼')+'</span><span class="vendorName" title="'+esc(v.short_name)+'">'+esc(v.short_name)+'</span><span class="vendorState">'+(v.is_active?'啟用':'停用')+(v.is_hidden?'｜已隱藏':'')+'</span><span aria-hidden="true">›</span></button>').join(''):'<div class="muted">沒有符合的廠商</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openDetail(x.dataset.id))}
function openDetail(id){const v=vendors.find(x=>x.id===id);if(!v)return;const opening=!$('detailDialog').open;selected=v;document.querySelectorAll('#grid [data-id]').forEach(row=>row.setAttribute('aria-current',String(row.dataset.id===id)));if(opening){detailReturnId=id;detailScroll={x:scrollX,y:scrollY}}const vs=sites.filter(x=>x.vendor_id===id);$('detailHeading').textContent=v.short_name;$('detail').innerHTML='<div class="top"><div class="muted">'+esc(v.invoice_title||'')+'</div><div class="tools">'+(isAdmin?'<button class="btn secondary" id="toggleHidden" '+(pendingVisibility.has(v.id)?'disabled':'')+'>'+(v.is_hidden?'恢復常用':'隱藏廠商')+'</button><button class="btn secondary" id="editVendor">修改廠商</button><button class="btn primary" id="addSite">＋ 據點</button>':'')+'</div></div><div class="detail"><div><div class="box"><b>代碼／統編</b>'+esc(tx(v.code))+'｜'+esc(tx(v.tax_id))+'</div><div class="box"><b>帳單模式</b>'+esc(tx(v.billing_mode))+'</div><div class="box"><b>聯絡人／電話／傳真</b>'+esc(tx(v.contact_name))+'｜'+esc(tx(v.phone))+'｜'+esc(tx(v.fax))+'</div><div class="box"><b>Email</b>'+esc(tx(v.email))+'</div><div class="box"><b>地址</b>'+esc(tx(v.address))+'</div><div class="box"><b>帳單／郵寄地址</b>'+esc(tx(v.billing_address))+'</div><div class="box"><b>備註</b>'+esc(tx(v.note))+'</div><div class="box"><b>舊資料備註／狀態</b>'+esc(tx(v.source_note))+'</div></div><div><div class="box"><b>分廠／據點</b>'+ (vs.length?vs.map(s=>'<div class="site"><strong>'+esc(s.site_name)+'</strong><div class="muted">'+esc(tx(s.site_code))+'</div><div>'+esc(tx(s.contact_name))+'｜'+esc(tx(s.phone))+'</div><div>'+esc(tx(s.address))+'</div>'+(isAdmin?'<div style="margin-top:6px"><button class="btn secondary" data-site="'+s.id+'">修改</button></div>':'')+'</div>').join(''):'目前沒有另外的據點')+'</div></div></div>';if(isAdmin){$('toggleHidden').onclick=()=>toggleHidden(v);$('editVendor').onclick=()=>openVendor(v.id);$('addSite').onclick=()=>openSite();document.querySelectorAll('[data-site]').forEach(x=>x.onclick=()=>openSite(x.dataset.site))}if(opening){$('detail').scrollTop=0;$('detailDialog').showModal();syncDialogLock();$('closeDetail').focus({preventScroll:true})}else if(!$('detailDialog').contains(document.activeElement))$('closeDetail').focus({preventScroll:true})}
async function toggleHidden(v){
 if(!isAdmin||pendingVisibility.has(v.id))return;
 pendingVisibility.add(v.id);
 const button=$('toggleHidden');button.disabled=true;
 try{
  const {data,error}=await supabase.from('vendors').update({is_hidden:!v.is_hidden}).eq('id',v.id).select('id,is_hidden').single();
  if(error||!data||data.id!==v.id||data.is_hidden!==!v.is_hidden)throw error||new Error('未確認更新結果，請重新整理核對');
  await load();
 }catch(e){alert('更新失敗：'+e.message)}finally{pendingVisibility.delete(v.id);button.disabled=false;if(selected?.id===v.id&&$('toggleHidden'))$('toggleHidden').disabled=false}
}
function openVendor(id=null){editingVendor=id?vendors.find(v=>v.id===id):null;const v=editingVendor||{};$('vendorTitle').textContent=id?'修改廠商':'新增廠商';$('vCode').value=v.code||'';$('vShort').value=v.short_name||'';$('vInvoice').value=v.invoice_title||'';$('vTax').value=v.tax_id||'';$('vBilling').value=v.billing_mode||'';$('vContact').value=v.contact_name||'';$('vPhone').value=v.phone||'';$('vFax').value=v.fax||'';$('vEmail').value=v.email||'';$('vAddress').value=v.address||'';$('vBillAddress').value=v.billing_address||'';$('vNote').value=v.note||'';$('vSourceNote').value=v.source_note||'';$('vActive').value=String(v.is_active!==false);openEditor('vendorBack')}
function openSite(id=null){if(!selected)return;editingSite=id?sites.find(s=>s.id===id):null;const s=editingSite||{};$('siteTitle').textContent=id?'修改據點':'新增據點';$('sCode').value=s.site_code||'';$('sName').value=s.site_name||'';$('sContact').value=s.contact_name||'';$('sPhone').value=s.phone||'';$('sFax').value=s.fax||'';$('sEmail').value=s.email||'';$('sAddress').value=s.address||'';$('sNote').value=s.note||'';$('sActive').value=String(s.is_active!==false);openEditor('siteBack')}
let importing=false;
async function importWorkbook(file){
 if(!isAdmin||!file||importing)return;
 importing=true;$('importExcel').disabled=true;
 const state=$('importState');state.textContent='正在讀取 Excel…';
 let writeAttempted=false;
 try{
  const XLSX=await import('../vendor/sheetjs/xlsx.mjs');
  XLSX.set_cptable(await import('../vendor/sheetjs/dist/cpexcel.full.mjs'));
  const book=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const main=book.Sheets['客戶-通訊錄']||book.Sheets[book.SheetNames[0]];
  const read=sheet=>sheet?XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:false}):[];
  const rows=vendorImportRows(read(main),read(book.Sheets['工作表2']));
  state.textContent='正在匯入 '+rows.length+' 筆，請稍候…';writeAttempted=true;
  const {data,error}=await supabase.rpc('import_vendor_workbook',{p_rows:rows});
  if(error)throw error;
  let refreshed=false;try{refreshed=await load()}catch{}
  state.textContent='✓ 匯入完成：新增 '+data.added+' 家廠商、'+data.site_added+' 個據點；略過 '+data.skipped+' 筆重複資料。'+(refreshed?'':'列表暫時無法更新，請重新開頁核對。');
 }catch(e){
  state.textContent=writeAttempted
   ? '未取得匯入完成確認。這次匯入會整批完成或整批回滾；可重新選取同一份 Excel，已存在的資料會略過。請勿先修改或刪除匯入資料。原因：'+(e.message||e)
   : 'Excel 讀取失敗，尚未開始寫入：'+(e.message||e);
 }finally{importing=false;$('importExcel').disabled=false;$('importExcel').value=''}
}
$('previewPrices').onchange=async()=>{
 const file=$('previewPrices').files[0];if(!isAdmin||!file)return;
 $('pricePreview').hidden=false;$('pricePreviewRows').replaceChildren();$('pricePreviewState').textContent='讀取預覽中…';$('previewPrices').disabled=true;
 try{
  const XLSX=await import('../vendor/sheetjs/xlsx.mjs');XLSX.set_cptable(await import('../vendor/sheetjs/dist/cpexcel.full.mjs'));
  const book=XLSX.read(await file.arrayBuffer(),{type:'array'}),sheet=book.Sheets['價格清單'];
  if(!sheet)throw new Error('找不到「價格清單」工作表');
  const preview=priceImportPreview(XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true}),vendors);
  $('pricePreviewHead').innerHTML='<tr>'+['來源列',...priceColumns,'完整匹配 UUID','候選（需人工核對）','正式匯入阻礙'].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  const cell=value=>'<td style="min-width:120px;padding:8px;border-bottom:1px solid #ddd;white-space:pre-wrap">'+esc(value===null?'未載（null）':value)+'</td>';
  $('pricePreviewRows').innerHTML=preview.map(p=>'<tr>'+cell(p.row)+Object.values(p.source).map(cell).join('')+cell(p.vendor_id)+cell(p.candidates.map(v=>[v.code,v.name,v.id].join('｜')).join('\n')||'無候選')+cell(p.blockers.join('；'))+'</tr>').join('');
  $('pricePreviewState').textContent='僅預覽：'+preview.length+' 列。尚未寫入或覆蓋任何商品／價格；候選不代表已匹配。';
 }catch(e){$('pricePreviewState').textContent='預覽失敗，沒有寫入：'+e.message}finally{$('previewPrices').disabled=false;$('previewPrices').value=''}
};
$('clearPricePreview').onclick=()=>{$('pricePreview').hidden=true;$('pricePreviewRows').replaceChildren()};
$('importExcel').onchange=()=>importWorkbook($('importExcel').files[0]);
$('newVendor').onclick=()=>openVendor();$('cancelVendor').onclick=()=>$('vendorBack').close();$('cancelSite').onclick=()=>$('siteBack').close();$('search').oninput=render;$('vendorScope').onchange=render;
$('saveVendor').onclick=async()=>{if(!isAdmin||$('saveVendor').disabled)return;const row={code:$('vCode').value.trim()||null,short_name:$('vShort').value.trim(),invoice_title:$('vInvoice').value.trim()||null,billing_mode:$('vBilling').value.trim()||null,tax_id:$('vTax').value.trim()||null,contact_name:$('vContact').value.trim()||null,phone:$('vPhone').value.trim()||null,fax:$('vFax').value.trim()||null,email:$('vEmail').value.trim()||null,address:$('vAddress').value.trim()||null,billing_address:$('vBillAddress').value.trim()||null,note:$('vNote').value.trim()||null,source_note:$('vSourceNote').value.trim()||null,is_active:$('vActive').value==='true',updated_at:new Date().toISOString()};if(!row.short_name)return alert('客戶簡稱要填');const q=editingVendor?supabase.from('vendors').update(row).eq('id',editingVendor.id):supabase.from('vendors').insert(row);$('saveVendor').disabled=true;try{const {data,error}=await q.select('id').single();if(error||!data)throw error||new Error('未確認更新結果，請重新整理核對');$('vendorBack').close();editingVendor=null;await load()}catch(e){alert('儲存失敗：'+e.message)}finally{$('saveVendor').disabled=false}}
$('saveSite').onclick=async()=>{if(!selected)return;const row={vendor_id:selected.id,site_code:$('sCode').value.trim()||null,site_name:$('sName').value.trim(),contact_name:$('sContact').value.trim()||null,phone:$('sPhone').value.trim()||null,fax:$('sFax').value.trim()||null,email:$('sEmail').value.trim()||null,address:$('sAddress').value.trim()||null,note:$('sNote').value.trim()||null,is_active:$('sActive').value==='true',updated_at:new Date().toISOString()};if(!row.site_name)return alert('據點名稱要填');const q=editingSite?supabase.from('vendor_sites').update(row).eq('id',editingSite.id):supabase.from('vendor_sites').insert(row);const {error}=await q;if(error)return alert('儲存失敗：'+error.message);$('siteBack').close();editingSite=null;await load()}
init();
</script>
</body></html>
