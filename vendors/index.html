<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>廠商資料庫</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1180px,calc(100% - 20px));margin:14px auto}.top,.tools,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card,.panel{background:#fff;border:1px solid #e2e6ea;border-radius:16px}.panel{padding:14px;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#202124;color:#fff}.secondary{background:#e9ecef;color:#202124}.danger{background:#fff0ef;color:#b42318}.search{width:100%;padding:12px;border:1px solid #d7dbe2;border-radius:11px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.card{padding:14px;cursor:pointer}.name{font-size:19px;font-weight:900}.muted{color:#667085;font-size:12px}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef4ff;color:#344054;font-size:11px;font-weight:800;margin-top:6px}.inactive{background:#f2f4f7;color:#667085}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.box{background:#f8fafc;border-radius:12px;padding:10px;margin-top:8px;line-height:1.5}.box b{display:block;font-size:11px;color:#667085}.site{border-top:1px solid #e6e9ed;padding:10px 0}.site:first-child{border-top:0}.auth{width:min(430px,calc(100% - 24px));margin:60px auto;background:#fff;border-radius:20px;padding:22px;text-align:center}.auth a{display:inline-block;background:#202124;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}.modalback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);padding:12px;overflow:auto;z-index:20}.modalback.open{display:grid;place-items:start center}.modal{width:min(780px,100%);margin:3vh auto;background:#fff;border-radius:18px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#667085;margin-bottom:4px}input,textarea,select{width:100%;padding:10px;border:1px solid #d7dbe2;border-radius:10px;background:#fff}textarea{min-height:72px}.adminOnly{display:none}.isAdmin .adminOnly{display:inline-flex}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}@media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:1}.top .btn{flex:1}}
</style>
</head>
<body>
<section id="authGate" class="auth"><h1>廠商資料庫</h1><p>請先從貨件系統登入。</p><a href="../board/">前往登入</a></section>
<main id="app" hidden>
<div class="top"><div><h1 style="margin:0">廠商資料庫</h1><div class="muted">公司資料、聯絡方式、帳單資訊與分廠據點。</div></div><div class="tools"><button id="newVendor" class="btn primary adminOnly">＋ 新增廠商</button><label class="btn secondary adminOnly" style="cursor:pointer">匯入舊通訊錄 Excel<input id="importExcel" type="file" accept=".xlsx,.xls" hidden></label><a class="btn secondary" href="../calculator/" style="text-decoration:none">📚 商品／價格</a><a class="btn secondary" href="../board/" style="text-decoration:none">← 貨件進度</a></div></div><div id="importState" class="muted adminOnly" style="margin-top:8px"></div>
<div class="panel"><input id="search" class="search" placeholder="搜尋代碼、簡稱、發票抬頭、統編、電話、地址…"><div id="status" class="muted" style="margin-top:8px"></div><section id="grid" class="grid"></section></div>
<section id="detail" class="panel" hidden></section>
</main>

<div id="vendorBack" class="modalback"><section class="modal"><h2 id="vendorTitle">新增廠商</h2><div class="formgrid">
<div><label>代碼</label><input id="vCode"></div><div><label>客戶簡稱 *</label><input id="vShort"></div>
<div class="full"><label>發票抬頭</label><input id="vInvoice"></div><div><label>統編</label><input id="vTax"></div><div><label>帳單模式</label><input id="vBilling"></div>
<div><label>聯絡人</label><input id="vContact"></div><div><label>電話</label><input id="vPhone"></div><div><label>傳真</label><input id="vFax"></div><div><label>Email</label><input id="vEmail"></div>
<div class="full"><label>地址</label><input id="vAddress"></div><div class="full"><label>帳單／郵寄地址</label><input id="vBillAddress"></div>
<div class="full"><label>備註</label><textarea id="vNote"></textarea></div><div class="full"><label>舊資料備註／狀態</label><textarea id="vSourceNote"></textarea></div>
<div><label>狀態</label><select id="vActive"><option value="true">啟用</option><option value="false">停用</option></select></div>
</div><div class="actions" style="margin-top:12px"><button id="saveVendor" class="btn primary">儲存</button><button id="cancelVendor" class="btn secondary">取消</button></div></section></div>

<div id="siteBack" class="modalback"><section class="modal"><h2 id="siteTitle">新增據點</h2><div class="formgrid">
<div><label>據點代碼</label><input id="sCode"></div><div><label>據點名稱 *</label><input id="sName"></div>
<div><label>聯絡人</label><input id="sContact"></div><div><label>電話</label><input id="sPhone"></div><div><label>傳真</label><input id="sFax"></div><div><label>Email</label><input id="sEmail"></div>
<div class="full"><label>地址</label><input id="sAddress"></div><div class="full"><label>備註</label><textarea id="sNote"></textarea></div>
<div><label>狀態</label><select id="sActive"><option value="true">啟用</option><option value="false">停用</option></select></div>
</div><div class="actions" style="margin-top:12px"><button id="saveSite" class="btn primary">儲存</button><button id="cancelSite" class="btn secondary">取消</button></div></section></div>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
import {resolveConfig} from '../config.js';
const APP_CONFIG=await resolveConfig();
const supabase=createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let vendors=[],sites=[],selected=null,isAdmin=false,editingVendor=null,editingSite=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tx=v=>v||'—';
async function init(){const {data:{session}}=await supabase.auth.getSession();if(!session)return;const {data:p}=await supabase.from('profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(!p?.active)return;isAdmin=p.role==='admin';document.body.classList.toggle('isAdmin',isAdmin);$('authGate').hidden=true;$('app').hidden=false;await load()}
async function load(){const [{data:v,error:ve},{data:s,error:se}]=await Promise.all([supabase.from('vendors').select('*').order('code',{ascending:true,nullsFirst:false}),supabase.from('vendor_sites').select('*').order('site_name')]);if(ve||se){$('status').textContent='讀取失敗：'+(ve||se).message;return false}vendors=v||[];sites=s||[];$('status').textContent=vendors.length+' 家廠商';render();if(selected)openDetail(selected.id);return true}
function render(){const q=$('search').value.trim().toLowerCase(),list=vendors.filter(v=>!q||[v.code,v.short_name,v.invoice_title,v.tax_id,v.phone,v.address].some(x=>String(x||'').toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(v=>'<article class="card" data-id="'+v.id+'"><div class="name">'+esc(v.short_name)+'</div><div class="muted">'+esc(v.code||'無代碼')+'｜'+esc(v.invoice_title||'未填發票抬頭')+'</div><div class="pill '+(!v.is_active?'inactive':'')+'">'+(v.is_active?'啟用':'停用')+'</div></article>').join(''):'<div class="muted">沒有符合的廠商</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openDetail(x.dataset.id))}
function openDetail(id){const v=vendors.find(x=>x.id===id);if(!v)return;selected=v;const vs=sites.filter(x=>x.vendor_id===id);$('detail').hidden=false;$('detail').innerHTML='<div class="top"><div><h2 style="margin:0">'+esc(v.short_name)+'</h2><div class="muted">'+esc(v.invoice_title||'')+'</div></div><div class="tools">'+(isAdmin?'<button class="btn secondary" id="editVendor">修改廠商</button><button class="btn primary" id="addSite">＋ 據點</button>':'')+'</div></div><div class="detail"><div><div class="box"><b>代碼／統編</b>'+esc(tx(v.code))+'｜'+esc(tx(v.tax_id))+'</div><div class="box"><b>帳單模式</b>'+esc(tx(v.billing_mode))+'</div><div class="box"><b>聯絡人／電話／傳真</b>'+esc(tx(v.contact_name))+'｜'+esc(tx(v.phone))+'｜'+esc(tx(v.fax))+'</div><div class="box"><b>Email</b>'+esc(tx(v.email))+'</div><div class="box"><b>地址</b>'+esc(tx(v.address))+'</div><div class="box"><b>帳單／郵寄地址</b>'+esc(tx(v.billing_address))+'</div><div class="box"><b>備註</b>'+esc(tx(v.note))+'</div><div class="box"><b>舊資料備註／狀態</b>'+esc(tx(v.source_note))+'</div></div><div><div class="box"><b>分廠／據點</b>'+ (vs.length?vs.map(s=>'<div class="site"><strong>'+esc(s.site_name)+'</strong><div class="muted">'+esc(tx(s.site_code))+'</div><div>'+esc(tx(s.contact_name))+'｜'+esc(tx(s.phone))+'</div><div>'+esc(tx(s.address))+'</div>'+(isAdmin?'<div style="margin-top:6px"><button class="btn secondary" data-site="'+s.id+'">修改</button></div>':'')+'</div>').join(''):'目前沒有另外的據點')+'</div></div></div>';if(isAdmin){$('editVendor').onclick=()=>openVendor(v.id);$('addSite').onclick=()=>openSite();document.querySelectorAll('[data-site]').forEach(x=>x.onclick=()=>openSite(x.dataset.site))}}
function openVendor(id=null){editingVendor=id?vendors.find(v=>v.id===id):null;const v=editingVendor||{};$('vendorTitle').textContent=id?'修改廠商':'新增廠商';$('vCode').value=v.code||'';$('vShort').value=v.short_name||'';$('vInvoice').value=v.invoice_title||'';$('vTax').value=v.tax_id||'';$('vBilling').value=v.billing_mode||'';$('vContact').value=v.contact_name||'';$('vPhone').value=v.phone||'';$('vFax').value=v.fax||'';$('vEmail').value=v.email||'';$('vAddress').value=v.address||'';$('vBillAddress').value=v.billing_address||'';$('vNote').value=v.note||'';$('vSourceNote').value=v.source_note||'';$('vActive').value=String(v.is_active!==false);$('vendorBack').classList.add('open')}
function openSite(id=null){if(!selected)return;editingSite=id?sites.find(s=>s.id===id):null;const s=editingSite||{};$('siteTitle').textContent=id?'修改據點':'新增據點';$('sCode').value=s.site_code||'';$('sName').value=s.site_name||'';$('sContact').value=s.contact_name||'';$('sPhone').value=s.phone||'';$('sFax').value=s.fax||'';$('sEmail').value=s.email||'';$('sAddress').value=s.address||'';$('sNote').value=s.note||'';$('sActive').value=String(s.is_active!==false);$('siteBack').classList.add('open')}
async function importWorkbook(file){
 if(!isAdmin||!file)return;
 const state=$('importState');state.textContent='正在讀取 Excel…';
 let added=0,skipped=0,siteAdded=0,writeAttempted=false;
 try{
  const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
  const buf=await file.arrayBuffer(),book=XLSX.read(buf,{type:'array'});
  const main=book.Sheets['客戶-通訊錄']||book.Sheets[book.SheetNames[0]];
  const arr=XLSX.utils.sheet_to_json(main,{header:1,defval:null,raw:false});
  const mailSheet=book.Sheets['工作表2'];
  const mailMap=new Map();
  if(mailSheet){
   const mr=XLSX.utils.sheet_to_json(mailSheet,{header:1,defval:null,raw:false});
   for(const r of mr.slice(1)){const code=String(r[0]??'').trim(),title=String(r[1]??'').trim(),addr=String(r[2]??'').trim();if(addr){if(code)mailMap.set('c:'+code,addr);if(title)mailMap.set('t:'+title,addr)}}
  }
  const clean=v=>{const x=String(v??'').replace(/\s+/g,' ').trim();return x||null};
  const rows=arr.slice(1).filter(r=>clean(r[0])&&clean(r[1]));
  const current=vendors.slice();
  for(const r of rows){
   const code=clean(r[0]),shortName=clean(r[1]),invoice=clean(r[2]),tax=clean(r[4]),address=clean(r[8]);
   const sameCompany=current.find(v=>tax&&invoice&&v.tax_id===tax&&v.invoice_title===invoice);
   const branch=/二廠|三廠|CNC|分廠/i.test(shortName||'')||/-P\d*$/i.test(code||'');
   if(sameCompany&&branch){
    const exists=sites.some(x=>x.vendor_id===sameCompany.id&&(x.site_code===code||x.site_name===shortName));
    if(!exists){
     writeAttempted=true;const {data,error}=await supabase.from('vendor_sites').insert({vendor_id:sameCompany.id,site_code:code,site_name:shortName,contact_name:clean(r[5]),phone:clean(r[6]),fax:clean(r[7]),address,email:clean(r[9]),note:[clean(r[10]),clean(r[12])].filter(Boolean).join('｜')||null}).select().single();
     if(error)throw error;sites.push(data);siteAdded++;
    }else skipped++;
    continue;
   }
   const dup=current.find(v=>(v.code===code&&v.short_name===shortName)||(tax&&invoice&&address&&v.tax_id===tax&&v.invoice_title===invoice&&v.address===address));
   if(dup){skipped++;continue}
   const sourceNotes=[clean(r[11]),clean(r[12])].filter(Boolean).join('｜')||null;
   const allText=[invoice,clean(r[5]),clean(r[10]),sourceNotes].filter(Boolean).join(' ');
   const row={code,short_name:shortName,invoice_title:invoice,billing_mode:clean(r[3]),tax_id:tax,contact_name:clean(r[5]),phone:clean(r[6]),fax:clean(r[7]),address,email:clean(r[9]),billing_address:mailMap.get('c:'+code)||mailMap.get('t:'+invoice)||null,note:clean(r[10]),source_note:sourceNotes,is_active:!/很久沒交易|結束營業|沒來/.test(allText)};
   writeAttempted=true;const {data,error}=await supabase.from('vendors').insert(row).select().single();if(error)throw error;current.push(data);added++;
  }
  let refreshed=false;
  try{refreshed=await load()}catch(refreshError){console.error(refreshError)}
  state.textContent='✓ 匯入完成：新增 '+added+' 家廠商、'+siteAdded+' 個據點；略過 '+skipped+' 筆重複資料。'+(refreshed?'':'列表暫時無法更新，請重新開頁核對。');
 }catch(e){
  console.error(e);
  if(!writeAttempted){state.textContent='Excel 讀取失敗，尚未開始寫入：'+(e.message||e)}
  else{
   let refreshed=false;
   try{refreshed=await load()}catch(refreshError){console.error(refreshError)}
   state.textContent='匯入中斷：已確認新增 '+added+' 家廠商、'+siteAdded+' 個據點；略過 '+skipped+' 筆。這不是整批回滾；最後失敗那筆是否已寫入仍不確定。'+(refreshed?'已重新讀取資料，請核對後再匯入。':'無法重新讀取資料，請重新開頁核對後再匯入。')+' 原因：'+(e.message||e);
  }
 }
 finally{$('importExcel').value=''}
}
$('importExcel').onchange=()=>importWorkbook($('importExcel').files[0]);
$('newVendor').onclick=()=>openVendor();$('cancelVendor').onclick=()=>$('vendorBack').classList.remove('open');$('cancelSite').onclick=()=>$('siteBack').classList.remove('open');$('search').oninput=render;
$('saveVendor').onclick=async()=>{const row={code:$('vCode').value.trim()||null,short_name:$('vShort').value.trim(),invoice_title:$('vInvoice').value.trim()||null,billing_mode:$('vBilling').value.trim()||null,tax_id:$('vTax').value.trim()||null,contact_name:$('vContact').value.trim()||null,phone:$('vPhone').value.trim()||null,fax:$('vFax').value.trim()||null,email:$('vEmail').value.trim()||null,address:$('vAddress').value.trim()||null,billing_address:$('vBillAddress').value.trim()||null,note:$('vNote').value.trim()||null,source_note:$('vSourceNote').value.trim()||null,is_active:$('vActive').value==='true',updated_at:new Date().toISOString()};if(!row.short_name)return alert('客戶簡稱要填');const q=editingVendor?supabase.from('vendors').update(row).eq('id',editingVendor.id):supabase.from('vendors').insert(row);const {error}=await q;if(error)return alert('儲存失敗：'+error.message);$('vendorBack').classList.remove('open');editingVendor=null;await load()}
$('saveSite').onclick=async()=>{if(!selected)return;const row={vendor_id:selected.id,site_code:$('sCode').value.trim()||null,site_name:$('sName').value.trim(),contact_name:$('sContact').value.trim()||null,phone:$('sPhone').value.trim()||null,fax:$('sFax').value.trim()||null,email:$('sEmail').value.trim()||null,address:$('sAddress').value.trim()||null,note:$('sNote').value.trim()||null,is_active:$('sActive').value==='true',updated_at:new Date().toISOString()};if(!row.site_name)return alert('據點名稱要填');const q=editingSite?supabase.from('vendor_sites').update(row).eq('id',editingSite.id):supabase.from('vendor_sites').insert(row);const {error}=await q;if(error)return alert('儲存失敗：'+error.message);$('siteBack').classList.remove('open');editingSite=null;await load()}
init();
</script>
</body></html>
