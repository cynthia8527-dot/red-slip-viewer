<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠貨件進度表</title>
<style>
*{box-sizing:border-box}:root{--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e2e6ea;--dark:#202124;--red:#b42318;--redbg:#fff1f0;--amber:#8a5a00;--amberbg:#fff7d6;--green:#067647;--greenbg:#eaf8ef;--blue:#175cd3;--bluebg:#edf4ff;--purple:#6941c6;--purplebg:#f4f0ff}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}.app{width:min(1450px,100%);margin:auto}h1{margin:0 0 5px;font-size:27px}.sub{margin:0;color:var(--muted);font-size:14px}.demo{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#fff3cd;color:#795b00;font-size:12px;font-weight:800}
button,input,select,textarea{font:inherit}.toolbar{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filter{border:1px solid #d4d8de;background:#fff;border-radius:999px;padding:8px 11px;font-weight:750;cursor:pointer}.filter.active{background:var(--dark);border-color:var(--dark);color:#fff}.search{margin-left:auto;min-width:250px;border:1px solid #d4d8de;border-radius:11px;padding:10px 12px;outline:none}.search:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:10px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat small{display:block;color:var(--muted);margin-bottom:3px}.stat strong{font-size:23px}.stat.urgent{background:#fff8f7}.stat.today{background:#fffbed}.stat.overdue{background:#fff4f3}.stat.weigh{background:#f6f2ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#e9ecef;color:#222}
.form{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.form.open{display:block}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dbe2;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:72px;resize:vertical}.span2{grid-column:span 2}.urgentcheck{display:flex;gap:7px;align-items:center;font-weight:800;margin-top:25px}.urgentcheck input{width:18px;height:18px}.photo-preview{width:100%;height:120px;border:1px dashed #cfd5dc;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#fafafa;color:#8b929c;font-size:13px}.photo-preview img{width:100%;height:100%;object-fit:cover}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.035)}table{width:100%;border-collapse:collapse;min-width:1540px}thead th{position:sticky;top:0;z-index:2;background:#f7f8fa;color:#59616d;font-size:12px;text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}tbody td{padding:8px 9px;border-bottom:1px solid #edf0f2;vertical-align:middle;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfc}tr.urgent-row{background:#fff8f7}tr.overdue-row{box-shadow:inset 4px 0 #e5484d}tr.today-row{box-shadow:inset 4px 0 #e3a008}tr.done-row{opacity:.55}.vendor{font-weight:850;white-space:nowrap}.item{min-width:150px}.note{max-width:210px;color:#555;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.due{font-weight:800;white-space:nowrap}.due.overdue{color:var(--red)}.due.today{color:var(--amber)}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}.pill.urgent{background:#fee4e2;color:var(--red)}.pill.normal{background:#f0f2f5;color:#59616d}.pill.pending{background:var(--purplebg);color:var(--purple)}.pill.weight{background:#eef7ff;color:#175cd3}.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;border:1px solid #dde2e7;display:block;cursor:pointer;background:#f6f7f8}.no-photo{width:48px;height:48px;border-radius:9px;border:1px dashed #cfd5dc;display:grid;place-items:center;color:#9aa1aa;font-size:10px;text-align:center;background:#fafafa}.loc,.status{border:1px solid #d8dde3;border-radius:9px;padding:7px 8px;background:#fff;min-width:90px}.status{min-width:115px}.rowbtn{border:0;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800;cursor:pointer;background:#eef1f4;color:#333}.rowbtn.fire{background:#fff0ef;color:var(--red)}.rowbtn.done{background:var(--greenbg);color:var(--green)}.op{display:flex;gap:5px;white-space:nowrap}.empty{text-align:center;color:#888;padding:28px!important}.legend{margin-top:9px;color:#777;font-size:12px}.legend span{margin-right:12px}
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:18px;overflow:auto}.modal-back.open{display:grid;place-items:start center}.modal{width:min(760px,100%);background:#fff;border-radius:18px;margin:3vh auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:#edf0f2;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}.hero{margin:12px 0;height:min(44vh,360px);border-radius:14px;background:#f6f7f8;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#9299a2}.hero img{width:100%;height:100%;object-fit:contain}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detailbox{background:#f7f8fa;border-radius:11px;padding:10px}.detailbox small{display:block;color:var(--muted);font-weight:800;margin-bottom:3px}.detailbox strong{font-size:15px}.full{grid-column:1/-1}.modal-edit{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editgrid .field textarea{min-height:85px}
@media(max-width:900px){body{padding:10px}.stats{grid-template-columns:repeat(3,1fr)}.search{order:10;margin-left:0;width:100%;min-width:0}.formgrid{grid-template-columns:1fr 1fr}.tablewrap{border-radius:12px}}
@media(max-width:560px){h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.formgrid,.detailgrid,.editgrid{grid-template-columns:1fr}.span2,.full{grid-column:span 1}.urgentcheck{margin-top:3px}.stat strong{font-size:20px}.modal-back{padding:8px}.modal{padding:14px}.hero{height:240px}}
</style>
</head>
<body>
<main class="app">
  <h1>工廠貨件進度表</h1>
  <p class="sub">條列看全部貨件；點照片或「查看」可看大圖與完整資料。沒重量的貨會直接標成待秤重。</p>
  <div class="demo">⚠ 示範版：照片與資料目前只存在這台瀏覽器，尚未三地同步</div>

  <section class="toolbar">
    <button class="filter active" data-filter="all">全部</button>
    <button class="filter" data-filter="我這裡">我這裡</button>
    <button class="filter" data-filter="二廠">二廠</button>
    <button class="filter" data-filter="三廠">三廠</button>
    <button class="filter" data-filter="urgent">🔥 急件</button>
    <button class="filter" data-filter="weigh">⚖ 待秤重</button>
    <button class="filter" data-filter="today">今天要</button>
    <input id="search" class="search" placeholder="搜尋廠商、貨品、材料、製程、備註">
  </section>

  <section class="stats">
    <div class="stat"><small>未完成</small><strong id="openCount">0</strong></div>
    <div class="stat urgent"><small>🔥 急件</small><strong id="urgentCount">0</strong></div>
    <div class="stat weigh"><small>⚖ 待秤重</small><strong id="weighCount">0</strong></div>
    <div class="stat today"><small>今天要</small><strong id="todayCount">0</strong></div>
    <div class="stat overdue"><small>已逾期</small><strong id="overdueCount">0</strong></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="toggleForm">＋ 新增貨件</button>
    <button class="btn secondary" id="showDone">顯示已出貨</button>
    <button class="btn secondary" id="restoreDemo">恢復示範資料</button>
  </div>

  <section class="form" id="newForm">
    <div class="formgrid">
      <div class="field"><label>廠商</label><input id="fVendor" placeholder="例如：甲公司"></div>
      <div class="field"><label>貨品／內容</label><input id="fItem" placeholder="例如：軸心 A款"></div>
      <div class="field"><label>材料</label><input id="fMaterial" placeholder="例如：SUS304"></div>
      <div class="field"><label>製程</label><input id="fProcess" placeholder="例如：粗研＋研亮"></div>
      <div class="field"><label>箱數／件數</label><input id="fBoxes" placeholder="例如：2箱、3籃"></div>
      <div class="field"><label>重量 kg（不知道可留空）</label><input id="fWeight" inputmode="decimal" type="number" step="any" min="0" placeholder="留空＝待秤重"></div>
      <div class="field"><label>若待秤重，要在哪秤</label><select id="fWeighAt"><option value="">不用／已知重量</option><option>我這裡</option><option>二廠</option><option>三廠</option></select></div>
      <div class="field"><label>目前位置</label><select id="fLocation"><option>我這裡</option><option>二廠</option><option>三廠</option></select></div>
      <div class="field"><label>幾號要</label><input id="fDue" type="date"></div>
      <div class="field"><label>狀態</label><select id="fStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div>
      <div class="field span2"><label>備註</label><textarea id="fNote" placeholder="客戶會問、先做、要特別研亮、送去哪裡…"></textarea></div>
      <div class="field span2"><label>產品／來貨照片</label><input id="fPhoto" type="file" accept="image/*"><div class="photo-preview" id="fPhotoPreview">尚未選照片</div></div>
      <label class="urgentcheck"><input type="checkbox" id="fUrgent">🔥 急件／趕件</label>
    </div>
    <div class="actions"><button class="btn primary" id="addTask">新增</button><button class="btn secondary" id="cancelForm">取消</button></div>
  </section>

  <div class="tablewrap">
    <table>
      <thead><tr><th>急</th><th>照片</th><th>廠商</th><th>貨品</th><th>材料</th><th>製程</th><th>箱數</th><th>重量</th><th>目前位置</th><th>狀態</th><th>幾號要</th><th>備註</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="legend"><span>🔴 左紅線＝逾期</span><span>🟡 左黃線＝今天要</span><span>⚖＝尚未秤重</span><span>🔥＝急件</span></div>
</main>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-head"><div><h2 id="mTitle">貨件詳細</h2><div class="sub" id="mSub"></div></div><button class="close" id="mClose">×</button></div>
    <div class="hero" id="mHero">沒有照片</div>
    <div class="detailgrid" id="mDetails"></div>
    <div class="modal-edit">
      <strong>修改這筆資料</strong>
      <div class="editgrid" style="margin-top:9px">
        <div class="field"><label>材料</label><input id="eMaterial"></div>
        <div class="field"><label>製程</label><input id="eProcess"></div>
        <div class="field"><label>箱數／件數</label><input id="eBoxes"></div>
        <div class="field"><label>重量 kg</label><input id="eWeight" type="number" step="any" min="0" placeholder="留空＝待秤重"></div>
        <div class="field"><label>秤重地點</label><select id="eWeighAt"><option value="">不用／已知重量</option><option>我這裡</option><option>二廠</option><option>三廠</option></select></div>
        <div class="field"><label>更換／補照片</label><input id="ePhoto" type="file" accept="image/*"></div>
        <div class="field full"><label>備註</label><textarea id="eNote"></textarea></div>
      </div>
      <div class="actions"><button class="btn primary" id="saveEdit">儲存修改</button></div>
    </div>
  </div>
</div>
<script>
const STORE='factory-board-list-demo-v3';
const locations=['我這裡','二廠','三廠'];
const statuses=['未開始','處理中','完成待出貨','已出貨'];
let activeFilter='all',showDone=false,currentId=null,newPhoto='';
function offset(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function fakePhoto(label,bg){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520"><rect width="100%" height="100%" fill="${bg}"/><circle cx="400" cy="235" r="120" fill="#c5cbd2"/><rect x="245" y="210" width="310" height="80" rx="38" fill="#8d969f"/><text x="400" y="420" font-family="sans-serif" font-size="42" text-anchor="middle" fill="#454b52">${label}</text><text x="400" y="470" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#6c737b">示範產品照片</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function demo(){return [
{id:uid(),vendor:'測試甲精密',item:'軸心 A款',material:'SUS304',process:'粗研 → 研亮',boxes:'2箱',weight:'',weighAt:'二廠',location:'我這裡',status:'未開始',due:offset(0),urgent:true,note:'客戶下午可能會問；到二廠後先秤重。',photo:fakePhoto('軸心 A款','#eef2f5')},
{id:uid(),vendor:'測試乙工業',item:'不鏽鋼小件',material:'SUS316',process:'細研',boxes:'1桶',weight:'86.5',weighAt:'',location:'我這裡',status:'處理中',due:offset(2),urgent:false,note:'表面不能刮傷。',photo:fakePhoto('不鏽鋼小件','#f1f3f4')},
{id:uid(),vendor:'測試丙企業',item:'螺絲',material:'鐵',process:'震動研磨',boxes:'3籃',weight:'',weighAt:'二廠',location:'二廠',status:'處理中',due:offset(1),urgent:true,note:'二廠直送，不經過我這裡。尚未秤。',photo:''},
{id:uid(),vendor:'測試丁科技',item:'鋁件',material:'鋁合金',process:'去毛邊＋亮面',boxes:'4箱',weight:'132',weighAt:'',location:'二廠',status:'完成待出貨',due:offset(0),urgent:false,note:'做好，等客戶車來載。',photo:fakePhoto('鋁件','#f5f2ed')},
{id:uid(),vendor:'測試己實業',item:'鑄件',material:'鑄鐵',process:'粗研',boxes:'2桶',weight:'',weighAt:'三廠',location:'三廠',status:'未開始',due:offset(-1),urgent:true,note:'昨天應該要出；三廠要先秤重。',photo:''},
{id:uid(),vendor:'測試庚有限公司',item:'薄片件',material:'SUS304',process:'研亮',boxes:'5盤',weight:'54.2',weighAt:'',location:'三廠',status:'處理中',due:offset(3),urgent:false,note:'研亮時間要久一點。',photo:fakePhoto('薄片件','#edf3f0')},
{id:uid(),vendor:'測試壬金屬',item:'華司',material:'鐵',process:'研磨後送三廠',boxes:'6桶',weight:'205',weighAt:'',location:'二廠',status:'處理中',due:offset(2),urgent:false,note:'完成後直接送三廠。',photo:''},
{id:uid(),vendor:'測試丑企業',item:'小螺帽',material:'鐵',process:'一般研磨',boxes:'8籃',weight:'178',weighAt:'',location:'二廠',status:'已出貨',due:offset(-2),urgent:false,note:'客戶已自取。',photo:''}
]}
function save(){try{localStorage.setItem(STORE,JSON.stringify(tasks))}catch(e){alert('瀏覽器儲存空間不足，圖片可能太多。正式版會改存雲端，不會用這種方式。')}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(x))return x}catch(e){}return demo()}
let tasks=load();if(!localStorage.getItem(STORE))save();
const tbody=document.getElementById('tbody'),search=document.getElementById('search'),newForm=document.getElementById('newForm'),modalBack=document.getElementById('modalBack');
function today(){return offset(0)}
function dueType(t){if(t.status==='已出貨')return'done';if(!t.due)return'future';if(t.due<today())return'overdue';if(t.due===today())return'today';return'future'}
function dueText(t){if(!t.due)return'—';const md=t.due.slice(5).replace('-','/');if(t.status==='已出貨')return md;if(t.due<today())return`逾期 ${md}`;if(t.due===today())return'今天';return md}
function pendingWeigh(t){return (t.weight===''||t.weight===null||typeof t.weight==='undefined')&&t.status!=='已出貨'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function options(list,val){return list.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}
function visible(t){if(!showDone&&t.status==='已出貨')return false;if(activeFilter==='urgent'&&!t.urgent)return false;if(activeFilter==='today'&&t.due!==today())return false;if(activeFilter==='weigh'&&!pendingWeigh(t))return false;if(locations.includes(activeFilter)&&t.location!==activeFilter)return false;const q=search.value.trim().toLowerCase();if(q&&!`${t.vendor} ${t.item} ${t.material} ${t.process} ${t.note} ${t.location}`.toLowerCase().includes(q))return false;return true}
function weightHtml(t){if(pendingWeigh(t))return `<span class="pill pending">⚖ 待秤重${t.weighAt?'｜'+esc(t.weighAt):''}</span>`;return `<span class="pill weight">${t.weight!==''?esc(t.weight)+' kg':'—'}</span>`}
function render(){
 const list=tasks.filter(visible).sort((a,b)=>{if(a.status==='已出貨'&&b.status!=='已出貨')return 1;if(b.status==='已出貨'&&a.status!=='已出貨')return -1;if(a.urgent!==b.urgent)return a.urgent?-1:1;return (a.due||'9999').localeCompare(b.due||'9999')});
 tbody.innerHTML=list.length?list.map(t=>{const d=dueType(t);const cls=[t.urgent?'urgent-row':'',d==='overdue'?'overdue-row':'',d==='today'?'today-row':'',t.status==='已出貨'?'done-row':''].join(' ');return `<tr class="${cls}">
 <td><span class="pill ${t.urgent?'urgent':'normal'}">${t.urgent?'🔥 急':'—'}</span></td>
 <td>${t.photo?`<img class="thumb" data-view="${t.id}" src="${t.photo}" alt="產品照片">`:`<div class="no-photo" data-view="${t.id}">無<br>照片</div>`}</td>
 <td class="vendor">${esc(t.vendor)}</td><td class="item">${esc(t.item)}</td><td>${esc(t.material||'—')}</td><td>${esc(t.process||'—')}</td><td>${esc(t.boxes||'—')}</td><td>${weightHtml(t)}</td>
 <td><select class="loc" data-id="${t.id}">${options(locations,t.location)}</select></td><td><select class="status" data-id="${t.id}">${options(statuses,t.status)}</select></td>
 <td class="due ${d==='overdue'?'overdue':d==='today'?'today':''}">${dueText(t)}</td><td class="note" title="${esc(t.note)}">${esc(t.note||'—')}</td>
 <td><div class="op"><button class="rowbtn" data-view="${t.id}">查看／編輯</button><button class="rowbtn fire" data-fire="${t.id}">${t.urgent?'取消急件':'設急件'}</button>${t.status!=='已出貨'?`<button class="rowbtn done" data-done="${t.id}">已出貨</button>`:''}</div></td></tr>`}).join(''):`<tr><td colspan="13" class="empty">目前沒有符合條件的貨件</td></tr>`;
 const open=tasks.filter(t=>t.status!=='已出貨');document.getElementById('openCount').textContent=open.length;document.getElementById('urgentCount').textContent=open.filter(t=>t.urgent).length;document.getElementById('weighCount').textContent=open.filter(pendingWeigh).length;document.getElementById('todayCount').textContent=open.filter(t=>t.due===today()).length;document.getElementById('overdueCount').textContent=open.filter(t=>t.due&&t.due<today()).length;document.getElementById('showDone').textContent=showDone?'隱藏已出貨':'顯示已出貨';
}
async function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
function previewPhoto(data){const p=document.getElementById('fPhotoPreview');p.innerHTML=data?`<img src="${data}" alt="預覽">`:'尚未選照片'}
document.getElementById('fPhoto').addEventListener('change',async e=>{const f=e.target.files[0];if(!f){newPhoto='';previewPhoto('');return}newPhoto=await compressImage(f);previewPhoto(newPhoto)});
function clearForm(){['fVendor','fItem','fMaterial','fProcess','fBoxes','fWeight','fDue','fNote'].forEach(x=>document.getElementById(x).value='');document.getElementById('fWeighAt').value='';document.getElementById('fLocation').value='我這裡';document.getElementById('fStatus').value='未開始';document.getElementById('fUrgent').checked=false;document.getElementById('fPhoto').value='';newPhoto='';previewPhoto('')}
document.getElementById('addTask').onclick=()=>{const vendor=document.getElementById('fVendor').value.trim(),item=document.getElementById('fItem').value.trim();if(!vendor||!item){alert('至少要填廠商和貨品');return}tasks.push({id:uid(),vendor,item,material:document.getElementById('fMaterial').value.trim(),process:document.getElementById('fProcess').value.trim(),boxes:document.getElementById('fBoxes').value.trim(),weight:document.getElementById('fWeight').value.trim(),weighAt:document.getElementById('fWeighAt').value,location:document.getElementById('fLocation').value,status:document.getElementById('fStatus').value,due:document.getElementById('fDue').value,urgent:document.getElementById('fUrgent').checked,note:document.getElementById('fNote').value.trim(),photo:newPhoto});save();clearForm();newForm.classList.remove('open');render()};
function openModal(id){const t=tasks.find(x=>x.id===id);if(!t)return;currentId=id;document.getElementById('mTitle').textContent=`${t.vendor}｜${t.item}`;document.getElementById('mSub').textContent=`${t.location}｜${t.status}`;document.getElementById('mHero').innerHTML=t.photo?`<img src="${t.photo}" alt="${esc(t.item)}">`:'沒有照片';document.getElementById('mDetails').innerHTML=`<div class="detailbox"><small>材料</small><strong>${esc(t.material||'—')}</strong></div><div class="detailbox"><small>製程</small><strong>${esc(t.process||'—')}</strong></div><div class="detailbox"><small>箱數／件數</small><strong>${esc(t.boxes||'—')}</strong></div><div class="detailbox"><small>重量</small><strong>${pendingWeigh(t)?`待秤重${t.weighAt?'｜'+esc(t.weighAt):''}`:esc(t.weight||'—')+' kg'}</strong></div><div class="detailbox"><small>幾號要</small><strong>${esc(t.due||'—')}</strong></div><div class="detailbox"><small>急件</small><strong>${t.urgent?'🔥 是':'否'}</strong></div><div class="detailbox full"><small>備註</small><strong>${esc(t.note||'—')}</strong></div>`;document.getElementById('eMaterial').value=t.material||'';document.getElementById('eProcess').value=t.process||'';document.getElementById('eBoxes').value=t.boxes||'';document.getElementById('eWeight').value=t.weight??'';document.getElementById('eWeighAt').value=t.weighAt||'';document.getElementById('eNote').value=t.note||'';document.getElementById('ePhoto').value='';modalBack.classList.add('open')}
function closeModal(){modalBack.classList.remove('open');currentId=null}
document.getElementById('saveEdit').onclick=async()=>{const t=tasks.find(x=>x.id===currentId);if(!t)return;t.material=document.getElementById('eMaterial').value.trim();t.process=document.getElementById('eProcess').value.trim();t.boxes=document.getElementById('eBoxes').value.trim();t.weight=document.getElementById('eWeight').value.trim();t.weighAt=t.weight!==''?'':document.getElementById('eWeighAt').value;t.note=document.getElementById('eNote').value.trim();const f=document.getElementById('ePhoto').files[0];if(f)t.photo=await compressImage(f);save();render();openModal(t.id)};
document.getElementById('mClose').onclick=closeModal;modalBack.addEventListener('click',e=>{if(e.target===modalBack)closeModal()});
tbody.addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;const t=tasks.find(x=>x.id===id);if(!t)return;if(e.target.classList.contains('loc'))t.location=e.target.value;if(e.target.classList.contains('status'))t.status=e.target.value;save();render()});
tbody.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){openModal(v.dataset.view);return}const fire=e.target.dataset.fire,done=e.target.dataset.done;if(fire){const t=tasks.find(x=>x.id===fire);t.urgent=!t.urgent;save();render()}if(done){const t=tasks.find(x=>x.id===done);t.status='已出貨';save();render()}});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});search.addEventListener('input',render);document.getElementById('toggleForm').onclick=()=>newForm.classList.toggle('open');document.getElementById('cancelForm').onclick=()=>newForm.classList.remove('open');document.getElementById('showDone').onclick=()=>{showDone=!showDone;render()};document.getElementById('restoreDemo').onclick=()=>{if(confirm('要恢復示範資料嗎？目前測試修改會被清掉。')){tasks=demo();save();render()}};
render();
</script>
</body>
</html>
