<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠貨件進度表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}.app{max-width:1400px;margin:auto}h1{margin:0 0 5px}.sub{color:#6b7280;margin:0}.notice{display:inline-block;margin-top:8px;padding:7px 10px;border-radius:999px;background:#fff3cd;color:#795b00;font-size:12px;font-weight:800}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.link{margin-top:8px;padding:7px 10px;border-radius:999px;background:#e8eefc;color:#254ea5;text-decoration:none;font-size:12px;font-weight:900}.tabs,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0 10px}.tab,.filter,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.tab,.filter,.btn.secondary{background:#e9ecef}.tab.active,.filter.active,.btn.primary{background:#202124;color:#fff}.toolbar{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{margin-left:auto;min-width:240px;padding:10px 12px;border:1px solid #d4d8de;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.stat{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:12px}.stat small{display:block;color:#6b7280}.stat strong{font-size:22px}.form{display:none;background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:14px;margin:10px 0}.form.open{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;color:#6b7280;font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d7dbe2;border-radius:10px;background:#fff}.field textarea{min-height:70px}.span2{grid-column:span 2}.hint{font-size:11px;color:#667085;margin-top:4px}.tablewrap{background:#fff;border:1px solid #e2e6ea;border-radius:16px;overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;min-width:1350px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}th{background:#f7f8fa;color:#59616d}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:850}.urgent{background:#fee4e2;color:#b42318}.normal{background:#f0f2f5}.shipped{background:#eaf8ef;color:#067647}.product{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:999px;background:#e8eefc;color:#254ea5;font-size:10px;font-weight:900}.pending{display:inline-block;padding:7px 9px;border-radius:10px;background:#f2edff;color:#6941c6;font-weight:900}.loc,.statusSel{padding:7px;border:1px solid #d8dde3;border-radius:8px;background:#fff}.rowbtn{border:0;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.mobile{display:none}.mcard{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:12px;margin-bottom:9px}.mhead{display:flex;justify-content:space-between;gap:10px}.mvendor{font-weight:900}.mitem{margin-top:3px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mcell{background:#f7f8fa;border-radius:10px;padding:8px}.mcell small{display:block;color:#6b7280}.loading{padding:20px;text-align:center;color:#666}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.tablewrap{display:none}.mobile{display:block}.search{width:100%;margin-left:0}}
@media(max-width:560px){body{padding:8px}.grid{grid-template-columns:1fr}.span2{grid-column:span 1}.stats{grid-template-columns:1fr 1fr}.tabs .tab{flex:1}}
</style>
</head>
<body><main class="app">
<h1>工廠貨件進度表</h1><p class="sub">蘆洲、五股、八里共用。</p>
<div class="top"><div class="notice">🧪 雲端同步測試版：目前只放假資料，先不要輸入真客戶資料</div><a class="link" href="../calculator/">📚 產品／價格／製程知識庫</a></div>
<div class="tabs"><button class="tab active" data-tab="active">貨件進度 <span id="cActive">0</span></button><button class="tab" data-tab="shipped">出貨紀錄 <span id="cShipped">0</span></button></div>
<section class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="蘆洲">蘆洲</button><button class="filter" data-filter="五股">五股</button><button class="filter" data-filter="八里">八里</button><button class="filter" data-filter="urgent">🔥 急件</button><button class="filter" data-filter="weigh">⚖ 待秤重</button><input id="search" class="search" placeholder="搜尋廠商、貨品、材料、製程、備註"></section>
<section class="stats"><div class="stat"><small>未完成</small><strong id="sOpen">0</strong></div><div class="stat"><small>🔥 急件</small><strong id="sUrgent">0</strong></div><div class="stat"><small>⚖ 待秤重</small><strong id="sWeigh">0</strong></div><div class="stat"><small>今天要</small><strong id="sToday">0</strong></div></section>
<div class="actions"><button class="btn primary" id="toggleForm">＋ 新增測試貨件</button><button class="btn secondary" id="reload">重新讀取雲端</button></div>
<section class="form" id="form"><div class="grid">
<div class="field span2"><label>從產品資料庫選擇</label><select id="fProduct"><option value="">手動輸入／不指定產品</option></select><div class="hint" id="productHint">選產品會帶入品名、材料、製程。</div></div>
<div class="field"><label>廠商</label><input id="fVendor" list="vendorList"><datalist id="vendorList"></datalist></div><div class="field"><label>貨品</label><input id="fItem"></div>
<div class="field"><label>材料</label><input id="fMaterial"></div><div class="field"><label>製程</label><input id="fProcess"></div><div class="field"><label>箱數／件數</label><input id="fBoxes" placeholder="2箱、3籃"></div><div class="field"><label>重量 kg</label><input id="fWeight" type="number" step="any" placeholder="留空＝待秤重"></div>
<div class="field"><label>待秤重地點</label><select id="fWeighAt"><option value="">未指定</option><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>目前位置</label><select id="fLocation"><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>狀態</label><select id="fStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div><div class="field"><label>幾號要</label><input id="fDue" type="date"></div>
<div class="field span2"><label>備註</label><textarea id="fNote"></textarea></div><div class="field"><label><input id="fUrgent" type="checkbox"> 🔥 急件</label></div>
</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="addTask">新增</button><button class="btn secondary" id="cancel">取消</button></div></section>
<div id="loading" class="loading">正在讀取 Supabase…</div>
<div class="tablewrap"><table><thead><tr><th>急</th><th>廠商</th><th>貨品</th><th>材料</th><th>製程</th><th>箱數</th><th>重量</th><th>位置</th><th>狀態</th><th>幾號要</th><th>備註</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="mobile" class="mobile"></div>
</main>
<script>
const SHIP_API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/shipments-demo';
const CAT_API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/catalog-public';
const locations=['蘆洲','五股','八里'],statuses=['未開始','處理中','完成待出貨','已出貨'];
const $=id=>document.getElementById(id);let tasks=[],products=[],prices=[],view='active',filter='all';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}function hasWeight(t){return t.weight_kg!==null&&t.weight_kg!==''}function pById(id){return products.find(p=>p.id===id)}
function mapTask(x){return {...x,vendor:x.vendor_name,item:x.item_name,productId:x.product_id||'',weight:x.weight_kg,due:x.due_date||'',weighAt:x.weigh_at||'',shippedAt:x.shipped_at||''}}
async function loadAll(){
 $('loading').style.display='block';
 const [sr,cr]=await Promise.all([fetch(SHIP_API),fetch(CAT_API)]);if(!sr.ok||!cr.ok)throw new Error('load failed');
 const sd=await sr.json(),cd=await cr.json();tasks=(sd.shipments||[]).map(mapTask);products=cd.products||[];prices=cd.prices||[];
 $('fProduct').innerHTML='<option value="">手動輸入／不指定產品</option>'+products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('');
 $('vendorList').innerHTML=[...new Set(prices.map(x=>x.vendor_name))].map(v=>`<option value="${esc(v)}"></option>`).join('');$('loading').style.display='none';render();
}
function visible(t){if(view==='active'&&t.status==='已出貨')return false;if(view==='shipped'&&t.status!=='已出貨')return false;if(filter==='urgent'&&!t.urgent)return false;if(filter==='weigh'&&hasWeight(t))return false;if(locations.includes(filter)&&t.location!==filter)return false;const q=$('search').value.trim().toLowerCase();return !q||`${t.vendor} ${t.item} ${t.material||''} ${t.process||''} ${t.note||''}`.toLowerCase().includes(q)}
function sortTasks(a,b){if(view==='shipped')return String(b.shippedAt||b.due||'').localeCompare(String(a.shippedAt||a.due||''));if(a.urgent!==b.urgent)return a.urgent?-1:1;if(!!a.due!==!!b.due)return a.due?-1:1;if(a.due&&b.due)return a.due.localeCompare(b.due);return a.vendor.localeCompare(b.vendor,'zh-Hant')}
function opts(list,v){return list.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}function tag(t){return t.productId&&pById(t.productId)?'<span class="product">📚產品庫</span>':''}
function render(){const open=tasks.filter(t=>t.status!=='已出貨'),sh=tasks.filter(t=>t.status==='已出貨');$('cActive').textContent=open.length;$('cShipped').textContent=sh.length;$('sOpen').textContent=open.length;$('sUrgent').textContent=open.filter(t=>t.urgent).length;$('sWeigh').textContent=open.filter(t=>!hasWeight(t)).length;$('sToday').textContent=open.filter(t=>t.due===today()).length;const list=tasks.filter(visible).sort(sortTasks);
 $('tbody').innerHTML=list.length?list.map(t=>`<tr><td><span class="pill ${t.status==='已出貨'?'shipped':t.urgent?'urgent':'normal'}">${t.status==='已出貨'?'✓出':t.urgent?'🔥急':'—'}</span></td><td><b>${esc(t.vendor)}</b></td><td>${esc(t.item)}${tag(t)}</td><td>${esc(t.material||'—')}</td><td>${esc(t.process||'—')}</td><td>${esc(t.boxes||'—')}</td><td>${hasWeight(t)?esc(t.weight)+' kg':`<span class="pending">⚖ 待秤重${t.weighAt?'｜'+esc(t.weighAt):''}</span>`}</td><td><select class="loc" data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select></td><td><select class="statusSel" data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></td><td>${t.due||'未定'}</td><td>${esc(t.note||'—')}</td><td><button class="rowbtn" data-fire="${t.id}">${t.urgent?'取消急':'標急'}</button></td></tr>`).join(''):'<tr><td colspan="12" style="text-align:center;padding:25px">沒有資料</td></tr>';
 $('mobile').innerHTML=list.map(t=>`<article class="mcard"><div class="mhead"><div><div class="mvendor">${esc(t.vendor)}</div><div class="mitem">${esc(t.item)} ${tag(t)}</div></div><span class="pill ${t.status==='已出貨'?'shipped':t.urgent?'urgent':'normal'}">${t.status==='已出貨'?'✓ 已出貨':t.urgent?'🔥 急件':t.status}</span></div>${!hasWeight(t)?`<div class="pending" style="margin-top:10px">⚖ 待秤重${t.weighAt?'｜'+esc(t.weighAt):''}</div>`:''}<div class="mgrid"><div class="mcell"><small>材料</small>${esc(t.material||'—')}</div><div class="mcell"><small>製程</small>${esc(t.process||'—')}</div><div class="mcell"><small>箱數</small>${esc(t.boxes||'—')}</div><div class="mcell"><small>重量</small>${hasWeight(t)?esc(t.weight)+' kg':'待秤'}</div><div class="mcell"><small>位置</small><select data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select></div><div class="mcell"><small>狀態</small><select data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></div></div></article>`).join('');bind();}
async function patch(id,body){const r=await fetch(SHIP_API,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...body})});if(!r.ok)throw new Error(await r.text());const d=await r.json();const i=tasks.findIndex(t=>t.id===id);if(i>=0)tasks[i]=mapTask(d.shipment);render()}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>patch(el.dataset.id,{[el.dataset.field]:el.value}).catch(e=>alert('更新失敗：'+e.message)));document.querySelectorAll('[data-fire]').forEach(el=>el.onclick=()=>{const t=tasks.find(x=>x.id===el.dataset.fire);patch(t.id,{urgent:!t.urgent}).catch(e=>alert('更新失敗：'+e.message))})}
$('fProduct').onchange=()=>{const p=pById($('fProduct').value);if(!p)return;$('fItem').value=p.name||'';$('fMaterial').value=p.material||'';$('fProcess').value=p.standard_process||'';const list=prices.filter(x=>x.product_id===p.id);if(!$('fVendor').value&&list.length===1)$('fVendor').value=list[0].vendor_name;$('productHint').textContent='📚 已連結 '+p.name};
$('toggleForm').onclick=()=>{$('form').classList.toggle('open')};$('cancel').onclick=()=>$('form').classList.remove('open');$('reload').onclick=()=>loadAll().catch(e=>alert(e.message));$('search').oninput=render;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{view=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('addTask').onclick=async()=>{const body={vendor_name:$('fVendor').value.trim(),item_name:$('fItem').value.trim(),product_id:$('fProduct').value||null,material:$('fMaterial').value.trim()||null,process:$('fProcess').value.trim()||null,boxes:$('fBoxes').value.trim()||null,weight_kg:$('fWeight').value,weigh_at:$('fWeighAt').value||null,location:$('fLocation').value,status:$('fStatus').value,due_date:$('fDue').value||null,urgent:$('fUrgent').checked,note:$('fNote').value.trim()||null};if(!body.vendor_name||!body.item_name){alert('至少填廠商和貨品');return}const r=await fetch(SHIP_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert('新增失敗');return}const d=await r.json();tasks.unshift(mapTask(d.shipment));['fVendor','fItem','fMaterial','fProcess','fBoxes','fWeight','fDue','fNote'].forEach(x=>$(x).value='');$('fProduct').value='';$('fWeighAt').value='';$('fLocation').value='蘆洲';$('fStatus').value='未開始';$('fUrgent').checked=false;$('form').classList.remove('open');render()};
loadAll().catch(e=>{$('loading').textContent='讀取失敗：'+e.message});
</script></body></html>
