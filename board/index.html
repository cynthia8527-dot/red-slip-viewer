<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工廠貨件進度表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}.app{max-width:1450px;margin:auto}h1{margin:0 0 5px}.sub{color:#6b7280;margin:0}.top,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notice,.sync,.link{display:inline-block;margin-top:8px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.notice{background:#fff3cd;color:#795b00}.sync{background:#eaf8ef;color:#067647}.link{background:#e8eefc;color:#254ea5;text-decoration:none}.tabs{margin:16px 0 10px}.tab,.filter,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.tab,.filter,.btn.secondary{background:#e9ecef}.tab.active,.filter.active,.btn.primary{background:#202124;color:#fff}.toolbar{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{margin-left:auto;min-width:240px;padding:10px 12px;border:1px solid #d4d8de;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.stat{background:#fff;border:1px solid #e2e6ea;border-radius:14px;padding:12px}.stat small{display:block;color:#6b7280}.stat strong{font-size:22px}.form{display:none;background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:14px;margin:10px 0}.form.open{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;color:#6b7280;font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d7dbe2;border-radius:10px;background:#fff}.field textarea{min-height:70px}.span2{grid-column:span 2}.full{grid-column:1/-1}.hint{font-size:11px;color:#667085;margin-top:4px;line-height:1.45}.check{display:flex!important;gap:7px;align-items:center;color:#202124!important;font-size:14px!important;margin-top:24px}.check input{width:18px!important;height:18px}.product-preview{display:none;grid-column:1/-1;border:1px solid #dfe5ec;border-radius:14px;background:#f8fafc;padding:12px;grid-template-columns:110px 1fr;gap:12px}.product-preview.show{display:grid}.pimg{width:110px;height:110px;border-radius:12px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;color:#8a929c;font-size:12px;text-align:center}.pimg img{width:100%;height:100%;object-fit:cover}.pinfo{display:grid;gap:7px}.prow{background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45}.prow b{display:block;font-size:11px;color:#667085;margin-bottom:2px}.tablewrap{background:#fff;border:1px solid #e2e6ea;border-radius:16px;overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;min-width:1450px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}th{background:#f7f8fa;color:#59616d}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:850}.urgent{background:#fee4e2;color:#b42318}.normal{background:#f0f2f5}.shipped{background:#eaf8ef;color:#067647}.product{background:#e8eefc;color:#254ea5}.lock{background:#fff0ef;color:#b42318}.pending{display:inline-block;padding:7px 9px;border-radius:10px;background:#f2edff;color:#6941c6;font-weight:900}.loc,.statusSel{padding:7px;border:1px solid #d8dde3;border-radius:8px;background:#fff}.rowbtn{border:0;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer;background:#edf0f2}.ops{display:flex;gap:6px;white-space:nowrap}.mobile{display:none}.mcard{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:12px;margin-bottom:9px}.mhead{display:flex;justify-content:space-between;gap:10px}.mvendor{font-weight:900}.mitem{margin-top:3px}.mtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mcell{background:#f7f8fa;border-radius:10px;padding:8px}.mcell small{display:block;color:#6b7280}.mupdated{margin-top:10px;color:#667085;font-size:12px}.updatedAt{white-space:nowrap;color:#667085;font-size:12px}.mactions{display:flex;gap:8px;margin-top:10px}.mactions .rowbtn{flex:1;padding:10px}.loading{padding:20px;text-align:center;color:#666}.modalback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;padding:12px;overflow:auto}.modalback.open{display:grid;place-items:start center}.modal{width:min(800px,100%);background:#fff;border-radius:18px;margin:3vh auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.modalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.modalhead h2{margin:0}.x{border:0;border-radius:10px;background:#edf0f2;width:38px;height:38px;font-size:20px;cursor:pointer}.saving{opacity:.6;pointer-events:none}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.tablewrap{display:none}.mobile{display:block}.search{width:100%;margin-left:0}}
@media(max-width:560px){body{padding:8px}.grid{grid-template-columns:1fr}.span2,.full{grid-column:span 1}.stats{grid-template-columns:1fr 1fr}.tabs .tab{flex:1}.modal{padding:14px}.product-preview.show{grid-template-columns:1fr}.pimg{width:100%;height:180px}.check{margin-top:2px}}
</style>
</head>
<body><main class="app">
<h1>工廠貨件進度表</h1><p class="sub">蘆洲、五股、八里共用。</p>
<div class="top"><div class="notice">🧪 雲端同步測試版：目前只放假資料，先不要輸入真客戶資料</div><div class="sync" id="syncText">☁ 自動同步中</div><a class="link" href="../calculator/">📚 產品／價格／製程知識庫</a></div>
<div class="tabs"><button class="tab active" data-tab="active">貨件進度 <span id="cActive">0</span></button><button class="tab" data-tab="shipped">出貨紀錄 <span id="cShipped">0</span></button></div>
<section class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="蘆洲">蘆洲</button><button class="filter" data-filter="五股">五股</button><button class="filter" data-filter="八里">八里</button><button class="filter" data-filter="urgent">🔥 急件</button><button class="filter" data-filter="weigh">⚖ 待秤重</button><input id="search" class="search" placeholder="搜尋廠商、貨品、批次、材料、製程、備註"></section>
<section class="stats"><div class="stat"><small>未完成</small><strong id="sOpen">0</strong></div><div class="stat"><small>🔥 急件</small><strong id="sUrgent">0</strong></div><div class="stat"><small>⚖ 待秤重</small><strong id="sWeigh">0</strong></div><div class="stat"><small>今天要</small><strong id="sToday">0</strong></div></section>
<div class="actions"><button class="btn primary" id="toggleForm">＋ 新增測試貨件</button><button class="btn secondary" id="reload">手動重新整理</button></div>
<section class="form" id="form"><div class="grid">
<div class="field span2"><label>1. 廠商</label><input id="fVendor" list="vendorList" placeholder="先選／輸入廠商"><datalist id="vendorList"></datalist><div class="hint">先選廠商，下面產品只會顯示這個廠商有建立價格的產品。</div></div>
<div class="field span2"><label>2. 產品</label><select id="fProduct" disabled><option value="">請先選廠商</option></select><div class="hint" id="productHint">先選廠商，再選產品。</div></div>
<div id="fPreview" class="product-preview"></div>
<div class="field"><label>貨品</label><input id="fItem"></div><div class="field"><label>材料</label><input id="fMaterial"></div><div class="field"><label>製程</label><input id="fProcess"></div><div class="field"><label>箱數／件數</label><input id="fBoxes" placeholder="2箱、3籃"></div>
<div class="field"><label>重量 kg</label><input id="fWeight" type="number" step="any" placeholder="留空＝⚖ 待秤重"><div class="hint">不知道重量就留空，系統只會提醒「待秤重」。</div></div>
<div class="field"><label>批次／不可混標記（可留空）</label><input id="fBatch" placeholder="例如：A批、左邊那袋"></div><div class="field"><label class="check"><input id="fCannotMix" type="checkbox"> 🔒 這批不可混</label></div><div class="field"><label>目前位置</label><select id="fLocation"><option>蘆洲</option><option>五股</option><option>八里</option></select></div>
<div class="field"><label>狀態</label><select id="fStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div><div class="field"><label>幾號要</label><input id="fDue" type="date"></div><div class="field span2"><label>備註</label><textarea id="fNote" placeholder="同一次來貨、特殊要求、送哪裡等都可以寫這裡"></textarea></div><div class="field"><label class="check"><input id="fUrgent" type="checkbox"> 🔥 急件</label></div>
</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="addTask">新增貨件</button><button class="btn secondary" id="cancel">取消</button></div></section>
<div id="loading" class="loading">正在讀取 Supabase…</div>
<div class="tablewrap"><table><thead><tr><th>急</th><th>廠商</th><th>貨品／批次</th><th>材料</th><th>製程</th><th>箱數</th><th>重量</th><th>位置</th><th>狀態</th><th>幾號要</th><th>備註</th><th>最後更新</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="mobile" class="mobile"></div>
</main>
<div class="modalback" id="modalBack"><section class="modal" id="modal"><div class="modalhead"><div><h2 id="mTitle">修改貨件</h2><div class="sub" id="mSub"></div></div><button class="x" id="mClose">×</button></div><div class="grid" style="margin-top:14px">
<div class="field span2"><label>1. 廠商</label><input id="eVendor" list="vendorList"></div><div class="field span2"><label>2. 產品資料庫</label><select id="eProduct"><option value="">手動輸入／不指定產品</option></select><div class="hint" id="eProductHint"></div></div><div id="ePreview" class="product-preview"></div>
<div class="field"><label>貨品</label><input id="eItem"></div><div class="field"><label>材料</label><input id="eMaterial"></div><div class="field"><label>製程</label><input id="eProcess"></div><div class="field"><label>箱數／件數</label><input id="eBoxes"></div><div class="field"><label>重量 kg</label><input id="eWeight" type="number" step="any" placeholder="留空＝待秤重"></div><div class="field"><label>批次／不可混標記</label><input id="eBatch"></div><div class="field"><label class="check"><input id="eCannotMix" type="checkbox"> 🔒 這批不可混</label></div><div class="field"><label>目前位置</label><select id="eLocation"><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>狀態</label><select id="eStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div><div class="field"><label>幾號要</label><input id="eDue" type="date"></div><div class="field span2"><label>備註</label><textarea id="eNote"></textarea></div><div class="field"><label class="check"><input id="eUrgent" type="checkbox"> 🔥 急件</label></div></div><div class="actions"><button class="btn primary" id="saveEdit">儲存修改</button><button class="btn secondary" id="mCancel">取消</button></div></section></div>
<script>
const SHIP_API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/shipments-demo',CAT_API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/catalog-public';
const locations=['蘆洲','五股','八里'],statuses=['未開始','處理中','完成待出貨','已出貨'];const $=id=>document.getElementById(id);let tasks=[],products=[],prices=[],view='active',filter='all',editingId=null,loadingNow=false;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function hasWeight(t){return t.weight_kg!==null&&t.weight_kg!==''}function pById(id){return products.find(p=>p.id===id)}
function formatUpdatedAt(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function mapTask(x){return {...x,vendor:x.vendor_name,item:x.item_name,productId:x.product_id||'',weight:x.weight_kg,due:x.due_date||'',shippedAt:x.shipped_at||'',batchLabel:x.batch_label||'',cannotMix:!!x.cannot_mix}}
function vendorNames(){return [...new Set(prices.map(x=>x.vendor_name))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function productsForVendor(vendor){const ids=new Set(prices.filter(x=>x.vendor_name===vendor).map(x=>x.product_id));return products.filter(p=>ids.has(p.id))}
function productOptionsForVendor(vendor,value=''){if(!vendor)return '<option value="">請先選廠商</option>';const list=productsForVendor(vendor);return '<option value="">手動輸入／不指定產品</option>'+list.map(p=>`<option value="${esc(p.id)}" ${p.id===value?'selected':''}>${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('')+(list.length?'':'<option value="" disabled>這個廠商目前沒有產品資料</option>')}
function refreshProductSelect(prefix,keep=true){const vendor=$(prefix+'Vendor').value.trim(),sel=$(prefix+'Product'),old=keep?sel.value:'';sel.disabled=!vendor;sel.innerHTML=productOptionsForVendor(vendor,old);if(old&&![...sel.options].some(o=>o.value===old))sel.value='';showPreview(prefix);const hint=$(prefix==='f'?'productHint':'eProductHint');if(!vendor)hint.textContent='先選廠商，再選產品。';else if(!productsForVendor(vendor).length)hint.textContent='這個廠商目前沒有產品資料，可直接手動輸入貨品。';else hint.textContent='已依廠商篩選產品。'}
function productImageHtml(p){const src=p?.reference_photo_path||'';return src&&(src.startsWith('http')||src.startsWith('data:'))?`<img src="${esc(src)}" alt="產品圖">`:'尚未上傳<br>產品參考圖'}
function previewHtml(p,vendor=''){if(!p)return'';const ps=prices.filter(x=>x.product_id===p.id),match=ps.find(x=>x.vendor_name===vendor);const priceText=match?`NT$ ${Number(match.unit_price).toLocaleString('zh-TW')} / ${match.unit}`:'尚無此廠商價格';return `<div class="pimg">${productImageHtml(p)}</div><div class="pinfo"><div class="prow"><b>產品</b>${esc(p.name)}</div><div class="prow"><b>材料</b>${esc(p.material||'—')}</div><div class="prow"><b>標準製程</b>${esc(p.standard_process||'—')}</div><div class="prow"><b>製程／注意事項</b>${esc(p.process_notes||'—')}</div><div class="prow"><b>這個廠商價格</b>${priceText}</div></div>`}
function showPreview(prefix){const p=pById($(prefix+'Product').value),box=$(prefix+'Preview');if(!p){box.classList.remove('show');box.innerHTML='';return}box.innerHTML=previewHtml(p,$(prefix+'Vendor').value.trim());box.classList.add('show')}
async function loadAll(silent=false){if(loadingNow)return;loadingNow=true;try{if(!silent)$('loading').style.display='block';const [sr,cr]=await Promise.all([fetch(SHIP_API,{cache:'no-store'}),fetch(CAT_API,{cache:'no-store'})]);if(!sr.ok||!cr.ok)throw new Error('load failed');const sd=await sr.json(),cd=await cr.json();tasks=(sd.shipments||[]).map(mapTask);products=cd.products||[];prices=cd.prices||[];$('vendorList').innerHTML=vendorNames().map(v=>`<option value="${esc(v)}"></option>`).join('');refreshProductSelect('f');if(editingId)refreshProductSelect('e');$('loading').style.display='none';$('syncText').textContent='☁ 已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});render()}catch(e){console.error(e);$('syncText').textContent='⚠ 同步失敗'}finally{loadingNow=false}}
function visible(t){if(view==='active'&&t.status==='已出貨')return false;if(view==='shipped'&&t.status!=='已出貨')return false;if(filter==='urgent'&&!t.urgent)return false;if(filter==='weigh'&&hasWeight(t))return false;if(locations.includes(filter)&&t.location!==filter)return false;const q=$('search').value.trim().toLowerCase();return !q||`${t.vendor} ${t.item} ${t.batchLabel} ${t.material||''} ${t.process||''} ${t.note||''}`.toLowerCase().includes(q)}
function sortTasks(a,b){if(view==='shipped')return String(b.shippedAt||b.due||'').localeCompare(String(a.shippedAt||a.due||''));if(a.urgent!==b.urgent)return a.urgent?-1:1;if(!!a.due!==!!b.due)return a.due?-1:1;if(a.due&&b.due)return a.due.localeCompare(b.due);return a.vendor.localeCompare(b.vendor,'zh-Hant')}function opts(list,v){return list.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}function tag(t){return t.productId&&pById(t.productId)?'<span class="pill product">📚產品庫</span>':''}function batchTag(t){return `${t.batchLabel?`<span class="pill normal">${esc(t.batchLabel)}</span>`:''}${t.cannotMix?'<span class="pill lock">🔒不可混</span>':''}`}
function render(){const open=tasks.filter(t=>t.status!=='已出貨'),sh=tasks.filter(t=>t.status==='已出貨');$('cActive').textContent=open.length;$('cShipped').textContent=sh.length;$('sOpen').textContent=open.length;$('sUrgent').textContent=open.filter(t=>t.urgent).length;$('sWeigh').textContent=open.filter(t=>!hasWeight(t)).length;$('sToday').textContent=open.filter(t=>t.due===today()).length;const list=tasks.filter(visible).sort(sortTasks);$('tbody').innerHTML=list.length?list.map(t=>`<tr><td><span class="pill ${t.status==='已出貨'?'shipped':t.urgent?'urgent':'normal'}">${t.status==='已出貨'?'✓出':t.urgent?'🔥急':'—'}</span></td><td><b>${esc(t.vendor)}</b></td><td>${esc(t.item)} ${tag(t)}<div style="margin-top:5px">${batchTag(t)}</div></td><td>${esc(t.material||'—')}</td><td>${esc(t.process||'—')}</td><td>${esc(t.boxes||'—')}</td><td>${hasWeight(t)?esc(t.weight)+' kg':'<span class="pending">⚖ 待秤重</span>'}</td><td><select class="loc" data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select></td><td><select class="statusSel" data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></td><td>${t.due||'未定'}</td><td>${esc(t.note||'—')}</td><td class="updatedAt">${formatUpdatedAt(t.updated_at)}</td><td><div class="ops"><button class="rowbtn" data-edit="${t.id}">查看／編輯</button><button class="rowbtn" data-fire="${t.id}">${t.urgent?'取消急':'標急'}</button></div></td></tr>`).join(''):'<tr><td colspan="13" style="text-align:center;padding:25px">沒有資料</td></tr>';$('mobile').innerHTML=list.map(t=>`<article class="mcard"><div class="mhead"><div><div class="mvendor">${esc(t.vendor)}</div><div class="mitem">${esc(t.item)} ${tag(t)}</div><div class="mtags">${batchTag(t)}</div></div><span class="pill ${t.status==='已出貨'?'shipped':t.urgent?'urgent':'normal'}">${t.status==='已出貨'?'✓ 已出貨':t.urgent?'🔥 急件':t.status}</span></div>${!hasWeight(t)?'<div class="pending" style="margin-top:10px">⚖ 待秤重</div>':''}<div class="mgrid"><div class="mcell"><small>材料</small>${esc(t.material||'—')}</div><div class="mcell"><small>製程</small>${esc(t.process||'—')}</div><div class="mcell"><small>箱數</small>${esc(t.boxes||'—')}</div><div class="mcell"><small>重量</small>${hasWeight(t)?esc(t.weight)+' kg':'待秤'}</div><div class="mcell"><small>位置</small><select data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select></div><div class="mcell"><small>狀態</small><select data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></div></div><div class="mupdated">最後更新：${formatUpdatedAt(t.updated_at)}</div><div class="mactions"><button class="rowbtn" data-edit="${t.id}">查看／編輯</button><button class="rowbtn" data-fire="${t.id}">${t.urgent?'取消急件':'🔥 標急件'}</button></div></article>`).join('');bind()}
async function patch(id,body){const r=await fetch(SHIP_API,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...body})});if(!r.ok)throw new Error(await r.text());const d=await r.json();const i=tasks.findIndex(t=>t.id===id);if(i>=0)tasks[i]=mapTask(d.shipment);$('syncText').textContent='☁ 剛剛已同步';render();return tasks[i]}
function bind(){document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>patch(el.dataset.id,{[el.dataset.field]:el.value}).catch(e=>alert('更新失敗：'+e.message)));document.querySelectorAll('[data-fire]').forEach(el=>el.onclick=()=>{const t=tasks.find(x=>x.id===el.dataset.fire);patch(t.id,{urgent:!t.urgent}).catch(e=>alert('更新失敗：'+e.message))});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit))}
function applyProduct(prefix){const p=pById($(prefix+'Product').value);if(!p){showPreview(prefix);return}$(prefix+'Item').value=p.name||'';$(prefix+'Material').value=p.material||'';$(prefix+'Process').value=p.standard_process||'';$(prefix==='f'?'productHint':'eProductHint').textContent='📚 已連結 '+p.name;showPreview(prefix)}
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('mTitle').textContent=t.vendor;$('mSub').textContent=t.item;$('eVendor').value=t.vendor||'';$('eProduct').innerHTML=productOptionsForVendor(t.vendor,t.productId);$('eProduct').disabled=!t.vendor;$('eProduct').value=t.productId||'';$('eItem').value=t.item||'';$('eMaterial').value=t.material||'';$('eProcess').value=t.process||'';$('eBoxes').value=t.boxes||'';$('eWeight').value=t.weight??'';$('eBatch').value=t.batchLabel||'';$('eCannotMix').checked=!!t.cannotMix;$('eLocation').value=t.location||'蘆洲';$('eStatus').value=t.status||'未開始';$('eDue').value=t.due||'';$('eNote').value=t.note||'';$('eUrgent').checked=!!t.urgent;$('eProductHint').textContent=t.productId?'📚 已連結產品資料庫':'未連結產品資料庫';showPreview('e');$('modalBack').classList.add('open')}
function closeEdit(){$('modalBack').classList.remove('open');editingId=null}$('saveEdit').onclick=async()=>{if(!editingId)return;const body={vendor_name:$('eVendor').value.trim(),item_name:$('eItem').value.trim(),product_id:$('eProduct').value||null,material:$('eMaterial').value.trim()||null,process:$('eProcess').value.trim()||null,boxes:$('eBoxes').value.trim()||null,weight_kg:$('eWeight').value,weigh_at:null,location:$('eLocation').value,status:$('eStatus').value,due_date:$('eDue').value||null,urgent:$('eUrgent').checked,note:$('eNote').value.trim()||null,batch_label:$('eBatch').value.trim(),cannot_mix:$('eCannotMix').checked};if(!body.vendor_name||!body.item_name){alert('至少要有廠商和貨品');return}$('modal').classList.add('saving');try{await patch(editingId,body);closeEdit()}catch(e){alert('儲存失敗：'+e.message)}finally{$('modal').classList.remove('saving')}};
$('fVendor').oninput=()=>refreshProductSelect('f',false);$('eVendor').oninput=()=>refreshProductSelect('e',false);$('fProduct').onchange=()=>applyProduct('f');$('eProduct').onchange=()=>applyProduct('e');$('toggleForm').onclick=()=>$('form').classList.toggle('open');$('cancel').onclick=()=>$('form').classList.remove('open');$('reload').onclick=()=>loadAll().catch(e=>alert(e.message));$('search').oninput=render;$('mClose').onclick=closeEdit;$('mCancel').onclick=closeEdit;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeEdit()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{view=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('addTask').onclick=async()=>{const body={vendor_name:$('fVendor').value.trim(),item_name:$('fItem').value.trim(),product_id:$('fProduct').value||null,material:$('fMaterial').value.trim()||null,process:$('fProcess').value.trim()||null,boxes:$('fBoxes').value.trim()||null,weight_kg:$('fWeight').value,weigh_at:null,location:$('fLocation').value,status:$('fStatus').value,due_date:$('fDue').value||null,urgent:$('fUrgent').checked,note:$('fNote').value.trim()||null,batch_label:$('fBatch').value.trim(),cannot_mix:$('fCannotMix').checked};if(!body.vendor_name||!body.item_name){alert('至少填廠商和貨品');return}const r=await fetch(SHIP_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert('新增失敗');return}const d=await r.json();tasks.unshift(mapTask(d.shipment));['fItem','fMaterial','fProcess','fBoxes','fWeight','fDue','fNote','fBatch'].forEach(x=>$(x).value='');$('fProduct').value='';$('fStatus').value='未開始';$('fUrgent').checked=false;$('fCannotMix').checked=false;refreshProductSelect('f');$('syncText').textContent='☁ 剛剛已同步';render()};
setInterval(()=>{if(!editingId&&!$('form').classList.contains('open')&&!document.hidden)loadAll(true)},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editingId)loadAll(true)});window.addEventListener('focus',()=>{if(!editingId)loadAll(true)});loadAll();
</script></body></html>
