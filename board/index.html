<style>
*{box-sizing:border-box}:root{--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e2e6ea;--dark:#202124;--red:#b42318;--green:#067647;--purple:#6941c6;--purplebg:#f2edff}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}.app{width:min(1450px,100%);margin:auto}h1{margin:0 0 5px;font-size:27px}.sub{margin:0;color:var(--muted);font-size:14px}.topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.demo{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#fff3cd;color:#795b00;font-size:12px;font-weight:800}.catalog-link{display:inline-block;margin-top:8px;text-decoration:none;padding:6px 10px;border-radius:999px;background:#e8eefc;color:#254ea5;font-size:12px;font-weight:900}
button,input,select,textarea{font:inherit}.tabs{display:flex;gap:8px;margin-top:16px;border-bottom:1px solid var(--line);padding-bottom:8px}.tab{border:0;background:#e9ecef;color:#444;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer}.tab.active{background:var(--dark);color:#fff}.tab .count{display:inline-block;min-width:22px;margin-left:5px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px}.tab:not(.active) .count{background:#fff;color:#666}
.toolbar{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filter{border:1px solid #d4d8de;background:#fff;border-radius:999px;padding:8px 11px;font-weight:750;cursor:pointer}.filter.active{background:var(--dark);border-color:var(--dark);color:#fff}.search{margin-left:auto;min-width:250px;border:1px solid #d4d8de;border-radius:11px;padding:10px 12px;outline:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat small{display:block;color:var(--muted);margin-bottom:3px}.stat strong{font-size:23px}.stat.urgent{background:#fff8f7}.stat.today{background:#fffbed}.stat.weigh{background:#f6f2ff}.stat.shipped{background:#eef8f2}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#e9ecef;color:#222}
.form{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}.form.open{display:block}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dbe2;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:72px;resize:vertical}.span2{grid-column:span 2}.full{grid-column:1/-1}.hint{font-size:11px;color:#667085;margin-top:5px;line-height:1.4}.hint.good{color:#067647;font-weight:800}.urgentcheck{display:flex;gap:7px;align-items:center;font-weight:800;margin-top:25px}.urgentcheck input{width:18px;height:18px}.photo-preview{width:100%;height:120px;border:1px dashed #cfd5dc;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#fafafa;color:#8b929c;font-size:13px}.photo-preview img{width:100%;height:100%;object-fit:cover}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.035)}table{width:100%;border-collapse:collapse;min-width:1500px}thead th{position:sticky;top:0;z-index:2;background:#f7f8fa;color:#59616d;font-size:12px;text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}tbody td{padding:8px 9px;border-bottom:1px solid #edf0f2;vertical-align:middle;font-size:13px}tbody tr:hover{background:#fafbfc}tr.urgent-row{background:#fff9f8}tr.today-row{box-shadow:inset 4px 0 #e3a008}.vendor{font-weight:850;white-space:nowrap}.item{min-width:150px}.product-tag{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:999px;background:#e8eefc;color:#254ea5;font-size:10px;font-weight:900}.note{max-width:210px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.due{font-weight:800;white-space:nowrap}.shipdate{display:block;margin-top:3px;color:var(--green);font-size:11px;font-weight:900}.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}.pill.urgent{background:#fee4e2;color:var(--red)}.pill.normal{background:#f0f2f5;color:#59616d}.pill.shipped{background:#eaf8ef;color:var(--green)}.weigh-alert{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;background:var(--purplebg);color:var(--purple);font-size:13px;font-weight:900;white-space:nowrap;border:1px solid #ddd2ff}.weight-known{font-weight:850;white-space:nowrap}.thumb{width:50px;height:50px;border-radius:9px;object-fit:cover;border:1px solid #dde2e7;display:block;cursor:pointer;background:#f6f7f8}.no-photo{width:50px;height:50px;border-radius:9px;border:1px dashed #cfd5dc;display:grid;place-items:center;color:#9aa1aa;font-size:10px;text-align:center;background:#fafafa}.loc,.status{border:1px solid #d8dde3;border-radius:9px;padding:7px 8px;background:#fff;min-width:90px}.status{min-width:115px}.rowbtn{border:0;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800;cursor:pointer;background:#eef1f4;color:#333}.rowbtn.fire{background:#fff0ef;color:var(--red)}.op{display:flex;gap:5px;white-space:nowrap}.empty{text-align:center;color:#888;padding:28px!important}.legend{margin-top:9px;color:#777;font-size:12px}.legend span{margin-right:12px}
.mobile-list{display:none}.mcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,.035);margin-bottom:9px}.mcard.urgent-card{border-color:#f3b7b0;background:#fffafa}.mhead{display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:start}.mphoto,.mphoto-empty{width:68px;height:68px;border-radius:12px;border:1px solid #dde2e7;object-fit:cover;background:#f7f8fa}.mphoto{cursor:pointer}.mphoto-empty{display:grid;place-items:center;color:#9aa1aa;font-size:11px;text-align:center}.mvendor{font-size:16px;font-weight:900}.mitem{font-size:14px;margin-top:4px;color:#343a40}.mtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mweigh{margin-top:10px;padding:11px 12px;border-radius:12px;background:var(--purplebg);color:var(--purple);font-weight:950;border:1px solid #ddd2ff;font-size:15px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mcell{background:#f7f8fa;border-radius:10px;padding:8px}.mcell small{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:3px}.mcell strong{font-size:13px}.mnote{margin-top:8px;color:#4b5563;font-size:13px;line-height:1.4}.mcontrols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mcontrols select{width:100%;border:1px solid #d8dde3;border-radius:10px;padding:10px;background:#fff}.mactions{display:flex;gap:8px;margin-top:8px}.mactions .rowbtn{flex:1;padding:10px}
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:18px;overflow:auto}.modal-back.open{display:grid;place-items:start center}.modal{width:min(760px,100%);background:#fff;border-radius:18px;margin:3vh auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:#edf0f2;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}.hero{margin:12px 0;height:min(44vh,360px);border-radius:14px;background:#f6f7f8;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#9299a2}.hero img{width:100%;height:100%;object-fit:contain}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detailbox{background:#f7f8fa;border-radius:11px;padding:10px}.detailbox small{display:block;color:var(--muted);font-weight:800;margin-bottom:3px}.detailbox strong{font-size:15px}.modal-edit{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:900px){body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.search{order:10;margin-left:0;width:100%;min-width:0}.formgrid{grid-template-columns:1fr 1fr}.tablewrap{display:none}.mobile-list{display:block}.legend{display:none}}
@media(max-width:560px){h1{font-size:23px}.tabs{position:sticky;top:0;z-index:8;background:var(--bg);padding-top:4px}.tab{flex:1;padding:10px 8px}.formgrid,.detailgrid,.editgrid{grid-template-columns:1fr}.span2,.full{grid-column:span 1}.urgentcheck{margin-top:3px}.stat strong{font-size:20px}.modal-back{padding:8px}.modal{padding:14px}.hero{height:240px}}
</style>
</head>
<body>
<main class="app">
<h1>工廠貨件進度表</h1>
<p class="sub">蘆洲、五股、八里共用的貨件進度與出貨紀錄。</p>
<div class="topline"><div class="demo">⚠ 貨件目前仍存在這台瀏覽器；產品清單已讀取 Supabase</div><a class="catalog-link" href="../calculator/">📚 產品／價格／製程知識庫</a></div>
<div class="tabs"><button class="tab active" data-viewtab="active">貨件進度 <span class="count" id="activeTabCount">0</span></button><button class="tab" data-viewtab="shipped">出貨紀錄 <span class="count" id="shipTabCount">0</span></button></div>
<section class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="蘆洲">蘆洲</button><button class="filter" data-filter="五股">五股</button><button class="filter" data-filter="八里">八里</button><button class="filter progress-only" data-filter="urgent">🔥 急件</button><button class="filter progress-only" data-filter="weigh">⚖ 待秤重</button><button class="filter progress-only" data-filter="today">今天要</button><input id="search" class="search" placeholder="搜尋廠商、貨品、材料、製程、備註"></section>
<section class="stats"><div class="stat"><small id="statLabel1">未完成</small><strong id="statCount1">0</strong></div><div class="stat urgent" id="stat2"><small id="statLabel2">🔥 急件</small><strong id="statCount2">0</strong></div><div class="stat weigh" id="stat3"><small id="statLabel3">⚖ 待秤重</small><strong id="statCount3">0</strong></div><div class="stat today" id="stat4"><small id="statLabel4">今天要</small><strong id="statCount4">0</strong></div></section>
<div class="actions" id="progressActions"><button class="btn primary" id="toggleForm">＋ 新增貨件</button><button class="btn secondary" id="restoreDemo">恢復示範資料</button></div>
<section class="form" id="newForm"><div class="formgrid">
<div class="field span2"><label>從產品資料庫選擇</label><select id="fProduct"><option value="">手動輸入／不指定產品</option></select><div class="hint" id="fProductHint">選產品後會自動帶入品名、材料、標準製程。</div></div>
<div class="field"><label>廠商</label><input id="fVendor" list="vendorList" placeholder="例如：甲公司"><datalist id="vendorList"></datalist></div><div class="field"><label>貨品／內容</label><input id="fItem" placeholder="例如：軸心 A款"></div><div class="field"><label>材料</label><input id="fMaterial" placeholder="例如：SUS304"></div><div class="field"><label>製程</label><input id="fProcess" placeholder="例如：粗研＋研亮"></div><div class="field"><label>箱數／件數</label><input id="fBoxes" placeholder="例如：2箱、3籃"></div><div class="field"><label>重量 kg（不知道可留空）</label><input id="fWeight" inputmode="decimal" type="number" step="any" min="0" placeholder="留空＝待秤重"></div><div class="field"><label>若待秤重，要在哪秤</label><select id="fWeighAt"><option value="">未指定</option><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>目前位置</label><select id="fLocation"><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>幾號要（可留空）</label><input id="fDue" type="date"></div><div class="field"><label>狀態</label><select id="fStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div><div class="field span2"><label>備註</label><textarea id="fNote" placeholder="客戶會問、先做、要特別研亮、送去哪裡…"></textarea></div><div class="field span2"><label>這批來貨照片</label><input id="fPhoto" type="file" accept="image/*"><div class="photo-preview" id="fPhotoPreview">尚未選照片</div><div class="hint">這張是「這一批貨」的照片；產品參考圖會留在產品資料庫共用。</div></div><label class="urgentcheck"><input type="checkbox" id="fUrgent">🔥 急件／趕件</label>
</div><div class="actions"><button class="btn primary" id="addTask">新增</button><button class="btn secondary" id="cancelForm">取消</button></div></section>
<div class="tablewrap"><table><thead><tr><th>急</th><th>照片</th><th>廠商</th><th>貨品</th><th>材料</th><th>製程</th><th>箱數</th><th>重量</th><th>目前位置</th><th>狀態</th><th>日期</th><th>備註</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="mobileList" class="mobile-list"></div><div class="legend" id="legend"><span>📚＝已連到產品資料庫</span><span>🟡 左黃線＝今天要</span><span>⚖＝尚未秤重</span><span>🔥＝急件</span></div>
</main>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><div><h2 id="mTitle">貨件詳細</h2><div class="sub" id="mSub"></div></div><button class="close" id="mClose">×</button></div><div class="hero" id="mHero">沒有這批來貨照片</div><div class="detailgrid" id="mDetails"></div><div class="modal-edit"><strong>修改這筆資料</strong><div class="editgrid" style="margin-top:9px"><div class="field full"><label>產品資料庫</label><select id="eProduct"><option value="">手動輸入／不指定產品</option></select><div class="hint" id="eProductHint"></div></div><div class="field"><label>廠商</label><input id="eVendor" list="vendorList"></div><div class="field"><label>貨品</label><input id="eItem"></div><div class="field"><label>材料</label><input id="eMaterial"></div><div class="field"><label>製程</label><input id="eProcess"></div><div class="field"><label>箱數／件數</label><input id="eBoxes"></div><div class="field"><label>重量 kg（留空＝待秤重）</label><input id="eWeight" type="number" step="any" min="0"></div><div class="field"><label>待秤重地點</label><select id="eWeighAt"><option value="">未指定</option><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>目前位置</label><select id="eLocation"><option>蘆洲</option><option>五股</option><option>八里</option></select></div><div class="field"><label>狀態</label><select id="eStatus"><option>未開始</option><option>處理中</option><option>完成待出貨</option><option>已出貨</option></select></div><div class="field"><label>幾號要（可留空）</label><input id="eDue" type="date"></div><div class="field full"><label>備註</label><textarea id="eNote"></textarea></div><div class="field full"><label>換這批來貨照片</label><input id="ePhoto" type="file" accept="image/*"></div></div><div class="actions"><button class="btn primary" id="saveEdit">儲存修改</button><button class="btn secondary" id="toggleUrgent">切換急件</button></div></div></div></div>
<script>
const STORE='factory-board-product-linked-v1';
const CATALOG_API='https://icqdmzndjmxffnlciijs.supabase.co/functions/v1/catalog-public';
const locations=['蘆洲','五股','八里'],statuses=['未開始','處理中','完成待出貨','已出貨'];
let activeFilter='all',activeView='active',currentId=null,newPhoto='',products=[],prices=[];
const $=x=>document.getElementById(x);
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function offset(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fakePhoto(label,bg='#dbeafe'){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="100%" height="100%" fill="${bg}"/><circle cx="210" cy="210" r="82" fill="#8b95a5"/><rect x="285" y="125" width="175" height="170" rx="24" fill="#c8ced8"/><text x="320" y="380" font-size="34" text-anchor="middle" fill="#374151" font-family="sans-serif">${label}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function demo(){return [
{id:uid(),productId:'',vendor:'測試甲精密',item:'軸心 A款',material:'SUS304',process:'粗研＋研亮',boxes:'2箱',weight:'',weighAt:'五股',location:'蘆洲',status:'未開始',due:offset(0),urgent:true,note:'客戶下午可能會問，這批先處理。',photo:fakePhoto('軸心 A款'),shippedAt:''},
{id:uid(),productId:'',vendor:'測試乙工業',item:'不鏽鋼小件',material:'SUS304',process:'去毛邊',boxes:'1桶',weight:'82.4',weighAt:'',location:'蘆洲',status:'處理中',due:offset(2),urgent:false,note:'表面不能刮傷。',photo:fakePhoto('不鏽鋼小件','#dcfce7'),shippedAt:''},
{id:uid(),productId:'',vendor:'測試己實業',item:'螺絲',material:'鐵',process:'滾筒研磨',boxes:'3籃',weight:'',weighAt:'五股',location:'五股',status:'處理中',due:offset(1),urgent:true,note:'五股直送，不經過蘆洲。',photo:fakePhoto('螺絲','#fef3c7'),shippedAt:''},
{id:uid(),productId:'',vendor:'測試丙企業',item:'鋁件',material:'鋁',process:'研亮',boxes:'4箱',weight:'126',weighAt:'',location:'五股',status:'完成待出貨',due:offset(0),urgent:false,note:'做好，等客戶車來載。',photo:fakePhoto('鋁件','#ede9fe'),shippedAt:''},
{id:uid(),productId:'',vendor:'測試庚有限公司',item:'薄片件',material:'SUS316',process:'研亮',boxes:'5盤',weight:'91.3',weighAt:'',location:'八里',status:'處理中',due:'',urgent:false,note:'目前未定交期。',photo:'',shippedAt:''},
{id:uid(),productId:'',vendor:'測試甲精密',item:'軸心 A款',material:'SUS304',process:'粗研＋研亮',boxes:'1箱',weight:'34.5',weighAt:'',location:'蘆洲',status:'已出貨',due:offset(-2),urgent:false,note:'客戶已自取。',photo:'',shippedAt:offset(-2)}]}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(x))return x}catch(e){}const x=demo();save(x);return x}function save(x){localStorage.setItem(STORE,JSON.stringify(x))}let tasks=load();
function productById(id){return products.find(p=>p.id===id)}
function productPrices(id){return prices.filter(p=>p.product_id===id)}
function productOptions(value=''){return '<option value="">手動輸入／不指定產品</option>'+products.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-Hant')).map(p=>`<option value="${esc(p.id)}" ${p.id===value?'selected':''}>${esc(p.name)}${p.material?'｜'+esc(p.material):''}</option>`).join('')}
function updatePriceHint(prefix){const pid=$(prefix+'Product').value,vendor=$(prefix+'Vendor').value.trim(),box=$(prefix+'ProductHint');if(!pid){box.textContent='未連結產品資料庫，可手動輸入。';box.className='hint';return}const p=productById(pid),list=productPrices(pid),match=list.find(x=>x.vendor_name===vendor);let msg='📚 已連結 '+(p?.name||'產品');if(match)msg+=`｜${vendor}：NT$ ${Number(match.unit_price).toLocaleString('zh-TW')} / ${match.unit}`;else if(list.length)msg+='｜已有價格：'+list.map(x=>`${x.vendor_name} ${Number(x.unit_price).toLocaleString('zh-TW')}/${x.unit}`).join('、');box.textContent=msg;box.className='hint good'}
function applyProduct(prefix){const pid=$(prefix+'Product').value,p=productById(pid);if(p){$(prefix+'Item').value=p.name||'';$(prefix+'Material').value=p.material||'';$(prefix+'Process').value=p.standard_process||'';const list=productPrices(pid);if(!$(prefix+'Vendor').value.trim()&&list.length===1)$(prefix+'Vendor').value=list[0].vendor_name}updatePriceHint(prefix)}
async function loadCatalog(){try{const r=await fetch(CATALOG_API);if(!r.ok)throw new Error(r.status);const data=await r.json();products=data.products||[];prices=data.prices||[];$('fProduct').innerHTML=productOptions('');$('eProduct').innerHTML=productOptions('');$('vendorList').innerHTML=[...new Set(prices.map(x=>x.vendor_name))].sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(v=>`<option value="${esc(v)}"></option>`).join('');let changed=false;tasks.forEach(t=>{if(!t.productId){const p=products.find(p=>p.name===t.item);if(p){t.productId=p.id;changed=true}}});if(changed)save(tasks);render()}catch(e){console.error(e);$('fProductHint').textContent='產品資料庫目前讀取失敗，仍可手動輸入。'}}
const tbody=$('tbody'),mobileList=$('mobileList'),search=$('search'),newForm=$('newForm'),modalBack=$('modalBack');
function today(){return offset(0)}function opts(list,val){return list.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}function hasWeight(t){return t.weight!==''&&t.weight!==null&&t.weight!==undefined}function dateText(d){return d?d.slice(5).replace('-','/'):'未定交期'}function shipText(d){return d?d.slice(5).replace('-','/'):'未記錄'}
function visible(t){if(activeView==='active'&&t.status==='已出貨')return false;if(activeView==='shipped'&&t.status!=='已出貨')return false;if(activeFilter==='urgent'&&!t.urgent)return false;if(activeFilter==='weigh'&&hasWeight(t))return false;if(activeFilter==='today'&&t.due!==today())return false;if(locations.includes(activeFilter)&&t.location!==activeFilter)return false;const q=search.value.trim().toLowerCase();return !q||`${t.vendor} ${t.item} ${t.material} ${t.process} ${t.note} ${t.location} ${t.status}`.toLowerCase().includes(q)}
function sortTasks(a,b){if(activeView==='shipped')return (b.shippedAt||b.due||'').localeCompare(a.shippedAt||a.due||'');if(a.urgent!==b.urgent)return a.urgent?-1:1;if(!!a.due!==!!b.due)return a.due?-1:1;if(a.due&&b.due)return a.due.localeCompare(b.due);return String(a.vendor).localeCompare(String(b.vendor),'zh-Hant')}
function thumbHtml(t,cls='thumb'){return t.photo?`<img class="${cls}" src="${t.photo}" data-view="${t.id}" alt="貨件照片">`:`<div class="${cls==='thumb'?'no-photo':'mphoto-empty'}">無照片</div>`}function weightHtml(t,m=false){if(hasWeight(t))return `<span class="weight-known">${esc(t.weight)} kg</span>`;return `<div class="${m?'mweigh':'weigh-alert'}">⚖ 待秤重${t.weighAt?'｜'+esc(t.weighAt):''}</div>`}function dateCell(t){return activeView==='shipped'?`${dateText(t.due)}<span class="shipdate">出貨 ${shipText(t.shippedAt)}</span>`:`${t.due===today()?'今天｜':''}${dateText(t.due)}`}
function updateStats(){const open=tasks.filter(t=>t.status!=='已出貨'),shipped=tasks.filter(t=>t.status==='已出貨');$('activeTabCount').textContent=open.length;$('shipTabCount').textContent=shipped.length;if(activeView==='active'){$('statLabel1').textContent='未完成';$('statCount1').textContent=open.length;$('statLabel2').textContent='🔥 急件';$('statCount2').textContent=open.filter(t=>t.urgent).length;$('statLabel3').textContent='⚖ 待秤重';$('statCount3').textContent=open.filter(t=>!hasWeight(t)).length;$('statLabel4').textContent='今天要';$('statCount4').textContent=open.filter(t=>t.due===today()).length;$('stat2').className='stat urgent';$('stat3').className='stat weigh';$('stat4').className='stat today'}else{$('statLabel1').textContent='已出貨';$('statCount1').textContent=shipped.length;$('statLabel2').textContent='蘆洲';$('statCount2').textContent=shipped.filter(t=>t.location==='蘆洲').length;$('statLabel3').textContent='五股';$('statCount3').textContent=shipped.filter(t=>t.location==='五股').length;$('statLabel4').textContent='八里';$('statCount4').textContent=shipped.filter(t=>t.location==='八里').length;$('stat2').className=$('stat3').className=$('stat4').className='stat shipped'}}
function productTag(t){return t.productId&&productById(t.productId)?'<span class="product-tag">📚產品庫</span>':''}
function render(){const list=tasks.filter(visible).sort(sortTasks);tbody.innerHTML=list.length?list.map(t=>`<tr class="${t.urgent&&activeView==='active'?'urgent-row ':''}${t.due===today()&&activeView==='active'?'today-row ':''}"><td>${activeView==='shipped'?'<span class="pill shipped">✓ 出</span>':`<span class="pill ${t.urgent?'urgent':'normal'}">${t.urgent?'🔥急':'—'}</span>`}</td><td>${thumbHtml(t)}</td><td class="vendor">${esc(t.vendor)}</td><td class="item">${esc(t.item)}${productTag(t)}</td><td>${esc(t.material||'—')}</td><td>${esc(t.process||'—')}</td><td>${esc(t.boxes||'—')}</td><td>${weightHtml(t)}</td><td><select class="loc" data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select></td><td><select class="status" data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></td><td class="due">${dateCell(t)}</td><td class="note" title="${esc(t.note)}">${esc(t.note||'—')}</td><td><div class="op"><button class="rowbtn" data-view="${t.id}">查看</button>${activeView==='active'?`<button class="rowbtn fire" data-fire="${t.id}">${t.urgent?'取消急':'標急'}</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="13" class="empty">${activeView==='shipped'?'目前沒有出貨紀錄':'沒有符合的貨件'}</td></tr>`;
mobileList.innerHTML=list.length?list.map(t=>`<article class="mcard ${t.urgent&&activeView==='active'?'urgent-card':''}"><div class="mhead">${thumbHtml(t,'mphoto')}<div><div class="mvendor">${esc(t.vendor)}</div><div class="mitem">${esc(t.item)} ${productTag(t)}</div><div class="mtags">${activeView==='shipped'?'<span class="pill shipped">✓ 已出貨</span>':(t.urgent?'<span class="pill urgent">🔥 急件</span>':'')}<span class="pill normal">${esc(t.location)}</span></div></div><button class="rowbtn" data-view="${t.id}">查看</button></div>${!hasWeight(t)?weightHtml(t,true):''}<div class="mgrid"><div class="mcell"><small>材料</small><strong>${esc(t.material||'—')}</strong></div><div class="mcell"><small>製程</small><strong>${esc(t.process||'—')}</strong></div><div class="mcell"><small>箱數</small><strong>${esc(t.boxes||'—')}</strong></div><div class="mcell"><small>重量</small><strong>${hasWeight(t)?esc(t.weight)+' kg':'尚未秤重'}</strong></div><div class="mcell"><small>幾號要</small><strong>${dateText(t.due)}</strong></div><div class="mcell"><small>${activeView==='shipped'?'出貨日':'狀態'}</small><strong>${activeView==='shipped'?shipText(t.shippedAt):esc(t.status)}</strong></div></div>${t.note?`<div class="mnote">📝 ${esc(t.note)}</div>`:''}<div class="mcontrols"><select data-id="${t.id}" data-field="location">${opts(locations,t.location)}</select><select data-id="${t.id}" data-field="status">${opts(statuses,t.status)}</select></div><div class="mactions">${activeView==='active'?`<button class="rowbtn fire" data-fire="${t.id}">${t.urgent?'取消急件':'🔥 標急件'}</button>`:''}<button class="rowbtn" data-view="${t.id}">查看／編輯</button></div></article>`).join(''):`<div class="empty">沒有符合的貨件</div>`;updateStats();$('progressActions').style.display=activeView==='active'?'flex':'none';$('legend').style.display=activeView==='active'?'block':'none';document.querySelectorAll('.progress-only').forEach(x=>x.style.display=activeView==='active'?'inline-block':'none');bindDynamic()}
function setStatus(t,s){const old=t.status;t.status=s;if(s==='已出貨'&&old!=='已出貨'&&!t.shippedAt)t.shippedAt=today();if(s!=='已出貨'&&old==='已出貨')t.shippedAt=''}
function bindDynamic(){document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const t=tasks.find(x=>x.id===el.dataset.id);if(!t)return;el.dataset.field==='status'?setStatus(t,el.value):t[el.dataset.field]=el.value;save(tasks);render()});document.querySelectorAll('[data-fire]').forEach(el=>el.onclick=()=>{const t=tasks.find(x=>x.id===el.dataset.fire);if(t){t.urgent=!t.urgent;save(tasks);render()}});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>openModal(el.dataset.view))}
function openModal(taskId){const t=tasks.find(x=>x.id===taskId);if(!t)return;currentId=taskId;$('mTitle').textContent=t.vendor;$('mSub').innerHTML=esc(t.item)+(t.productId&&productById(t.productId)?' · 📚 已連產品庫':'');$('mHero').innerHTML=t.photo?`<img src="${t.photo}" alt="貨件大圖">`:'沒有這批來貨照片';$('mDetails').innerHTML=`<div class="detailbox"><small>材料</small><strong>${esc(t.material||'—')}</strong></div><div class="detailbox"><small>製程</small><strong>${esc(t.process||'—')}</strong></div><div class="detailbox"><small>箱數／件數</small><strong>${esc(t.boxes||'—')}</strong></div><div class="detailbox"><small>重量</small><strong>${hasWeight(t)?esc(t.weight)+' kg':'⚖ 待秤重'}</strong></div><div class="detailbox"><small>目前位置</small><strong>${esc(t.location)}</strong></div><div class="detailbox"><small>狀態</small><strong>${esc(t.status)}</strong></div><div class="detailbox"><small>幾號要</small><strong>${dateText(t.due)}</strong></div><div class="detailbox"><small>出貨日</small><strong>${t.status==='已出貨'?shipText(t.shippedAt):'—'}</strong></div><div class="detailbox full"><small>備註</small><strong>${esc(t.note||'—')}</strong></div>`;$('eProduct').innerHTML=productOptions(t.productId||'');$('eProduct').value=t.productId||'';['Vendor','Item','Material','Process','Boxes','Weight','WeighAt','Location','Status','Due','Note'].forEach(k=>{const el=$('e'+k);el.value=t[k.charAt(0).toLowerCase()+k.slice(1)]??''});$('ePhoto').value='';updatePriceHint('e');modalBack.classList.add('open')}
function closeModal(){modalBack.classList.remove('open');currentId=null}function fileToData(file,cb){if(!file){cb('');return}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
$('saveEdit').onclick=()=>{const t=tasks.find(x=>x.id===currentId);if(!t)return;const apply=photo=>{t.productId=$('eProduct').value;t.vendor=$('eVendor').value.trim();t.item=$('eItem').value.trim();t.material=$('eMaterial').value.trim();t.process=$('eProcess').value.trim();t.boxes=$('eBoxes').value.trim();t.weight=$('eWeight').value.trim();t.weighAt=$('eWeighAt').value;t.location=$('eLocation').value;setStatus(t,$('eStatus').value);t.due=$('eDue').value;t.note=$('eNote').value.trim();if(photo)t.photo=photo;save(tasks);closeModal();render()};const f=$('ePhoto').files[0];f?fileToData(f,apply):apply('')};$('toggleUrgent').onclick=()=>{const t=tasks.find(x=>x.id===currentId);if(t){t.urgent=!t.urgent;save(tasks);openModal(currentId);render()}};$('mClose').onclick=closeModal;modalBack.onclick=e=>{if(e.target===modalBack)closeModal()};
document.querySelectorAll('[data-viewtab]').forEach(b=>b.onclick=()=>{activeView=b.dataset.viewtab;activeFilter='all';document.querySelectorAll('[data-viewtab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));newForm.classList.remove('open');render()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});search.oninput=render;$('toggleForm').onclick=()=>newForm.classList.toggle('open');$('cancelForm').onclick=()=>newForm.classList.remove('open');$('restoreDemo').onclick=()=>{tasks=demo();save(tasks);loadCatalog();render()};
$('fProduct').onchange=()=>applyProduct('f');$('eProduct').onchange=()=>applyProduct('e');$('fVendor').oninput=()=>updatePriceHint('f');$('eVendor').oninput=()=>updatePriceHint('e');$('fPhoto').onchange=()=>{const f=$('fPhoto').files[0];if(!f){newPhoto='';$('fPhotoPreview').textContent='尚未選照片';return}fileToData(f,d=>{newPhoto=d;$('fPhotoPreview').innerHTML=`<img src="${d}" alt="預覽">`})};
$('addTask').onclick=()=>{const vendor=$('fVendor').value.trim(),item=$('fItem').value.trim();if(!vendor||!item){alert('至少要填廠商和貨品');return}const status=$('fStatus').value;tasks.unshift({id:uid(),productId:$('fProduct').value,vendor,item,material:$('fMaterial').value.trim(),process:$('fProcess').value.trim(),boxes:$('fBoxes').value.trim(),weight:$('fWeight').value.trim(),weighAt:$('fWeighAt').value,location:$('fLocation').value,status,due:$('fDue').value,urgent:$('fUrgent').checked,note:$('fNote').value.trim(),photo:newPhoto,shippedAt:status==='已出貨'?today():''});save(tasks);['fVendor','fItem','fMaterial','fProcess','fBoxes','fWeight','fDue','fNote'].forEach(x=>$(x).value='');$('fProduct').value='';$('fWeighAt').value='';$('fLocation').value='蘆洲';$('fStatus').value='未開始';$('fUrgent').checked=false;$('fPhoto').value='';$('fPhotoPreview').textContent='尚未選照片';$('fProductHint').textContent='選產品後會自動帶入品名、材料、標準製程。';newPhoto='';newForm.classList.remove('open');render()};
render();loadCatalog();
</script>
